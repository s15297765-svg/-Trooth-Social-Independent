<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Messenger</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:800}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#40916c;color:#fff}.home{background:#fff;color:#2d6a4f}.wrap{width:min(1100px,94%);margin:20px auto;display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:#fff;border-radius:18px;box-shadow:0 5px 20px #245c3a18;overflow:hidden}.head{padding:18px;border-bottom:1px solid #e3eee7}.search{width:100%;padding:11px;border:1px solid #d8e9de;border-radius:10px;outline:0}.people{max-height:650px;overflow:auto}.person{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #edf4ef;cursor:pointer}.person:hover{background:#f2faf5}.person.active{background:#d8f3dc}.avatar{width:46px;height:46px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.info{min-width:0;flex:1}.info b,.info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.muted{color:#718276;font-size:13px}.online{display:inline-flex;align-items:center;gap:5px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b7c1ba}.dot.live{background:#2d6a4f;box-shadow:0 0 0 3px #d8f3dc}.chat{display:flex;flex-direction:column;min-height:700px}.chatHead{padding:15px 18px;border-bottom:1px solid #e3eee7;display:flex;align-items:center;gap:10px}.msgs{flex:1;padding:18px;overflow:auto;min-height:480px;background:#fbfefc}.msg{max-width:76%;margin:7px 0;padding:10px 12px;border-radius:15px;background:#edf7f0;word-break:break-word}.mine{margin-left:auto;background:#d8f3dc}.msg small{display:block;color:#718276;margin-top:4px}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #e3eee7}.compose input{flex:1;padding:12px;border:1px solid #d8e9de;border-radius:10px;outline:0}.typing{padding:0 18px 8px;color:#718276;font-size:12px;min-height:20px}.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#2d6a4f;color:#fff;font-size:11px;font-weight:800;margin-left:auto}@media(max-width:750px){.wrap{grid-template-columns:1fr}.people{max-height:260px}.chat{min-height:560px}.msgs{min-height:330px}}</style></head><body><header class="top"><div class="logo">Trooth Messenger</div><button class="btn home" onclick="location.href='index.html'">🏠 Home</button></header><main class="wrap"><section class="card"><div class="head"><h2 style="margin:0 0 10px">💬 Messages</h2><input id="search" class="search" placeholder="Search people..." oninput="renderPeople()"></div><div id="people" class="people"><div class="empty">Loading...</div></div></section><section class="card chat"><div id="chatHead" class="chatHead"><div class="empty">Select someone to start chatting.</div></div><div id="msgs" class="msgs"><div class="empty">Your private conversation will appear here.</div></div><div id="typing" class="typing"></div><div class="compose"><input id="input" placeholder="Write a message..." disabled oninput="handleTyping()" onkeydown="if(event.key==='Enter')send()"><button id="send" class="btn" disabled onclick="send()">Send</button></div></section></main><script src="supabase-client.js"></script><script>let sb,user,people=[],selected=null,channel,renderTimer,loading=false,typingTimer,presenceTimer;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const ready=()=>new Promise(r=>window.troothSupabase?r():window.addEventListener('trooth-supabase-ready',r,{once:true}));const nm=p=>p?.display_name||'Trooth Member';function av(p){return p?.avatar_url?`<div class="avatar"><img src="${esc(p.avatar_url)}" alt=""></div>`:`<div class="avatar">${esc(nm(p)[0].toUpperCase())}</div>`}function schedulePeople(){clearTimeout(renderTimer);renderTimer=setTimeout(renderPeople,80)}async function init(){await ready();sb=window.troothSupabase;await refreshAuth();sb.auth.onAuthStateChange(function(event,session){user=session?.user||null;cleanupChannel();if(user){setTimeout(start,0)}else{people=[];selected=null;$('people').innerHTML='<div class="empty">Please login first.</div>';resetChat()}});window.addEventListener('trooth-messages-refresh',schedulePeople);window.addEventListener('trooth-notifications-refresh',schedulePeople);window.addEventListener('beforeunload',cleanupChannel)}async function refreshAuth(){const r=await sb.auth.getUser();user=r.data?.user||null;if(user)await start();else $('people').innerHTML='<div class="empty">Please login first.</div>'}async function start(){if(!user||loading)return;loading=true;try{const q=await sb.from('profiles').select('id,display_name,bio,avatar_url,is_public').neq('id',user.id).order('display_name');people=(q.data||[]).filter(x=>x.is_public!==false);await renderPeople();subscribe();const target=new URLSearchParams(location.search).get('user');if(target&&people.some(p=>p.id===target))await select(target)}finally{loading=false}}async function renderPeople(){if(!sb||!user)return;const q=($('search').value||'').toLowerCase();const list=people.filter(p=>(nm(p)+' '+(p.bio||'')).toLowerCase().includes(q));const unread=await getUnreadCounts();$('people').innerHTML=list.map(p=>`<div class="person" data-user-id="${p.id}" data-active="${selected===p.id}" onclick="select('${p.id}')">${av(p)}<div class="info"><b>${esc(nm(p))}</b><span class="muted">${esc(p.bio||'Trooth Member')}</span></div>${unread[p.id]?`<span class="badge">${unread[p.id]>99?'99+':unread[p.id]}</span>`:''}</div>`).join('')||'<div class="empty">No people found.</div>'}async function getUnreadCounts(){const out={};if(!user)return out;const r=await sb.from('messages').select('sender_id').eq('receiver_id',user.id).eq('is_read',false);(r.data||[]).forEach(x=>out[x.sender_id]=(out[x.sender_id]||0)+1);return out}async function select(id){if(!user||!people.some(p=>p.id===id))return;selected=id;const p=people.find(x=>x.id===id)||{};$('chatHead').innerHTML=`<div data-user-id="${p.id}">${av(p)}<div><b>${esc(nm(p))}</b><div class="online muted"><span id="peerDot" class="dot"></span><span id="peerState">Checking presence…</span></div></div></div>`;$('input').disabled=false;$('send').disabled=false;window.dispatchEvent(new CustomEvent('trooth-chat-peer-change',{detail:{userId:id}}));await load();await read();schedulePeople();$('input').focus();updatePeerPresence()}async function load(){if(!selected||!user)return;const r=await sb.from('messages').select('id,sender_id,receiver_id,body,created_at,is_read').or(`and(sender_id.eq.${user.id},receiver_id.eq.${selected}),and(sender_id.eq.${selected},receiver_id.eq.${user.id})`).order('created_at');if(r.error){$('msgs').innerHTML='<div class="empty">Unable to load messages.</div>';return}$('msgs').innerHTML=(r.data||[]).map(m=>`<div class="msg ${m.sender_id===user.id?'mine':''}"><div>${esc(m.body)}</div><small>${new Date(m.created_at).toLocaleString()} ${m.sender_id===user.id?(m.is_read?'✓✓':'✓'):''}</small></div>`).join('')||'<div class="empty">No messages yet. Say hello 👋</div>';$('msgs').scrollTop=$('msgs').scrollHeight}async function read(){if(!selected||!user)return;const r=await sb.from('messages').update({is_read:true}).eq('sender_id',selected).eq('receiver_id',user.id).eq('is_read',false);if(!r.error)schedulePeople()}function handleTyping(){if(!selected||!user||!channel)return;clearTimeout(typingTimer);channel.send({type:'broadcast',event:'typing',payload:{from:user.id,to:selected,typing:true}});typingTimer=setTimeout(function(){if(channel)channel.send({type:'broadcast',event:'typing',payload:{from:user.id,to:selected,typing:false}})},1200)}function showTyping(isTyping){if(!selected)return;$('typing').textContent=isTyping?'✍️ '+nm(people.find(p=>p.id===selected))+' is typing…':''}async function updatePeerPresence(){if(!selected||!user||!channel)return;try{const state=channel.presenceState();const peer=state[selected];const live=Array.isArray(peer)&&peer.length>0;$('peerDot').classList.toggle('live',live);$('peerState').textContent=live?'Active now':'Offline';}catch(e){$('peerState').textContent='Private conversation'}}function broadcastPresence(){if(channel&&user)channel.track({user_id:user.id,online_at:new Date().toISOString()}).catch(function(){})}function cleanupChannel(){clearTimeout(typingTimer);clearInterval(presenceTimer);if(channel&&sb){try{sb.removeChannel(channel)}catch(e){}}channel=null}function subscribe(){cleanupChannel();if(!sb||!user)return;const uid=user.id;channel=sb.channel('trooth-messenger-live-'+uid,{config:{broadcast:{self:false},presence:{key:uid}}}).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'receiver_id=eq.'+uid},function(payload){const m=payload.new||payload.old||{};if(m.sender_id===uid||m.receiver_id===uid){if(selected&&(m.sender_id===selected||m.receiver_id===selected))load();schedulePeople();window.dispatchEvent(new CustomEvent('trooth-notifications-refresh'))}}).on('broadcast',{event:'typing'},function(payload){const p=payload.payload||{};if(p.to===uid&&p.from===selected){showTyping(!!p.typing);if(p.typing){clearTimeout(typingTimer);typingTimer=setTimeout(function(){showTyping(false)},1800)}}}).on('presence',{event:'sync'},function(){updatePeerPresence()}).subscribe(function(status){if(status==='SUBSCRIBED'){broadcastPresence();presenceTimer=setInterval(broadcastPresence,25000);updatePeerPresence()}})}async function send(){const body=$('input').value.trim();if(!body||!selected||!user)return;$('send').disabled=true;const r=await sb.from('messages').insert({sender_id:user.id,receiver_id:selected,body,is_read:false});if(r.error){alert(r.error.message);$('send').disabled=false;return}if(channel)channel.send({type:'broadcast',event:'typing',payload:{from:user.id,to:selected,typing:false}});const note=await sb.from('notifications').insert({user_id:selected,actor_id:user.id,kind:'message',body:'💬 You received a new message on Trooth',is_read:false});if(note.error)console.warn('Trooth message notification:',note.error.message);$('input').value='';showTyping(false);await load();$('send').disabled=false;window.dispatchEvent(new CustomEvent('trooth-notifications-refresh'));window.dispatchEvent(new CustomEvent('trooth-messages-refresh'))}function resetChat(){$('chatHead').innerHTML='<div class="empty">Select someone to start chatting.</div>';$('msgs').innerHTML='<div class="empty">Your private conversation will appear here.</div>';$('input').disabled=true;$('send').disabled=true;$('typing').textContent=''}init();</script></body></html>
