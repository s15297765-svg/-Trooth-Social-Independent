<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Property Center</title><style>:root{--g:#b8f2c2;--d:#14532d;--bg:#f3fff5;--w:#fff;--b:#cdebd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#18321f}header{background:var(--g);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:4;box-shadow:0 2px 10px #0001}h1{margin:0;color:var(--d);font-size:24px}nav a{margin-left:10px;color:var(--d);text-decoration:none;font-weight:bold}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.hero,.card,.property{background:var(--w);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 14px #0001}.hero{background:linear-gradient(135deg,#dffff0,var(--g))}.hero h2{margin:0;color:var(--d)}.search{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;font-size:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn,.tabs button{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:var(--d);font-weight:bold;cursor:pointer}.tabs .active{background:var(--d);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.property h3{color:var(--d);margin:7px 0}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--g);color:var(--d);font-size:12px;font-weight:bold}.meta{font-size:13px;color:#607366;margin:8px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font:inherit}.form textarea{min-height:100px}.full{grid-column:1/-1}@media(max-width:650px){.form{grid-template-columns:1fr}nav{display:none}}</style></head><body><header><h1>🏠 Trooth Property</h1><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="stores.html">Stores</a><a href="auth.html">Profile</a></nav></header><main class="wrap"><section class="hero"><h2>Property Center</h2><p>Find property for sale or rent, and publish your own property listings on Trooth.</p></section><section class="card"><input id="search" class="search" placeholder="Search city, property or description..."><div class="tabs"><button class="active" data-type="All">All</button><button data-type="For Sale">🏷️ For Sale</button><button data-type="For Rent">🔑 For Rent</button></div></section><section id="list" class="grid"></section><section class="card"><h2>Publish Property Listing</h2><form id="form" class="form"><input id="title" placeholder="Property title" required><select id="type"><option>For Sale</option><option>For Rent</option></select><input id="city" placeholder="City / Location" required><input id="price" placeholder="Price / Rent" required><input id="beds" placeholder="Bedrooms (optional)"><input id="area" placeholder="Area e.g. 1200 sq ft (optional)"><textarea id="description" class="full" placeholder="Property description" required></textarea><input id="contact" class="full" placeholder="Contact information" required><button class="btn" type="submit">Publish Listing</button></form></section></main><script>const KEY='troothProperties';let active='All';function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function seed(){if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify([{id:1,title:'Modern Family Home',type:'For Sale',city:'Pakistan',price:'Contact for price',beds:'3 bedrooms',area:'1200 sq ft',description:'Sample property listing for the Trooth Property Center.',contact:'Trooth Property Network'},{id:2,title:'City Apartment',type:'For Rent',city:'Pakistan',price:'Contact for rent',beds:'2 bedrooms',area:'900 sq ft',description:'Sample rental property listing. Add real listings through the form.',contact:'Trooth Property Network'}]))}function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function notify(t){let n=JSON.parse(localStorage.getItem('troothNotifications')||'[]');n.unshift({id:Date.now(),text:t,read:false,time:new Date().toLocaleString()});localStorage.setItem('troothNotifications',JSON.stringify(n))}function render(){let q=document.getElementById('search').value.toLowerCase();let d=data().filter(x=>(active==='All'||x.type===active)&&(x.title+' '+x.city+' '+x.description).toLowerCase().includes(q));document.getElementById('list').innerHTML=d.map(x=>`<article class="property"><span class="tag">${esc(x.type)}</span><h3>${esc(x.title)}</h3><div class="meta">📍 ${esc(x.city)} · 💰 ${esc(x.price)}</div><div class="meta">${x.beds?'🛏️ '+esc(x.beds):''}${x.area?' · 📐 '+esc(x.area):''}</div><p>${esc(x.description)}</p><strong>Contact:</strong> ${esc(x.contact)}</article>`).join('')||'<div class="card">No properties found.</div>'}document.querySelector('.tabs').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;active=e.target.dataset.type;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render()});document.getElementById('search').addEventListener('input',render);document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let d=data();d.unshift({id:Date.now(),title:title.value.trim(),type:type.value,city:city.value.trim(),price:price.value.trim(),beds:beds.value.trim(),area:area.value.trim(),description:description.value.trim(),contact:contact.value.trim()});localStorage.setItem(KEY,JSON.stringify(d));notify('A new property listing was published on Trooth Property.');e.target.reset();render()});seed();render();</script></body></html>
