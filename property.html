<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Property Center</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#eef8f1;color:#173b29}header{background:#74c69d;color:#fff;padding:16px 5%;position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center}header b{font-size:23px}main{max-width:1100px;margin:auto;padding:18px}.card,.property{background:#fff;padding:18px;border:1px solid #dcebe1;border-radius:16px;margin:14px 0;box-shadow:0 3px 14px #245c3a14}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.property{margin:0;overflow:hidden;padding:0}.property-body{padding:16px}.badge{display:inline-block;background:#d8f3dc;color:#2d6a4f;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:bold}.price{font-size:20px;font-weight:bold;color:#2d6a4f}.meta{color:#718276;font-size:13px}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #d8e8dc;font:inherit}input,textarea,select{width:100%;margin:5px 0}button{background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.nav{margin-bottom:14px}.nav a{color:#14532d;font-weight:bold;margin-right:12px;text-decoration:none}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.feed-share{background:#b8f2c2;color:#14532d}.empty{color:#718276;text-align:center;padding:25px}@media(max-width:600px){main{padding:10px}header{padding:14px}.toolbar{grid-template-columns:1fr}}
</style></head><body><header><b>🌿 Trooth Property Center</b><span>🏠 Buy • Rent • Discover</span></header><main><nav class="card nav"><a href="index.html">Home</a><a href="business.html">Business</a><a href="friends.html">Friends</a><a href="news.html">News</a><a href="stores.html">Stores</a><a href="film-fashion.html">Film & Fashion</a><a href="auth.html">Profile</a></nav><section class="card"><h2>🏠 Publish Property Listing</h2><p class="meta">Share a property with the Trooth community.</p><form id="form"><input id="title" placeholder="Property title" required><div class="toolbar"><select id="category"><option>For Sale</option><option>For Rent</option></select><input id="price" placeholder="Price / Rent"></div><input id="location" placeholder="City / Location" required><textarea id="description" placeholder="Property description" required></textarea><button>Publish Listing</button></form><p id="status" class="meta"></p></section><section class="card"><h2>🔎 Explore Properties</h2><div class="toolbar"><input id="search" placeholder="Search by title, city, category or description..."><select id="filter"><option>All</option><option>For Sale</option><option>For Rent</option></select></div></section><section id="list" class="grid"></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load();sb.channel('trooth-property-live').on('postgres_changes',{event:'*',schema:'public',table:'properties'},load).subscribe()}async function load(){const r=await sb.from('properties').select('*').order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="card empty">Unable to load properties right now.</div>';return}rows=r.data||[];render()}async function sharePropertyToFeed(id){if(!user){alert('Please login first.');location.href='auth.html';return}const x=rows.find(a=>String(a.id)===String(id));if(!x)return;const text=`🏠 ${x.title} — ${x.category} — ${x.location}\n\n💰 ${x.price||'Contact for price'}\n\n${x.description||''}`;const r=await sb.from('posts').insert({user_id:user.id,body:text,media_url:null,media_type:null});if(r.error){alert(r.error.message);return}status.textContent='Property shared to your Trooth Feed ✓'}function render(){const q=(search.value||'').toLowerCase().trim(),f=filter.value;const filtered=rows.filter(x=>(f==='All'||x.category===f)&&((x.title||'')+' '+(x.location||'')+' '+(x.description||'')+' '+(x.category||'')).toLowerCase().includes(q));list.innerHTML=filtered.map(x=>`<article class="property"><div class="property-body"><span class="badge">${esc(x.category||'Property')}</span><h2>${esc(x.title)}</h2><p class="meta">📍 ${esc(x.location||'Location not listed')}</p><p class="price">💰 ${esc(x.price||'Contact for price')}</p><p>${esc(x.description||'')}</p><div class="actions"><button type="button" onclick="shareProperty('${x.id}')">↗ Share</button><button class="feed-share" type="button" onclick="sharePropertyToFeed('${x.id}')">🏠 Share to Trooth Feed</button></div><div id="i-${x.id}" style="margin-top:12px"></div></div></article>`).join('')||'<div class="card empty">No properties found.</div>';filtered.forEach(x=>{const el=document.getElementById('i-'+x.id);if(el)TroothInteractions.render(sb,user,'property',x.id,el)})}async function shareProperty(id){const x=rows.find(a=>a.id===id);if(!x)return;const text=`${x.title} — ${x.category} — ${x.location}`;if(navigator.share){try{await navigator.share({title:x.title,text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);alert('Property details copied.')}catch(e){alert(text)}}}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');location.href='auth.html';return}status.textContent='Publishing listing...';const r=await sb.from('properties').insert({user_id:user.id,title:title.value.trim(),category:category.value,location:location.value.trim(),price:price.value.trim()||null,description:description.value.trim()});if(r.error){status.textContent='';alert(r.error.message);return}form.reset();status.textContent='Listing published successfully ✓';await load()};search.oninput=render;filter.onchange=render;init()</script></body></html>
