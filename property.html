<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Property</title><style>body{font-family:Arial;margin:0;background:#f3fff5;color:#18321f}header{background:#b8f2c2;padding:18px;color:#14532d}main{max-width:1100px;margin:auto;padding:18px}.card,.property{background:white;padding:18px;border:1px solid #cdebd4;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.property{margin:0}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #cdebd4;font:inherit}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0}button{background:#b8f2c2;color:#14532d;font-weight:bold}a{color:#14532d;font-weight:bold;margin-right:10px}.muted{color:#718276}</style></head><body><header>🏠 <b>Trooth Property Center</b></header><main><nav><a href="index.html">Home</a><a href="business.html">Business</a><a href="friends.html">Friends</a><a href="auth.html">Profile</a></nav><section class="card"><h2>Publish Property Listing</h2><form id="form"><input id="title" placeholder="Property title" required><select id="category"><option>For Sale</option><option>For Rent</option></select><input id="location" placeholder="City / Location" required><input id="price" placeholder="Price / Rent"><textarea id="description" placeholder="Property description" required></textarea><button>Publish Listing</button></form></section><section class="card"><input id="search" placeholder="Search property..."><div id="list" class="grid"></div></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load()}async function load(){let r=await sb.from('properties').select('*').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){let q=search.value.toLowerCase();list.innerHTML=rows.filter(x=>(x.title+' '+x.location+' '+x.description+' '+x.category).toLowerCase().includes(q)).map(x=>`<article class="property"><b>${esc(x.category)}</b><h3>${esc(x.title)}</h3><p>📍 ${esc(x.location)}<br>💰 ${esc(x.price||'Contact for price')}</p><p>${esc(x.description)}</p><div id="i-${x.id}" style="margin-top:12px"></div></article>`).join('')||'<p class="muted">No properties yet.</p>';rows.forEach(x=>TroothInteractions.render(sb,user,'property',x.id,document.getElementById('i-'+x.id)))}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');return}let r=await sb.from('properties').insert({user_id:user.id,title:title.value.trim(),category:category.value,location:location.value.trim(),price:price.value.trim(),description:description.value.trim()});if(r.error){alert(r.error.message);return}form.reset();await load()};search.oninput=render;init()</script></body></html>
