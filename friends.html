<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trooth — Friends</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800}.home,.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}.home{background:#fff;color:#2d6a4f}.wrap{width:min(1000px,94%);margin:25px auto}.card{background:#fff;border-radius:18px;box-shadow:0 5px 20px #245c3a18;padding:20px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#74c69d,#b7e4c7);color:#173b29}.hero h1{margin:0 0 7px}.muted{color:#718276}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.person{border:1px solid #dcebe1;border-radius:15px;padding:16px;display:flex;gap:13px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:21px;flex:none}.info{flex:1}.info h3{margin:0 0 3px}.btn{background:#40916c;color:#fff}.btn.following{background:#d8f3dc;color:#2d6a4f}.stats{display:flex;gap:10px;margin-top:16px}.stat{background:#f1f7f3;padding:10px 15px;border-radius:10px}.stat b{font-size:19px;display:block}.search{width:100%;padding:12px;border:1px solid #d8e9de;border-radius:10px;margin-bottom:16px;outline:0}.notice{padding:10px 12px;border-radius:10px;background:#f1f7f3;margin-bottom:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.person{padding:13px;flex-wrap:wrap}.top{padding:13px 4%}.logo{font-size:21px}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="home" onclick="location.href='index.html'">🏠 Home Feed</button></header><main class="wrap"><section class="card hero"><h1>👥 Friends & Following</h1><p>Build your Trooth community — connect with creators, businesses and independent voices.</p><div class="stats"><div class="stat"><b id="friendsCount">0</b>Friends</div><div class="stat"><b id="followingCount">0</b>Following</div></div></section><section class="card"><div id="notice"></div><input class="search" id="search" placeholder="Search people..." oninput="render()"><div id="people" class="grid"></div></section></main><script>const people=[{id:'creator',name:'Creator',role:'Content Creator',initial:'C'},{id:'business',name:'Business Network',role:'Entrepreneur & Business',initial:'B'},{id:'news',name:'Independent News',role:'News Community',initial:'N'},{id:'sports',name:'Sports Community',role:'Sports & Fans',initial:'S'},{id:'film',name:'Film & Fashion',role:'Entertainment & Style',initial:'F'},{id:'property',name:'Property Network',role:'Property Community',initial:'P'}];const key='troothConnections',noticeKey='troothNotifications';function getConnections(){try{return JSON.parse(localStorage.getItem(key)||'{"friends":[],"following":[]}')}catch(e){return{friends:[],following:[]}}}function save(c){localStorage.setItem(key,JSON.stringify(c))}function addNotice(text){let n=[];try{n=JSON.parse(localStorage.getItem(noticeKey)||'[]')}catch(e){}n.unshift({id:Date.now(),text,time:'Just now',read:false});localStorage.setItem(noticeKey,JSON.stringify(n.slice(0,50)))}function person(id){return people.find(p=>p.id===id)||{name:id}}function toggleFollow(id){const c=getConnections(),i=c.following.indexOf(id),p=person(id);if(i>=0){c.following.splice(i,1);addNotice('You unfollowed '+p.name+'.')}else{c.following.push(id);addNotice('You are now following '+p.name+'.')}save(c);render()}function addFriend(id){const c=getConnections(),p=person(id);if(!c.friends.includes(id)){c.friends.push(id);if(!c.following.includes(id))c.following.push(id);save(c);addNotice('You added '+p.name+' as a friend.')}render()}function render(){const q=(document.getElementById('search').value||'').toLowerCase(),c=getConnections();friendsCount.textContent=c.friends.length;followingCount.textContent=c.following.length;peopleBox.innerHTML=people.filter(p=>(p.name+' '+p.role).toLowerCase().includes(q)).map(p=>{const f=c.friends.includes(p.id),fol=c.following.includes(p.id);return '<div class="person"><div class="avatar">'+p.initial+'</div><div class="info"><h3>'+p.name+'</h3><div class="muted">'+p.role+'</div></div><button class="btn '+(fol?'following':'')+'" onclick="toggleFollow(\''+p.id+'\')">'+(fol?'✓ Following':'Follow')+'</button><button class="btn" onclick="addFriend(\''+p.id+'\')">'+(f?'✓ Friend':'Add Friend')+'</button></div>'}).join('')||'<p class="muted">No people found.</p>';notice.innerHTML='<div class="notice">🔔 Friend activity is now connected to your Notifications.</div>'}const peopleBox=document.getElementById('people');render()</script></body></html>
