<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth — Friends & Messages</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800}.home,.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}.home{background:#fff;color:#2d6a4f}.wrap{width:min(1000px,94%);margin:25px auto}.card{background:#fff;border-radius:18px;box-shadow:0 5px 20px #245c3a18;padding:20px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#74c69d,#b7e4c7)}.hero h1{margin:0 0 7px}.muted{color:#718276}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.person{border:1px solid #dcebe1;border-radius:15px;padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.avatar{width:52px;height:52px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:21px;flex:none}.info{flex:1;min-width:150px}.info h3{margin:0 0 3px}.btn{background:#40916c;color:#fff}.btn.following{background:#d8f3dc;color:#2d6a4f}.stats{display:flex;gap:10px;margin-top:16px}.stat{background:#f1f7f3;padding:10px 15px;border-radius:10px}.stat b{font-size:19px;display:block}.search,.messageInput{width:100%;padding:12px;border:1px solid #d8e9de;border-radius:10px;margin-bottom:12px;outline:0}.notice{padding:10px 12px;border-radius:10px;background:#f1f7f3;margin-bottom:12px}.messages{max-height:320px;overflow:auto}.msg{padding:12px;border-bottom:1px solid #e4eee7}.msg b{display:block}.msg small{color:#718276}.composer{display:flex;gap:8px}.composer input{flex:1;margin:0}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{padding:13px 4%}.logo{font-size:21px}.composer{flex-direction:column}} </style></head><body><header class="top"><div class="logo">Trooth</div><button class="home" onclick="location.href='index.html'">🏠 Home Feed</button></header><main class="wrap"><section class="card hero"><h1>👥 Friends & Messages</h1><p>Connect with your Trooth community using the real Supabase backend.</p><div class="stats"><div class="stat"><b id="friendsCount">0</b>Friends</div><div class="stat"><b id="followingCount">0</b>Following</div><div class="stat"><b id="messagesCount">0</b>Messages</div></div></section><section class="card"><h2>👥 People</h2><input class="search" id="search" placeholder="Search people..." oninput="render()"><div id="people" class="grid"></div></section><section class="card"><h2>💬 Messages</h2><div id="selected" class="notice">Select a member below to start messaging.</div><div id="messages" class="messages"></div><div class="composer"><input id="messageInput" class="messageInput" placeholder="Write a message..." disabled><button id="sendBtn" class="btn" onclick="sendMessage()" disabled>Send</button></div></section></main><script src="supabase-client.js"></script><script>let supabase=null,currentUser=null,selectedId=null,profiles=[];const ready=()=>new Promise(r=>{if(window.troothSupabase)r();else window.addEventListener('trooth-supabase-ready',r,{once:true})});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nameOf(p){return p.display_name||'Trooth Member'}async function init(){await ready();supabase=window.troothSupabase;const {data:{user}}=await supabase.auth.getUser();currentUser=user;if(!user){people.innerHTML='<p class="muted">Please login first to use Friends & Messages.</p>';return}await loadProfiles();await render();await loadStats();}async function loadProfiles(){const {data,error}=await supabase.from('profiles').select('id,display_name,bio,is_public').neq('id',currentUser.id).order('display_name');profiles=error?[]:(data||[]).filter(p=>p.is_public!==false)}async function loadStats(){const [{data:f},{data:fol},{data:m}]=await Promise.all([supabase.from('connections').select('following_id').eq('follower_id',currentUser.id),supabase.from('connections').select('follower_id').eq('following_id',currentUser.id),supabase.from('messages').select('id').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)]);friendsCount.textContent=(f||[]).length;followingCount.textContent=(fol||[]).length;messagesCount.textContent=(m||[]).length}async function render(){if(!currentUser)return;const q=(search.value||'').toLowerCase();const {data:following}=await supabase.from('connections').select('following_id').eq('follower_id',currentUser.id);const {data:friends}=await supabase.from('connections').select('following_id').eq('follower_id',currentUser.id);const fs=new Set((friends||[]).map(x=>x.following_id)), fol=new Set((following||[]).map(x=>x.following_id));const list=profiles.filter(p=>(nameOf(p)+' '+(p.bio||'')).toLowerCase().includes(q));people.innerHTML=list.map(p=>`<div class="person"><div class="avatar">${esc(nameOf(p)[0]||'T').toUpperCase()}</div><div class="info"><h3>${esc(nameOf(p))}</h3><div class="muted">${esc(p.bio||'Trooth Community Member')}</div></div><button class="btn" onclick="selectFriend('${p.id}')">💬 Message</button><button class="btn ${fol.has(p.id)?'following':''}" onclick="toggleFollow('${p.id}')">${fol.has(p.id)?'✓ Following':'Follow'}</button><button class="btn" onclick="addFriend('${p.id}')">${fs.has(p.id)?'✓ Following':'Add Friend'}</button></div>`).join('')||'<p class="muted">No people found.</p>';await loadStats()}async function toggleFollow(id){if(!currentUser)return;const {data:existing}=await supabase.from('connections').select('follower_id').eq('follower_id',currentUser.id).eq('following_id',id).maybeSingle();if(existing)await supabase.from('connections').delete().eq('follower_id',currentUser.id).eq('following_id',id);else{await supabase.from('connections').insert({follower_id:currentUser.id,following_id:id});await supabase.from('notifications').insert({user_id:id,actor_id:currentUser.id,kind:'follow',body:'You have a new follower.'})}await render()}async function addFriend(id){if(!currentUser)return;const {data:existing}=await supabase.from('connections').select('follower_id').eq('follower_id',currentUser.id).eq('following_id',id).maybeSingle();if(!existing){await supabase.from('connections').insert({follower_id:currentUser.id,following_id:id});await supabase.from('notifications').insert({user_id:id,actor_id:currentUser.id,kind:'friend',body:'You have a new connection request.'})}selectFriend(id);await render()}async function selectFriend(id){selectedId=id;const p=profiles.find(x=>x.id===id);selected.innerHTML='💬 Chatting with <b>'+esc(nameOf(p||{}))+'</b>';messageInput.disabled=false;sendBtn.disabled=false;await renderMessages()}async function renderMessages(){if(!selectedId)return;const {data,error}=await supabase.from('messages').select('id,sender_id,receiver_id,body,created_at').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedId}),and(sender_id.eq.${selectedId},receiver_id.eq.${currentUser.id})`).order('created_at');if(error){messages.innerHTML='<p class="muted">Unable to load messages.</p>';return}messages.innerHTML=(data||[]).map(x=>`<div class="msg"><b>${x.sender_id===currentUser.id?'You':esc(nameOf(profiles.find(p=>p.id===selectedId)||{}))}</b><span>${esc(x.body)}</span><br><small>${new Date(x.created_at).toLocaleString()}</small></div>`).join('')||'<p class="muted">No messages yet. Say hello! 👋</p>'}async function sendMessage(){const text=messageInput.value.trim();if(!selectedId||!text||!currentUser)return;const {error}=await supabase.from('messages').insert({sender_id:currentUser.id,receiver_id:selectedId,body:text});if(error){alert(error.message);return}await supabase.from('notifications').insert({user_id:selectedId,actor_id:currentUser.id,kind:'message',body:'You received a new message.'});messageInput.value='';await renderMessages();await loadStats()}init();</script></body></html>
