<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74c69d"><title>Trooth — Activity History</title><style>:root{--g:#74c69d;--g2:#2d6a4f;--p:#d8f3dc;--bg:#eef8f1;--ink:#173b29;--muted:#718276;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{background:var(--g);color:#fff;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:900}.nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g2);color:#fff;font-weight:800;cursor:pointer}.nav .btn{background:#fff;color:var(--g2)}main{max-width:850px;margin:20px auto;padding:0 14px}.card{background:var(--card);border-radius:17px;padding:18px;margin-bottom:12px;box-shadow:0 3px 15px #245c3a12}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools button{border:1px solid #cfe5d6;background:#fff;color:var(--g2);border-radius:20px;padding:8px 12px;font-weight:700;cursor:pointer}.tools button.active{background:var(--g2);color:#fff}.search{flex:1;min-width:190px;border:1px solid #dcebe2;border-radius:20px;padding:9px 13px;font:inherit}.item{display:flex;gap:12px;align-items:flex-start;border-top:1px solid #e7efe9;padding:14px 0;cursor:pointer;border-radius:10px}.item:hover{background:#f0fbf4}.icon{width:42px;height:42px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-size:20px;flex:none}.muted,small{color:var(--muted)}.empty{text-align:center;padding:35px}.tag{display:inline-block;background:var(--p);color:var(--g2);padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}.count{font-weight:800;color:var(--g2)}.hint{font-size:12px;color:var(--muted);margin-top:3px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.nav{width:100%;justify-content:stretch}.nav .btn{flex:1;text-align:center;min-width:90px}main{margin:12px auto}.card{padding:15px}.tools{gap:6px}.tools button{padding:7px 10px}}</style></head><body><header class="top"><div class="logo">Trooth</div><nav class="nav"><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn" onclick="location.href='friends.html'">👥 Friends</button><button class="btn" onclick="location.href='business.html'">💼 Business</button><button class="btn" onclick="location.href='chat.html'">💬 Messages</button><button class="btn" onclick="location.href='notifications-messages.html'">🔔 Alerts</button><button class="btn" onclick="location.href='auth.html'">👤 Profile</button></nav></header><main><div class="card"><span class="tag">📊 ACTIVITY HISTORY</span><h1>My Activity</h1><p class="muted">Your recent likes, comments, shares and saved content — updated live.</p><div class="tools"><input id="search" class="search" placeholder="Search my activity..." oninput="render()"><button class="active" data-filter="all" onclick="setFilter('all',this)">All</button><button data-filter="like" onclick="setFilter('like',this)">👍 Likes</button><button data-filter="comment" onclick="setFilter('comment',this)">💬 Comments</button><button data-filter="share" onclick="setFilter('share',this)">↗ Shares</button><button data-filter="save" onclick="setFilter('save',this)">🔖 Saved</button><button class="btn" onclick="load()">↻ Refresh</button></div></div><section class="card"><div id="summary" class="count"></div><div id="list">Loading activity…</div></section></main><script src="supabase-client.js"></script><script>let sb,user,items=[],filter='all',channels=[],timer,loading=false,pending=false;async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));return window.troothSupabase}async function load(){sb=sb||await ready();user=user||(await sb.auth.getUser()).data.user;if(!user){location.href='auth.html';return}if(loading){pending=true;return}loading=true;try{const [likes,comments,saves,shares]=await Promise.all([sb.from('content_likes').select('content_type,content_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100),sb.from('content_comments').select('content_type,content_id,body,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100),sb.from('saved_content').select('content_type,content_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100),sb.from('notifications').select('body,kind,created_at').eq('actor_id',user.id).ilike('kind','%share%').order('created_at',{ascending:false}).limit(100)]);items=[];(likes.data||[]).forEach(x=>items.push({type:'like',post:x.content_id,t:x.created_at,icon:'👍',text:'You liked '+(x.content_type||'content')}));(comments.data||[]).forEach(x=>items.push({type:'comment',post:x.content_id,t:x.created_at,icon:'💬',text:'You commented: '+String(x.body||'').slice(0,100)}));(shares.data||[]).forEach(x=>items.push({type:'share',post:'',t:x.created_at,icon:'↗',text:'You shared content'}));(saves.data||[]).forEach(x=>items.push({type:'save',post:x.content_id,t:x.created_at,icon:'🔖',text:'You saved '+(x.content_type||'content')}));items.sort((a,b)=>new Date(b.t)-new Date(a.t));render();subscribe()}finally{loading=false;if(pending){pending=false;schedule(80)}}}function setFilter(f,el){filter=f;document.querySelectorAll('.tools button[data-filter]').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}function openPost(id){if(id)location.href='index.html?post='+encodeURIComponent(id)}function render(){const q=(document.getElementById('search').value||'').toLowerCase().trim();const list=items.filter(x=>(filter==='all'||x.type===filter)&&(!q||(x.text+' '+x.type).toLowerCase().includes(q)));document.getElementById('summary').textContent=list.length+' activity item'+(list.length===1?'':'s');document.getElementById('list').innerHTML=list.length?list.slice(0,100).map(x=>'<div class="item" role="button" tabindex="0" '+(x.post?'onclick="openPost(\''+escAttr(x.post)+'\')"':'')+'><div class="icon">'+x.icon+'</div><div><b>'+esc(x.text)+'</b><br><small>'+new Date(x.t).toLocaleString()+'</small><div class="hint">'+(x.post?'Tap to open post':'Activity record')+'</div></div></div>').join(''):'<div class="empty">ابھی کوئی matching activity موجود نہیں۔</div>'}function subscribe(){if(channels.length)return;['content_likes','content_comments','saved_content'].forEach(function(table){channels.push(sb.channel('trooth-activity-'+table+'-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:table,filter:'user_id=eq.'+user.id},schedule).subscribe())});channels.push(sb.channel('trooth-activity-notifications-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'actor_id=eq.'+user.id},schedule).subscribe())}function schedule(ms){clearTimeout(timer);timer=setTimeout(load,ms||180)}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'})[c])}function escAttr(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}window.addEventListener('online',()=>schedule());document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});window.addEventListener('trooth-activity-feed-refresh',()=>schedule(80));load();</script></body></html>
