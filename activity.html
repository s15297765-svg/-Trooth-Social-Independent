<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74c69d"><title>Trooth — Activity History</title><style>:root{--g:#74c69d;--g2:#2d6a4f;--p:#d8f3dc;--bg:#eef8f1;--ink:#173b29;--muted:#718276;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{background:var(--g);color:#fff;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--g2);color:#fff;font-weight:800;cursor:pointer}.top .btn{background:#fff;color:var(--g2)}main{max-width:850px;margin:20px auto;padding:0 14px}.card{background:var(--card);border-radius:17px;padding:18px;margin-bottom:12px;box-shadow:0 3px 15px #245c3a12}.item{display:flex;gap:12px;align-items:flex-start;border-top:1px solid #e7efe9;padding:14px 0}.icon{width:42px;height:42px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-size:20px}.muted,small{color:var(--muted)}.empty{text-align:center;padding:35px}.tag{display:inline-block;background:var(--p);color:var(--g2);padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="btn" onclick="location.href='index.html'">⌂ Home</button></header><main><div class="card"><span class="tag">📊 ACTIVITY HISTORY</span><h1>My Activity</h1><p class="muted">Your recent likes, comments, shares and saved posts.</p></div><section class="card"><div id="list">Loading activity…</div></section></main><script src="supabase-client.js"></script><script>async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));return window.troothSupabase}async function load(){const s=await ready(),u=(await s.auth.getUser()).data.user;if(!u){location.href='auth.html';return}const out=[];const [likes,comments,shares,saves]=await Promise.all([s.from('post_likes').select('post_id,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(30),s.from('comments').select('post_id,body,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(30),s.from('post_shares').select('post_id,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(30),s.from('saved_posts').select('post_id,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(30)]);(likes.data||[]).forEach(x=>out.push({t:x.created_at,icon:'👍',text:'You liked a post'}));(comments.data||[]).forEach(x=>out.push({t:x.created_at,icon:'💬',text:'You commented: '+String(x.body||'').slice(0,100)}));(shares.data||[]).forEach(x=>out.push({t:x.created_at,icon:'↗',text:'You shared a post'}));(saves.data||[]).forEach(x=>out.push({t:x.created_at,icon:'🔖',text:'You saved a post'}));out.sort((a,b)=>new Date(b.t)-new Date(a.t));const el=document.getElementById('list');el.innerHTML=out.length?out.slice(0,80).map(x=>'<div class="item"><div class="icon">'+x.icon+'</div><div><b>'+esc(x.text)+'</b><br><small>'+new Date(x.t).toLocaleString()+'</small></div></div>').join(''):'<div class="empty">ابھی کوئی activity موجود نہیں۔</div>'}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
