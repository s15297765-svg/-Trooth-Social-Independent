name: Validate Trooth

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -u
          : > syntax-failures.txt
          files=$(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' | sort)
          test -n "$files"
          failed=0
          while IFS= read -r file; do
            echo "Checking $file"
            if ! node --check "$file"; then
              echo "$file" >> syntax-failures.txt
              failed=1
            fi
          done <<< "$files"
          if [ "$failed" -ne 0 ]; then
            echo "JavaScript syntax failures:"
            cat syntax-failures.txt
            exit 1
          fi
      - name: Upload syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trooth-syntax-diagnostics
          path: syntax-failures.txt
          if-no-files-found: ignore
      - name: Check required Supabase bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase-client.js
          grep -q "trooth-business-owner-v1.js" supabase-client.js
          grep -q "trooth-business-analytics-v1.js" supabase-client.js
