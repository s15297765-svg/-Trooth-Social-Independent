name: Validate Trooth

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -u
          : > syntax-failures.txt
          files=$(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' | sort)
          test -n "$files"
          failed=0
          while IFS= read -r file; do
            echo "Checking $file"
            if ! node --check "$file"; then
              echo "$file" >> syntax-failures.txt
              failed=1
            fi
          done <<< "$files"
          if [ "$failed" -ne 0 ]; then
            echo "JavaScript syntax failures:"
            cat syntax-failures.txt
            exit 1
          fi
      - name: Upload syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trooth-syntax-diagnostics
          path: syntax-failures.txt
          if-no-files-found: ignore
      - name: Check required Supabase bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase-client.js
          grep -q "trooth-business-owner-v1.js" supabase-client.js
          grep -q "trooth-business-analytics-v1.js" supabase-client.js

  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android WebView project
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/trooth/si android/app/src/main/assets/site android/app/src/main/res/values
          git archive HEAD | tar -x -C android/app/src/main/assets/site
          sed -i 's/Welcome back to your Trooth 👋/Trooth Social Independent/g' android/app/src/main/assets/site/index.html
          sed -i 's/A more human place to connect, share, discover and build your network\.//g' android/app/src/main/assets/site/index.html
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'TroothSocialIndependent'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.trooth.si'
            compileSdk 35
            defaultConfig {
              applicationId 'com.trooth.si'
              minSdk 23
              targetSdk 35
              versionCode 8
              versionName '1.5'
            }
          }
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#27845B</item><item name="android:statusBarColor">#69C79A</item><item name="android:navigationBarColor">#FFFFFF</item><item name="android:windowLightStatusBar">true</item></style></resources>
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="Trooth Social Independent" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > android/app/src/main/java/com/trooth/si/MainActivity.java <<'EOF'
          package com.trooth.si;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> uploadCallback;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              webView = new WebView(this);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                  if (uploadCallback != null) uploadCallback.onReceiveValue(null);
                  uploadCallback = callback;
                  try { startActivityForResult(params.createIntent(), 1001); return true; }
                  catch (Exception e) { uploadCallback = null; callback.onReceiveValue(null); return false; }
                }
              });
              webView.loadUrl("file:///android_asset/site/index.html");
              setContentView(webView);
            }
            @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode != 1001 || uploadCallback == null) return;
              Uri[] result = null;
              if (resultCode == RESULT_OK && data != null) {
                if (data.getData() != null) result = new Uri[]{data.getData()};
                else if (data.getClipData() != null) {
                  int n = data.getClipData().getItemCount(); result = new Uri[n];
                  for (int i=0;i<n;i++) result[i]=data.getClipData().getItemAt(i).getUri();
                }
              }
              uploadCallback.onReceiveValue(result);
              uploadCallback = null;
            }
            @Override public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Build debug APK
        run: cd android && gradle clean assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trooth-Social-Independent-APK-v1.5-validated
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
