# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Activate Home search bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          marker = '<script src="trooth-home-search-fix-v1.js"></script>'
          if marker not in html:
              html = html.replace('</body>', marker + '</body>', 1)
          live = '<script src="trooth-live-final-v1.js?v=${{ github.sha }}"></script>'
          if 'trooth-live-final-v1.js' not in html:
              html = html.replace('</body>', live + '</body>', 1)
          page.write_text(html, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
