# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Keep Home search bridge current
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          html = re.sub(r'<script[^>]+trooth-live-final-v1\\.js[^>]*></script>', '', html, flags=re.I)
          html = re.sub(r'<script[^>]+trooth-live-final-v2\\.js[^>]*></script>', '', html, flags=re.I)
          html = re.sub(r'<div id="trooth-build-marker"[^>]*>.*?</div>', '', html, flags=re.I|re.S)
          bridge = '<script src="trooth-home-search-fix-v1.js?v=${{ github.sha }}"></script>'
          if 'trooth-home-search-fix-v1.js' not in html:
              html = html.replace('</body>', bridge + '</body>', 1)
          page.write_text(html, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
