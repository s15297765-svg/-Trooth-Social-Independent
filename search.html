<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Global Search</title><style>:root{--g:#43c66b;--light:#eefaf1;--dark:#14532d;--card:#fff;--line:#d8eadc}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:#17351f}.top{background:var(--g);padding:14px 18px;color:#fff;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:22px}.nav{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.nav a{background:#fff;color:var(--dark);text-decoration:none;padding:7px 11px;border-radius:18px;font-size:13px}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #14532d12}.hero h2{margin:0 0 7px;color:var(--dark)}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;padding:13px;border:1px solid #bddcc4;border-radius:12px;font-size:16px}.search button{border:0;background:var(--g);color:#fff;padding:0 20px;border-radius:12px;font-weight:bold}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tabs button{border:1px solid #b9d9c0;background:#fff;padding:9px 14px;border-radius:20px;white-space:nowrap}.tabs button.active{background:var(--g);color:#fff}.result{border-top:1px solid var(--line);padding:14px 0}.result:first-child{border-top:0}.result h3{margin:0 0 5px;color:var(--dark)}.result p{margin:5px 0;color:#496150;line-height:1.45}.result a{display:inline-block;margin-top:7px;color:#16803b;font-weight:bold;text-decoration:none}.tag{font-size:12px;background:#e3f6e8;padding:5px 9px;border-radius:12px;color:#176b34}.empty{text-align:center;padding:30px;color:#607567}.count{font-size:13px;color:#5a725f}</style></head><body><header class="top"><h1>🌿 Trooth Social Independent</h1><nav class="nav"><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="stores.html">Stores</a><a href="property.html">Property</a><a href="film-fashion.html">Film & Fashion</a><a href="auth.html">Profile</a></nav></header><main class="wrap"><section class="hero"><h2>🔎 Global Search</h2><div>Search across Trooth community, posts, news, sports, businesses, stores, property and Film & Fashion.</div><div class="search"><input id="q" placeholder="Search Trooth..." autocomplete="off"><button onclick="runSearch()">Search</button></div><div class="tabs" id="tabs"></div></section><section class="card"><div class="count" id="count">Enter a search term to begin.</div><div id="results"><div class="empty">🌿 Your Trooth search results will appear here.</div></div></section></main><script src="supabase-client.js"></script><script>let sb,active='All',sources=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function buildTabs(){tabs.innerHTML='<button class="active" data-tab="All">All</button>'+sources.map(s=>`<button data-tab="${s.name}">${s.name}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));runSearch()})}async function init(){await ready();sb=window.troothSupabase;sources=[{name:'Posts',page:'index.html',label:'Post',table:'posts',fields:['body']},{name:'News',page:'news.html',label:'News Story',table:'news_stories',fields:['title','body','category']},{name:'Sports',page:'sports.html',label:'Sports Story',table:'sports_stories',fields:['title','body','category']},{name:'Business',page:'business.html',label:'Business',table:'businesses',fields:['name','category','description']},{name:'Stores',page:'stores.html',label:'Store / Listing',table:'store_listings',fields:['name','category','description']},{name:'Property',page:'property.html',label:'Property',table:'properties',fields:['title','category','location','price','description']},{name:'Film & Fashion',page:'film-fashion.html',label:'Film & Fashion',table:'film_fashion_stories',fields:['title','body','category']}];buildTabs()}async function runSearch(){const term=q.value.trim().toLowerCase();if(!term){count.textContent='Enter a search term to begin.';results.innerHTML='<div class="empty">🌿 Type something above to search Trooth.</div>';return}count.textContent='Searching Trooth…';results.innerHTML='<div class="empty">🔎 Searching…</div>';const selected=sources.filter(s=>active==='All'||s.name===active);const all=await Promise.all(selected.map(async s=>{const cols=['id','created_at',...s.fields].join(',');const r=await sb.from(s.table).select(cols).order('created_at',{ascending:false}).limit(200);return {s,data:r.data||[]}}));let hits=[];all.forEach(({s,data})=>data.forEach(item=>{const hay=s.fields.map(f=>item[f]??'').join(' ').toLowerCase();if(hay.includes(term))hits.push({s,item})}));count.textContent=`${hits.length} result${hits.length===1?'':'s'} found for “${term}”`;if(!hits.length){results.innerHTML='<div class="empty">No results found. Try another keyword.</div>';return}results.innerHTML=hits.slice(0,100).map(({s,item})=>{const title=item.title||item.name||'Trooth Result';const body=item.body||item.description||item.location||item.price||'';return `<article class="result"><span class="tag">${esc(s.label)}</span><h3>${esc(title)}</h3><p>${esc(String(body).slice(0,240))}</p><a href="${s.page}#${esc(item.id)}">Open ${esc(s.name)} →</a></article>`}).join('')}q.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});init();</script></body></html>
