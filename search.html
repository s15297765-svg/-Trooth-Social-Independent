<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trooth Global Search</title>
<style>
:root{--green:#43c66b;--light:#eefaf1;--dark:#14532d;--card:#fff;--border:#d8eadc}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:#17351f}.top{background:var(--green);padding:14px 18px;color:#fff;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:22px}.nav{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.nav a{background:#fff;color:var(--dark);text-decoration:none;padding:7px 11px;border-radius:18px;font-size:13px}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.hero,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #14532d12}.hero h2{margin:0 0 7px;color:var(--dark)}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;padding:13px;border:1px solid #bddcc4;border-radius:12px;font-size:16px}.search button{border:0;background:var(--green);color:#fff;padding:0 20px;border-radius:12px;font-weight:bold}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tabs button{border:1px solid #b9d9c0;background:#fff;padding:9px 14px;border-radius:20px;white-space:nowrap}.tabs button.active{background:var(--green);color:#fff}.result{border-top:1px solid var(--border);padding:14px 0}.result:first-child{border-top:0}.result h3{margin:0 0 5px;color:var(--dark)}.result p{margin:5px 0;color:#496150;line-height:1.45}.result a{display:inline-block;margin-top:7px;color:#16803b;font-weight:bold;text-decoration:none}.tag{font-size:12px;background:#e3f6e8;padding:5px 9px;border-radius:12px;color:#176b34}.empty{text-align:center;padding:30px;color:#607567}.count{font-size:13px;color:#5a725f}
</style>
</head>
<body>
<header class="top"><h1>🌿 Trooth Social Independent</h1><nav class="nav"><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="stores.html">Stores</a><a href="property.html">Property</a><a href="film-fashion.html">Film & Fashion</a><a href="auth.html">Profile</a></nav></header>
<main class="wrap">
<section class="hero"><h2>🔎 Global Search</h2><div>Search across your Trooth community, news, sports, businesses, stores, property and Film & Fashion stories.</div><div class="search"><input id="q" placeholder="Search Trooth..." autocomplete="off"><button onclick="runSearch()">Search</button></div><div class="tabs" id="tabs"></div></section>
<section class="card"><div class="count" id="count">Enter a search term to begin.</div><div id="results"><div class="empty">🌿 Your Trooth search results will appear here.</div></div></section>
</main>
<script>
const sources=[
 {key:'troothPosts',name:'Posts',page:'index.html',fields:['text','author','name'],label:'Post'},
 {key:'troothNews',name:'News',page:'news.html',fields:['title','headline','body','author','publisher'],label:'News Story'},
 {key:'troothSports',name:'Sports',page:'sports.html',fields:['title','headline','body','author'],label:'Sports Story'},
 {key:'troothBusinesses',name:'Business',page:'business.html',fields:['name','category','location','description','contact'],label:'Business'},
 {key:'troothStores',name:'Stores',page:'stores.html',fields:['name','title','category','description'],label:'Store / Listing'},
 {key:'troothProperties',name:'Property',page:'property.html',fields:['title','type','location','city','description'],label:'Property'},
 {key:'troothFilmFashion',name:'Film & Fashion',page:'film-fashion.html',fields:['title','headline','body','author','production','brand','category'],label:'Film & Fashion'}
];
let active='All';
function data(key){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function text(item,fields){return fields.map(f=>item[f]??'').join(' ')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildTabs(){const t=document.getElementById('tabs');t.innerHTML='<button class="active" data-tab="All">All</button>'+sources.map(s=>`<button data-tab="${s.name}">${s.name}</button>`).join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;t.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));runSearch()})}
function runSearch(){const q=document.getElementById('q').value.trim().toLowerCase();const out=document.getElementById('results');if(!q){document.getElementById('count').textContent='Enter a search term to begin.';out.innerHTML='<div class="empty">🌿 Type something above to search Trooth.</div>';return}let hits=[];sources.filter(s=>active==='All'||s.name===active).forEach(s=>data(s.key).forEach(item=>{const hay=text(item,s.fields).toLowerCase();if(hay.includes(q))hits.push({s,item})}));document.getElementById('count').textContent=`${hits.length} result${hits.length===1?'':'s'} found for “${q}”`;if(!hits.length){out.innerHTML='<div class="empty">No results found. Try another keyword.</div>';return}out.innerHTML=hits.slice(0,100).map(({s,item})=>{const title=item.title||item.headline||item.name||item.author||'Trooth Result';const body=item.body||item.description||item.bio||item.location||'';return `<article class="result"><span class="tag">${esc(s.label)}</span><h3>${esc(title)}</h3><p>${esc(String(body).slice(0,240))}</p><a href="${s.page}">Open ${esc(s.name)} →</a></article>`}).join('')}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});buildTabs();
</script>
</body>
</html>
