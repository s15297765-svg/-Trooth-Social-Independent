<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth — Profile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer;background:#40916c;color:#fff}.home{background:#fff;color:#2d6a4f}.wrap{width:min(900px,94%);margin:24px auto}.card{background:#fff;border-radius:18px;box-shadow:0 5px 20px #245c3a18;margin-bottom:18px;overflow:hidden}.cover{height:230px;background:linear-gradient(135deg,#74c69d,#d8f3dc);background-size:cover;background-position:center}.body{padding:0 24px 24px}.avatar{width:120px;height:120px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-size:44px;font-weight:bold;overflow:hidden;border:6px solid #fff;margin-top:-60px}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:#718276}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f1f7f3;padding:10px 18px;border-radius:10px}.stat b{font-size:19px;display:block}.post{padding:18px}.posthead{display:flex;gap:10px;align-items:center}.mini{width:44px;height:44px;border-radius:50%;background:#74c69d;color:#fff;display:grid;place-items:center;font-weight:bold;overflow:hidden}.mini img{width:100%;height:100%;object-fit:cover}.posttext{line-height:1.55;white-space:pre-wrap}.empty{padding:20px}.tag{display:inline-block;background:#d8f3dc;color:#2d6a4f;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold}@media(max-width:600px){.cover{height:170px}.body{padding:0 16px 18px}}
</style></head><body><header class="top"><div class="logo">Trooth</div><button class="btn home" onclick="location.href='index.html'">🏠 Home Feed</button></header><main class="wrap"><section class="card"><div id="cover" class="cover"></div><div class="body"><div id="avatar" class="avatar">T</div><h1 id="name">Loading...</h1><p id="bio" class="muted"></p><div class="stats"><div class="stat"><b id="postsCount">0</b>Posts</div><div class="stat"><b id="friendsCount">0</b>Friends</div><div class="stat"><b id="followingCount">0</b>Following</div></div><div id="actions" class="actions"></div></div></section><section class="card"><div class="body"><span class="tag">PUBLIC PROFILE</span><h2>📝 Posts</h2></div><div id="posts"><div class="empty muted">Loading posts...</div></div></section></main><script src="supabase-client.js"></script><script>let sb=null,currentUser=null,profile=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nameOf=p=>p?.display_name||'Trooth Member';const ready=()=>new Promise(r=>{if(window.troothSupabase)r();else window.addEventListener('trooth-supabase-ready',r,{once:true})});async function init(){await ready();sb=window.troothSupabase;const {data:{user}}=await sb.auth.getUser();currentUser=user;const id=new URLSearchParams(location.search).get('id')||user?.id;if(!id){showError('No profile selected.');return}const {data,error}=await sb.from('profiles').select('id,display_name,bio,is_public,avatar_url,cover_url').eq('id',id).maybeSingle();if(error||!data||data.is_public===false){showError('This profile is unavailable or private.');return}profile=data;renderProfile();await Promise.all([loadPosts(),loadStats()]);if(currentUser&&currentUser.id!==profile.id)await renderActions()}function showError(t){document.querySelector('.wrap').innerHTML='<section class="card"><div class="empty"><h2>⚠️ '+esc(t)+'</h2><button class="btn" onclick="location.href=\'index.html\'">Back Home</button></div></section>'}function renderProfile(){name.textContent=nameOf(profile);bio.textContent=profile.bio||'Trooth Community Member';avatar.innerHTML=profile.avatar_url?'<img src="'+esc(profile.avatar_url)+'" alt="Profile photo">':esc(nameOf(profile)[0]?.toUpperCase()||'T');if(profile.cover_url)cover.style.backgroundImage='url("'+esc(profile.cover_url)+'")'}async function loadPosts(){const {data,error}=await sb.from('posts').select('id,user_id,body,created_at').eq('user_id',profile.id).order('created_at',{ascending:false}).limit(50);postsCount.textContent=(data||[]).length;if(error){posts.innerHTML='<div class="empty">Unable to load posts.</div>';return}posts.innerHTML=(data||[]).map(p=>'<article class="post"><div class="posthead"><div class="mini">'+esc(nameOf(profile)[0]?.toUpperCase()||'T')+'</div><div><b>'+esc(nameOf(profile))+'</b><br><span class="muted">'+new Date(p.created_at).toLocaleString()+'</span></div></div><p class="posttext">'+esc(p.body)+'</p></article>').join('')||'<div class="empty muted">No posts yet.</div>'}async function loadStats(){const [{data:f},{data:fol}]=await Promise.all([sb.from('friend_requests').select('id,sender_id,receiver_id').eq('status','accepted').or('sender_id.eq.'+profile.id+',receiver_id.eq.'+profile.id),sb.from('connections').select('following_id').eq('follower_id',profile.id)]);friendsCount.textContent=(f||[]).length;followingCount.textContent=(fol||[]).length}async function renderActions(){const {data:fr}=await sb.from('friend_requests').select('id,sender_id,receiver_id,status').or('and(sender_id.eq.'+currentUser.id+',receiver_id.eq.'+profile.id+'),and(sender_id.eq.'+profile.id+',receiver_id.eq.'+currentUser.id+')');const row=(fr||[])[0];const {data:fol}=await sb.from('connections').select('following_id').eq('follower_id',currentUser.id).eq('following_id',profile.id).maybeSingle();let friendBtn;if(row?.status==='accepted')friendBtn='<button class="btn" disabled>✓ Friends</button>';else if(row?.status==='pending'&&row.sender_id===currentUser.id)friendBtn='<button class="btn" disabled>⏳ Request Sent</button>';else if(row?.status==='pending')friendBtn='<button class="btn" onclick="acceptRequest(\''+row.id+'\')">✓ Accept Friend Request</button>';else friendBtn='<button class="btn" onclick="sendRequest()">＋ Add Friend</button>';actions.innerHTML=friendBtn+'<button class="btn" onclick="messageUser()">💬 Message</button><button class="btn" onclick="toggleFollow()">'+(fol?'✓ Following':'Follow')+'</button>'}async function sendRequest(){const {error}=await sb.from('friend_requests').insert({sender_id:currentUser.id,receiver_id:profile.id,status:'pending'});if(error){alert(error.message);return}await sb.from('notifications').insert({user_id:profile.id,actor_id:currentUser.id,kind:'friend',body:'You received a new friend request.'});await renderActions()}async function acceptRequest(id){const {error}=await sb.from('friend_requests').update({status:'accepted',updated_at:new Date().toISOString()}).eq('id',id).eq('receiver_id',currentUser.id);if(error){alert(error.message);return}await sb.from('notifications').insert({user_id:profile.id,actor_id:currentUser.id,kind:'friend',body:'Your friend request was accepted.'});await renderActions();await loadStats()}async function toggleFollow(){const q=await sb.from('connections').select('follower_id').eq('follower_id',currentUser.id).eq('following_id',profile.id).maybeSingle();if(q.data)await sb.from('connections').delete().eq('follower_id',currentUser.id).eq('following_id',profile.id);else{await sb.from('connections').insert({follower_id:currentUser.id,following_id:profile.id});await sb.from('notifications').insert({user_id:profile.id,actor_id:currentUser.id,kind:'follow',body:'You have a new follower.'})}await renderActions()}function messageUser(){location.href='friends.html?user='+encodeURIComponent(profile.id)}init();</script></body></html>
