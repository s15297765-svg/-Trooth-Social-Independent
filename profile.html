<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth — Profile</title><style>:root{--g:#16a34a;--g2:#15803d;--p:#dcfce7;--bg:#f0fdf4;--ink:#173b29}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{background:var(--g);color:#fff;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:10px}.logo{font-size:26px;font-weight:900}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--g2);color:#fff}.home{background:#fff;color:#166534}.wrap{width:min(900px,94%);margin:22px auto}.card{background:#fff;border-radius:20px;box-shadow:0 5px 22px #16653418;margin-bottom:18px;overflow:hidden}.cover{height:230px;background:linear-gradient(135deg,#16a34a,#dcfce7);background-size:cover;background-position:center}.body{padding:0 24px 24px}.avatar{width:120px;height:120px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-size:44px;font-weight:900;overflow:hidden;border:6px solid #fff;margin-top:-60px}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:#718276}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.actions .btn{min-height:42px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f1f7f3;padding:10px 18px;border-radius:10px;min-width:96px;text-align:center}.stat b{font-size:19px;display:block}.post{padding:18px;border-top:1px solid #e4efe7}.posthead{display:flex;gap:10px;align-items:center}.mini{width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:bold;overflow:hidden}.mini img{width:100%;height:100%;object-fit:cover}.posttext{line-height:1.55;white-space:pre-wrap}.empty{padding:20px}.tag{display:inline-block;background:var(--p);color:#166534;padding:5px 9 </style></head><body><header class="top"><div class="logo">Trooth</div><div class="top-actions"><button class="btn home" onclick="location.href='index.html'">🏠 Home Feed</button><button class="btn" onclick="location.href='friends.html'">👥 Friends</button><button class="btn" onclick="location.href='chat.html'">💬 Messages</button><button class="btn" onclick="location.href='notifications-messages.html'">🔔 Alerts</button></div></header><main class="wrap"><section class="card"><div id="cover" class="cover"></div><div class="body"><span class="live"><i class="pulse"></i> LIVE PROFILE</span><div id="avatar" class="avatar">T</div><h1 id="name">Loading...</h1><p id="bio" class="muted"></p><div class="stats"><div class="stat"><b id="postsCount">0</b>Posts</div><div class="stat"><b id="friendsCount">0</b>Friends</div><div class="stat"><b id="followingCount">0</b>Following</div></div><div id="actions" class="actions"></div></div></section><section id="editor" class="card hidden"><div class="editor"><h2>✏️ Edit My Profile</h2><label>Display Name</label><input id="displayName" class="input"><label>Bio</label><textarea id="bioInput" class="input" rows="4"></textarea><label>Profile Photo</label><input id="avatarFile" class="input" type="file" accept="image/*" onchange="uploadProfileImage('avatar',this.files[0])"><label>Cover Photo</label><input id="coverFile" class="input" type="file" accept="image/*" onchange="uploadProfileImage('cover',this.files[0])"><input id="avatarInput" class="input" type="hidden"><input id="coverInput" class="input" type="hidden"><button class="btn" onclick="saveProfile()">💾 Save Profile</button><div id="status" class="status"></div></div></section><section class="card"><div class="body"><span class="tag">PUBLIC PROFILE</span><h2>📝 Posts</h2></div><div id="posts"><div class="empty muted">Loading posts...</div></div></section></main><script src="supabase-client.js"></script><script>let sb=null,currentUser=null,profile=null,friendBusy=false,followBusy=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nameOf=p=>p?.display_name||'Trooth Member';const $=id=>document.getElementById(id);async function ready(){if(window.troothSupabase)return window.troothSupabase;return await new Promise((resolve,reject)=>{let done=false;const finish=(value,error)=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('trooth-supabase-ready',onReady);error?reject(error):resolve(value)};const onReady=()=>window.troothSupabase?finish(window.troothSupabase):finish(null,new Error('Trooth Supabase client is unavailable.'));const timer=setTimeout(()=>finish(null,new Error('Trooth services took too long to start. Please refresh and try again.')),10000);window.addEventListener('trooth-supabase-ready',onReady,{once:true});if(window.troothSupabase)onReady()})}async function init(){try{sb=await ready();const auth=await sb.auth.getUser();currentUser=auth?.data?.user||null;const qs=new URLSearchParams(location.search);const id=qs.get('user')||qs.get('id')||currentUser?.id;if(!id){showError('Please login first.');return}let q=await sb.from('profiles').select('id,display_name,bio,is_public,avatar_url,cover_url,updated_at').eq('id',id).maybeSingle();if(q.error){showError('Profile service error: '+q.error.message);return}let data=q.data;if(!data&&currentUser&&id===currentUser.id){const meta=currentUser.user_metadata||{};const seed={id:currentUser.id,display_name:(meta.display_name||meta.full_name||currentUser.email?.split('@')[0]||'Trooth Member'),bio:meta.bio||'',is_public:true};const ins=await sb.from('profiles').upsert(seed,{onConflict:'id'}).select('id,display_name,bio,is_public,avatar_url,cover_url,updated_at').maybeSingle();if(ins.error){showError('Profile could not be created: '+ins.error.message);return}data=ins.data}if(!data||data.is_public===false){showError('This profile is unavailable or private.');return}profile=data;window.profile=profile;renderProfile();await Promise.all([loadPosts(),loadStats()]);if(currentUser&&currentUser.id===profile.id){$('editor').classList.remove('hidden');$('displayName').value=profile.display_name||'';$('bioInput').value=profile.bio||'';$('avatarInput').value=profile.avatar_url||'';$('coverInput').value=profile.cover_url||''}else if(currentUser)await renderActions()}catch(e){showError(e?.message||'Trooth profile could not load. Please refresh and try again.')}}function showError(t){document.querySelector('.wrap').innerHTML='<section class="card"><div class="empty"><h2>⚠️ '+esc(t)+'</h2><button class="btn" onclick="location.href=\'auth.html\'">Login</button></div></section>'}function freshMedia(url){if(!url)return '';const s=String(url);return s+(s.includes('?')?'&':'?')+'v='+encodeURIComponent(profile?.updated_at||Date.now())}function renderProfile(){const n=nameOf(profile);$('name').textContent=n;$('bio').textContent=profile.bio||'Trooth Community Member';$('avatar').innerHTML=profile.avatar_url?'<img src="'+esc(freshMedia(profile.avatar_url))+'" alt="Profile photo">':esc(n[0]?.toUpperCase()||'T');if(profile.cover_url)$('cover').style.backgroundImage='url("'+esc(freshMedia(profile.cover_url))+'")';$('actions').innerHTML=currentUser&&currentUser.id===profile.id?'<button class="btn" onclick="$(\'editor\').scrollIntoView({behavior:\'smooth\'})">✏️ Edit Profile</button><button class="btn" onclick="location.href=\'friends.html\'">👥 Friends</button><button class="btn" onclick="location.href=\'chat.html\'">💬 Messages</button>':'<button class="btn" id="friendBtn">＋ Add Friend</button><button class="btn" onclick="location.href=\'chat.html?user='+encodeURIComponent(profile.id)+'\'">💬 Message</button><button class="btn" id="followBtn">Follow</button>'}async function loadPosts(){const {data,error}=await sb.from('posts').select('id,user_id,body,created_at').eq('user_id',profile.id).order('created_at',{ascending:false}).limit(50);$('postsCount').textContent=(data||[]).length;if(error){$('posts').innerHTML='<div class="empty">Unable to load posts.</div>';return}$('posts').innerHTML=(data||[]).map(p=>'<article class="post"><div class="posthead"><div class="mini">'+esc(nameOf(profile)[0]?.toUpperCase()||'T')+'</div><div><b>'+esc(nameOf(profile))+'</b><br><span class="muted">'+new Date(p.created_at).toLocaleString()+'</span></div></div><p class="posttext">'+esc(p.body||'')+'</p></article>').join('')||'<div class="empty muted">No posts yet.</div>'}async function loadStats(){const [{data:f},{data:fol}]=await Promise.all([sb.from('friend_requests').select('id').eq('status','accepted').or('sender_id.eq.'+profile.id+',receiver_id.eq.'+profile.id),sb.from('connections').select('following_id').eq('follower_id',profile.id)]);$('friendsCount').textContent=(f||[]).length;$('followingCount').textContent=(fol||[]).length}async function renderActions(){if(!currentUser||!profile||currentUser.id===profile.id)return;const {data:fr}=await sb.from('friend_requests').select('id,sender_id,receiver_id,status').or('and(sender_id.eq.'+currentUser.id+',receiver_id.eq.'+profile.id+'),and(sender_id.eq.'+profile.id+',receiver_id.eq.'+currentUser.id+')').order('created_at',{ascending:false}).limit(1);const row=(fr||[])[0];const {data:fol}=await sb.from('connections').select('following_id').eq('follower_id',currentUser.id).eq('following_id',profile.id).maybeSingle();const fb=$('friendBtn'),fl=$('followBtn');if(!fb||!fl)return;if(row?.status==='accepted'){fb.textContent='✓ Friends';fb.disabled=true}else if(row?.status==='pending'&&row.sender_id===currentUser.id){fb.textContent='⏳ Request Sent';fb.disabled=true}else if(row?.status==='pending'){fb.textContent='✓ Accept Request';fb.disabled=false;fb.onclick=()=>acceptRequest(row.id)}else{fb.textContent='＋ Add Friend';fb.disabled=false;fb.onclick=sendRequest}fl.textContent=fol?'✓ Following':'Follow';fl.disabled=false;fl.onclick=toggleFollow}async function sendRequest(){if(friendBusy||!currentUser||!profile)return;friendBusy=true;const b=$('friendBtn');if(b)b.disabled=true;const existing=await sb.from('friend_requests').select('id,status,sender_id,receiver_id').or('and(sender_id.eq.'+currentUser.id+',receiver_id.eq.'+profile.id+'),and(sender_id.eq.'+profile.id+',receiver_id.eq.'+currentUser.id+')').order('created_at',{ascending:false}).limit(1);if(existing.data?.[0]){friendBusy=false;await renderActions();return}const {error}=await sb.from('friend_requests').insert({sender_id:currentUser.id,receiver_id:profile.id,status:'pending'});friendBusy=false;if(error){alert(error.message);await renderActions();return}await renderActions()}async function acceptRequest(id){if(friendBusy)return;friendBusy=true;const b=$('friendBtn');if(b)b.disabled=true;const {error}=await sb.from('friend_requests').update({status:'accepted',updated_at:new Date().toISOString()}).eq('id',id).eq('receiver_id',currentUser.id);friendBusy=false;if(error){alert(error.message);await renderActions();return}await renderActions();await loadStats()}async function toggleFollow(){if(followBusy||!currentUser||!profile)return;followBusy=true;const b=$('followBtn');if(b)b.disabled=true;const q=await sb.from('connections').select('following_id').eq('follower_id',currentUser.id).eq('following_id',profile.id).maybeSingle();if(q.data){await sb.from('connections').delete().eq('follower_id',currentUser.id).eq('following_id',profile.id)}else{const r=await sb.from('connections').insert({follower_id:currentUser.id,following_id:profile.id});if(r.error){followBusy=false;alert(r.error.message);await renderActions();return}}followBusy=false;await renderActions();await loadStats()}async function uploadProfileImage(kind,file){
if(!file||!currentUser||!sb)return;
const status=$('status');
if(!file.type.startsWith('image/')){status.textContent='Please choose an image file.';return}
if(!['image/jpeg','image/png','image/webp'].includes(file.type)){status.textContent='Use JPG, PNG or WebP.';return}
if(file.size>8*1024*1024){status.textContent='Image must be 8 MB or smaller.';return}
status.textContent='Preparing '+(kind==='avatar'?'profile photo':'cover photo')+'…';
try{
  const optimized=await optimizeProfileImage(file,kind);
  const ext='jpg',path=currentUser.id+'/'+kind+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const up=await sb.storage.from('profile-media').upload(path,optimized,{upsert:false,contentType:'image/jpeg',cacheControl:'3600'});
  if(up.error)throw up.error;
  const baseUrl=sb.storage.from('profile-media').getPublicUrl(path).data.publicUrl;
  const url=baseUrl+'?v='+Date.now();
  const field=kind==='avatar'?'avatar_url':'cover_url';
  const r=await sb.from('profiles').update({[field]:url,updated_at:new Date().toISOString()}).eq('id',currentUser.id).select('id,display_name,bio,is_public,avatar_url,cover_url,updated_at').maybeSingle();
  if(r.error)throw r.error;
  if(!r.data)throw new Error('Profile record was not saved. Please save your profile first.');
  profile=r.data;window.profile=profile;
  status.textContent=(kind==='avatar'?'Profile photo':'Cover photo')+' updated ✓';
  window.dispatchEvent(new CustomEvent('trooth-profile-updated',{detail:{profile:profile}}));
  renderProfile();
  $('displayName').value=profile.display_name||'';
  $('bioInput').value=profile.bio||'';
  $('avatarInput').value=profile.avatar_url||'';
  $('coverInput').value=profile.cover_url||'';
}catch(e){status.textContent='Upload failed: '+(e?.message||'Please try again.')}}
function optimizeProfileImage(file,kind){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const max=kind==='avatar'?900:1600,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error('Image preparation failed.'))},'image/jpeg',.86);
      }catch(e){URL.revokeObjectURL(url);reject(e)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read the selected image.'))};
    img.src=url;
  })
}
async function saveProfile(){if(!currentUser||!sb){$('status').textContent='Please login again.';return}const patch={display_name:$('displayName').value.trim()||'Trooth Member',bio:$('bioInput').value.trim(),avatar_url:$('avatarInput').value.trim()||null,cover_url:$('coverInput').value.trim()||null,updated_at:new Date().toISOString()};const r=await sb.from('profiles').update(patch).eq('id',currentUser.id).select('id,display_name,bio,is_public,avatar_url,cover_url,updated_at').maybeSingle();if(r.error){$('status').textContent=r.error.message;return}if(!r.data){const ins=await sb.from('profiles').upsert({id:currentUser.id,...patch},{onConflict:'id'}).select('id,display_name,bio,is_public,avatar_url,cover_url,updated_at').maybeSingle();if(ins.error){$('status').textContent=ins.error.message;return}profile=ins.data}else profile=r.data;window.profile=profile;$('status').textContent='Profile saved ✓';window.dispatchEvent(new CustomEvent('trooth-profile-updated',{detail:{profile:profile}}));renderProfile();$('avatarInput').value=profile.avatar_url||'';$('coverInput').value=profile.cover_url||'';}window.addEventListener('trooth-post-update',e=>{if(profile&&e.detail?.new?.user_id===profile.id)loadPosts()});window.addEventListener('trooth-profile-notification',()=>{if(currentUser&&profile&&currentUser.id!==profile.id)renderActions()});window.addEventListener('trooth-profile-live-refresh',async e=>{if(!profile||e.detail?.profileId!==profile.id)return;const r=await sb.from('profiles').select('id,display_name,bio,is_public,avatar_url,cover_url,updated_at').eq('id',profile.id).maybeSingle();if(r.data&&r.data.is_public!==false){profile=r.data;window.profile=profile;renderProfile();await Promise.all([loadPosts(),loadStats()]);if(currentUser&&currentUser.id!==profile.id)await renderActions()}});init();</script><script>
(function(){
  function initials(name){return String(name||'T').trim().charAt(0).toUpperCase()||'T'}

    if(av){av.classList.add('profile-media-loading');av.onload=function(){av.classList.remove('profile-media-loading')};av.onerror=function(){var p=av.parentElement;p.classList.add('media-fallback');p.textContent=initials(window.profile?.display_name||'Trooth')}}

  };
})();
</script><script>var _troothRenderProfile=window.renderProfile;window.addEventListener('trooth-profile-updated',function(e){window.profile=e.detail?.profile||window.profile;if(window.troothBindProfileMedia)window.troothBindProfileMedia()});setTimeout(function(){if(window.troothBindProfileMedia)window.troothBindProfileMedia()},500);</script><script src="trooth-profile-live-sync.js"></script><script src="trooth-globe-logo-v1.js"></script><script>
