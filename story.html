<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18a957"><title>Create Story — Trooth</title><style>:root{--g:#18a957;--ink:#18231d;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.page{max-width:680px;margin:0 auto;padding:18px 12px}.card{border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(20,70,40,.08)}h1{font-size:21px;margin:0 0 4px}.muted{color:#718078;font-size:12px}.pick{display:flex;align-items:center;justify-content:center;min-height:260px;margin-top:18px;border:2px dashed #b8ddc5;border-radius:14px;background:#f7fcf8;color:#187044;font-weight:900;cursor:pointer}.pick input{display:none}.preview img,.preview video{width:100%;max-height:560px;object-fit:cover;border-radius:12px;margin-top:12px}.publish{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.publish:disabled{opacity:.6}.status{display:block;margin-top:9px}</style></head><body><main class="page"><section class="card"><h1>Create Story</h1><div class="muted">Choose a picture or video. Your Story stays active for 24 hours.</div><label class="pick">＋ Select picture / video<input id="file" type="file" accept="image/*,video/*"></label><div id="preview" class="preview"></div><button id="publish" class="publish">Share Story</button><span id="status" class="muted status"></span></section></main><script src="supabase-client.js"></script><script>let user=null,file=null;const $=id=>document.getElementById(id);async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));return window.troothSupabase}$('file').onchange=e=>{file=e.target.files[0]||null;if(!file){$('preview').innerHTML='';return}if(file.size>20*1024*1024){$('status').textContent='Media must be 20 MB or smaller.';file=null;e.target.value='';return}$('status').textContent='';$('preview').innerHTML=file.type.startsWith('video/')?'<video src="'+URL.createObjectURL(file)+'" controls></video>':'<img src="'+URL.createObjectURL(file)+'">'};async function boot(){const s=await ready();user=(await s.auth.getUser()).data.user||null;if(!user)location.href='auth.html'}$('publish').onclick=async()=>{if(!user||!file)return;$('publish').disabled=true;$('status').textContent='Uploading story…';try{const s=window.troothSupabase,ext=(file.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'');const path=user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const u=await s.storage.from('story-media').upload(path,file,{contentType:file.type});if(u.error)throw u.error;const url=s.storage.from('story-media').getPublicUrl(path).data.publicUrl;const r=await s.from('stories_reels').insert({user_id:user.id,body:'',media_url:url,media_type:file.type.startsWith('video/')?'video':'image',expires_at:new Date(Date.now()+24*60*60*1000).toISOString()});if(r.error)throw r.error;$('status').textContent='Story shared ✓';setTimeout(()=>location.href='index.html',600)}catch(e){$('status').textContent='Story failed: '+(e.message||'Please try again.')}finally{$('publish').disabled=false}};boot()</script><script src="trooth-unified-nav-v1.js?v=20261002-story1"></script></body></html>
