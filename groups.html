<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#40916c"><title>Trooth Groups</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:12px 5%;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:5;flex-wrap:wrap}.logo{font-size:24px;font-weight:800;margin-right:auto}.btn{border:0;border-radius:10px;padding:9px 13px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.top .btn{background:#fff;color:#2d6a4f}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #245c3a14}.field{width:100%;border:1px solid #dcebe2;border-radius:10px;padding:10px;margin:6px 0;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.group{border:1px solid #dcebe2;border-radius:14px;padding:15px;transition:.15s}.group:hover{transform:translateY(-1px);box-shadow:0 5px 16px #245c3a12}.muted{color:#718276;font-size:13px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f6ee;margin:3px 0}.notice{background:#fff7d6;padding:10px;border-radius:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs .active{background:#1b7f52}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.stat{background:#e8f6ee;border-radius:10px;padding:8px 12px;font-size:13px}.hero{background:linear-gradient(135deg,#d8f3dc,#fff);border:1px solid #c7e8d1}.empty{text-align:center;padding:24px}.live{font-size:12px;font-weight:800;color:#1b7f52}.group-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.count-live{font-weight:800}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1b7f52;box-shadow:0 0 0 0 #74c69d;animation:pulse 1.7s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}@media(max-width:600px){.wrap{padding:10px}.top{padding:12px 10px}.logo{width:100%;margin:0}.top .btn{flex:1}.card{padding:14px}.group{padding:13px}.tabs .btn{flex:1;min-width:105px}}@media(prefers-reduced-motion:reduce){.group{transition:none}.pulse{animation:none}}</style></head><body><header class="top"><div class="logo">🌿 Trooth Groups</div><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn" onclick="location.href='friends.html'">👥 Friends</button><button class="btn" onclick="location.href='notifications.html'">🔔 Notifications</button></header><main class="wrap"><section class="card hero"><h2>👥 Your Trooth Community</h2><p class="muted">Create communities, join conversations and discover people with shared interests.</p><div class="live"><span class="pulse"></span> LIVE GROUPS · updates automatically</div></section><section class="card"><h2>➕ Create a Group</h2><input id="name" class="field" placeholder="Group name" maxlength="80"><textarea id="desc" class="field" rows="3" maxlength="500" placeholder="What is this community about?"></textarea><select id="privacy" class="field"><option value="public">🌐 Public Group — anyone can join</option><option value="private">🔒 Private Group — approval required</option></select><button id="createBtn" class="btn" onclick="createGroup()">Create Group</button> <span id="status" class="muted" aria-live="polite"></span></section><section class="card"><h2>🌍 Discover Groups</h2><div class="stats"><span class="stat" id="allCount">All: 0</span><span class="stat" id="myCount">My Groups: 0</span><span class="stat" id="reqCount">Requests: 0</span><span class="stat count-live" id="liveState">● Live</span></div><div class="tabs"><button class="btn active" id="tabAll" onclick="setTab('all')">All Groups</button><button class="btn" id="tabMine" onclick="setTab('mine')">My Groups</button><button class="btn" id="tabReq" onclick="setTab('requests')">My Requests</button></div><input id="search" class="field" placeholder="🔎 Search groups..." aria-label="Search groups" oninput="render()"><div id="list" class="grid">Loading...</div></section></main><script src="supabase-client.js"></script><script>let sb,user,groups=[],joined=new Set(),requests=new Map(),tab='all',refreshTimer=null,groupChannel=null,authSub=null,loading=false,pendingLoad=false,booting=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function toast(msg){if(window.troothLiveToast)window.troothLiveToast(msg,1500);else if(window.TroothToast)window.TroothToast(msg);else status.textContent=msg}async function ready(){if(booting)return;booting=true;try{if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;if(!sb||!sb.auth)return;const u=await sb.auth.getUser();user=u.data.user||null;if(!user){cleanupRealtime();liveState.textContent='○ Login required';list.innerHTML='<div class="notice">Please login to create or join groups.</div>';return}await load();subscribe()}finally{booting=false}}async function load(){if(!sb||!user)return;if(loading){pendingLoad=true;return}loading=true;try{const g=await sb.from('groups').select('id,name,description,privacy,created_by,created_at').order('created_at',{ascending:false});if(g.error){list.innerHTML='<div class="notice">'+esc(g.error.message)+'</div>';return}groups=g.data||[];const m=await sb.from('group_members').select('group_id').eq('user_id',user.id);joined=new Set((m.data||[]).map(x=>x.group_id));const r=await sb.from('group_join_requests').select('group_id,status').eq('user_id',user.id);requests=new Map((r.data||[]).map(x=>[x.group_id,x.status]));updateCounts();render();liveState.textContent='● Live'}finally{loading=false;if(pendingLoad){pendingLoad=false;scheduleLoad()}}}function scheduleLoad(){clearTimeout(refreshTimer);refreshTimer=setTimeout(load,250)}function updateCounts(){allCount.textContent='All: '+groups.length;myCount.textContent='My Groups: '+groups.filter(x=>joined.has(x.id)).length;reqCount.textContent='Requests: '+[...requests.values()].filter(x=>x==='pending').length}function setTab(v){tab=v;['tabAll','tabMine','tabReq'].forEach(id=>$(id).classList.remove('active'));$(v==='all'?'tabAll':v==='mine'?'tabMine':'tabReq').classList.add('active');render()}function render(){const q=(search.value||'').toLowerCase();let arr=groups.filter(x=>(x.name+' '+(x.description||'')).toLowerCase().includes(q));if(tab==='mine')arr=arr.filter(x=>joined.has(x.id));if(tab==='requests')arr=arr.filter(x=>requests.get(x.id)==='pending');list.innerHTML=arr.length?arr.map(x=>{const isMember=joined.has(x.id),req=requests.get(x.id);let action=isMember?'<button class="btn" onclick="openGroup(\''+x.id+'\')">Open Group</button>':x.privacy==='private'?(req==='pending'?'<button class="btn" disabled>⏳ Pending</button>':req==='rejected'?'<button class="btn" onclick="requestJoin(\''+x.id+'\')">Request Again</button>':'<button class="btn" onclick="requestJoin(\''+x.id+'\')">🔒 Request to Join</button>'):'<button class="btn" onclick="join(\''+x.id+'\')">Join Group</button>';return '<article class="group"><h3>'+esc(x.name)+'</h3><span class="tag">'+(x.privacy==='private'?'🔒 Private':'🌐 Public')+'</span><p>'+esc(x.description||'No description yet.')+'</p><div class="group-actions">'+action+'<button class="btn" onclick="openGroup(\''+x.id+'\')">View</button></div></article>'}).join(''):'<div class="muted empty">No groups found for this view.</div>'}async function createGroup(){if(!user){status.textContent='Login required.';return}const n=name.value.trim();if(!n){status.textContent='Group name required.';name.focus();return}createBtn.disabled=true;status.textContent='Creating...';try{const r=await sb.from('groups').insert({name:n,description:desc.value.trim(),privacy:privacy.value,created_by:user.id}).select('id').single();if(r.error){status.textContent=r.error.message;return}const m=await sb.from('group_members').insert({group_id:r.data.id,user_id:user.id,role:'admin'});if(m.error){status.textContent='Group created, but membership setup failed: '+m.error.message;return}name.value='';desc.value='';status.textContent='Created ✓';toast('🌿 Group created');await load()}finally{createBtn.disabled=false}}async function join(id){const r=await sb.from('group_members').insert({group_id:id,user_id:user.id,role:'member'});if(r.error)toast(r.error.message);else{toast('✅ Joined group');await load()}}async function requestJoin(id){const r=await sb.from('group_join_requests').upsert({group_id:id,user_id:user.id,status:'pending'},{onConflict:'group_id,user_id'});if(r.error)toast(r.error.message);else{requests.set(id,'pending');updateCounts();render();toast('⏳ Join request sent')}}function openGroup(id){location.href='group.html?id='+encodeURIComponent(id)}function cleanupRealtime(){clearTimeout(refreshTimer);refreshTimer=null;if(groupChannel&&sb)try{sb.removeChannel(groupChannel)}catch(e){}groupChannel=null;window.troothGroupsChannel=null;if(authSub&&authSub.data&&authSub.data.subscription&&authSub.data.subscription.unsubscribe)try{authSub.data.subscription.unsubscribe()}catch(e){}authSub=null}function subscribe(){if(!sb||!user)return;cleanupRealtime();groupChannel=sb.channel('trooth-groups-live-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'groups'},function(){toast('🔄 Groups updated');scheduleLoad()}).on('postgres_changes',{event:'*',schema:'public',table:'group_members',filter:'user_id=eq.'+user.id},function(){scheduleLoad()}).on('postgres_changes',{event:'*',schema:'public',table:'group_join_requests',filter:'user_id=eq.'+user.id},function(){scheduleLoad()}).subscribe(function(state){if(state==='SUBSCRIBED'){liveState.textContent='● Live';window.dispatchEvent(new CustomEvent('trooth-groups-live'))}else if(state==='CHANNEL_ERROR'||state==='TIMED_OUT'){liveState.textContent='↻ Reconnecting';setTimeout(function(){if(user&&!groupChannel)subscribe()},700)}});window.troothGroupsChannel=groupChannel;authSub=sb.auth.onAuthStateChange(function(event){if(event==='SIGNED_OUT'){user=null;cleanupRealtime();groups=[];joined.clear();requests.clear();list.innerHTML='<div class="notice">Please login to create or join groups.</div>';liveState.textContent='○ Login required';return}if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'||event==='USER_UPDATED')setTimeout(ready,50)})}window.addEventListener('beforeunload',cleanupRealtime);ready();</script></body></html>
