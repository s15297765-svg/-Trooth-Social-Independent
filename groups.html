<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Groups</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:800}.top input{flex:1;max-width:560px;border:0;border-radius:24px;padding:11px 16px}.btn{border:0;border-radius:10px;padding:10px 15px;background:#40916c;color:#fff;font-weight:700;cursor:pointer}.top .btn{background:#fff;color:#2d6a4f}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 3px 14px #245c3a14}.hero{background:linear-gradient(135deg,#d8f3dc,#fff);padding:25px}.hero h1{margin:0 0 8px}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;border:1px solid #d9e9df;border-radius:10px;padding:11px;font:inherit}.form textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.group{border:1px solid #dcebe2;border-radius:14px;padding:16px}.group h3{margin:0 0 7px}.muted{color:#718276;font-size:13px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.count{background:#d8f3dc;color:#2d6a4f;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}.empty{text-align:center;padding:30px;color:#718276}@media(max-width:700px){.grid{grid-template-columns:1fr}.top input{display:none}.wrap{padding:10px}}</style></head><body><header class="top"><div class="logo">Trooth</div><input id="search" placeholder="Search groups..." oninput="render()"><button class="btn" onclick="location.href='index.html'">⌂ Home</button><button class="btn" onclick="location.href='chat.html'">💬 Chat</button></header><main class="wrap"><section class="card hero"><h1>👥 Trooth Groups</h1><p>Build communities around news, sports, business, education, local interests and independent voices.</p></section><section class="card"><h2>➕ Create a Group</h2><div class="form"><input id="name" placeholder="Group name"><textarea id="description" placeholder="What is this group about?"></textarea><button class="btn" onclick="createGroup()">Create Group</button><span id="status" class="muted"></span></div></section><section class="card"><h2>🌐 Discover Groups</h2><div id="groups" class="grid"></div></section></main><script src="supabase-client.js"></script><script>let sb=null,user=null,items=[];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;const u=await sb.auth.getUser();user=u.data.user||null;await load()}async function load(){const r=await sb.from('groups').select('id,name,description,created_by,created_at').order('created_at',{ascending:false});if(r.error){groups.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}items=r.data||[];await render()}async function render(){const q=(search.value||'').toLowerCase();const rows=items.filter(x=>(x.name+' '+x.description).toLowerCase().includes(q));if(!rows.length){groups.innerHTML='<div class="empty">No groups yet. Create the first Trooth community.</div>';return}const ids=rows.map(x=>x.id);const m=ids.length?await sb.from('group_members').select('group_id,user_id').in('group_id',ids):{data:[]};const members=m.data||[];groups.innerHTML=rows.map(x=>{const list=members.filter(a=>a.group_id===x.id),joined=user&&list.some(a=>a.user_id===user.id);return '<article class="group"><h3>👥 '+esc(x.name)+'</h3><p class="muted">'+esc(x.description||'Trooth community')+'</p><div class="meta"><span class="count">'+list.length+' member'+(list.length===1?'':'s')+'</span><button class="btn" onclick="toggleJoin(\''+x.id+'\','+joined+')">'+(joined?'Leave':'Join')+'</button></div></article>'}).join('')}async function createGroup(){if(!user){alert('Please login first.');location.href='auth.html';return}const n=name.value.trim(),d=description.value.trim();if(!n){status.textContent='Please enter a group name.';return}status.textContent='Creating...';const r=await sb.from('groups').insert({name:n,description:d,created_by:user.id}).select('id').single();if(r.error){status.textContent=r.error.message;return}await sb.from('group_members').insert({group_id:r.data.id,user_id:user.id,role:'admin'});name.value='';description.value='';status.textContent='Group created ✓';await load()}async function toggleJoin(id,joined){if(!user){alert('Please login first.');location.href='auth.html';return}let r;if(joined)r=await sb.from('group_members').delete().eq('group_id',id).eq('user_id',user.id);else r=await sb.from('group_members').insert({group_id:id,user_id:user.id,role:'member'});if(r.error)alert(r.error.message);else await load()}ready();</script></body></html>
