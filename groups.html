<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Groups</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:800}.btn{border:0;border-radius:9px;padding:9px 13px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.top .btn{background:#fff;color:#2d6a4f}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #245c3a14}.field{width:100%;border:1px solid #dcebe2;border-radius:10px;padding:10px;margin:6px 0;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.group{border:1px solid #dcebe2;border-radius:14px;padding:15px}.muted{color:#718276;font-size:13px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f6ee;margin:3px 0}.notice{background:#fff7d6;padding:10px;border-radius:10px}@media(max-width:600px){.wrap{padding:10px}.top{padding:12px 10px}}</style></head><body><header class="top"><div class="logo">Trooth Groups</div><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn" onclick="location.href='notifications-messages.html'">🔔 Notifications</button></header><main class="wrap"><section class="card"><h2>👥 Create a Group</h2><input id="name" class="field" placeholder="Group name"><textarea id="desc" class="field" rows="3" placeholder="Description"></textarea><select id="privacy" class="field"><option value="public">🌐 Public Group</option><option value="private">🔒 Private Group — approval required</option></select><button class="btn" onclick="createGroup()">Create Group</button><span id="status" class="muted"></span></section><section class="card"><h2>🌍 Discover Groups</h2><input id="search" class="field" placeholder="Search groups..." oninput="render()"><div id="list" class="grid">Loading...</div></section></main><script src="supabase-client.js"></script><script>let sb,user,groups=[],joined=new Set(),requests=new Map();const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;const u=await sb.auth.getUser();user=u.data.user||null;if(!user){list.innerHTML='<div class="notice">Please login to create or join groups.</div>';return}await load()}async function load(){const g=await sb.from('groups').select('id,name,description,privacy,created_by,created_at').order('created_at',{ascending:false});groups=g.data||[];const m=await sb.from('group_members').select('group_id').eq('user_id',user.id);joined=new Set((m.data||[]).map(x=>x.group_id));const r=await sb.from('group_join_requests').select('group_id,status').eq('user_id',user.id);requests=new Map((r.data||[]).map(x=>[x.group_id,x.status]));render()}function render(){const q=(search.value||'').toLowerCase();const arr=groups.filter(x=>(x.name+' '+(x.description||'')).toLowerCase().includes(q));list.innerHTML=arr.length?arr.map(x=>{const isMember=joined.has(x.id),req=requests.get(x.id);let action=isMember?'<button class="btn" onclick="openGroup(\''+x.id+'\')">Open</button>':x.privacy==='private'?(req==='pending'?'<button class="btn" disabled>⏳ Request Pending</button>':req==='rejected'?'<button class="btn" onclick="requestJoin(\''+x.id+'\')">Request Again</button>':'<button class="btn" onclick="requestJoin(\''+x.id+'\')">🔒 Request to Join</button>'):'<button class="btn" onclick="join(\''+x.id+'\')">Join</button>';return '<article class="group"><h3>'+esc(x.name)+'</h3><span class="tag">'+(x.privacy==='private'?'🔒 Private':'🌐 Public')+'</span><p>'+esc(x.description||'')+'</p>'+action+' <button class="btn" onclick="openGroup(\''+x.id+'\')">View</button></article>'}).join(''):'<div class="muted">No groups found.</div>'}async function createGroup(){if(!user){status.textContent='Login required.';return}const n=name.value.trim();if(!n){status.textContent='Group name required.';return}const r=await sb.from('groups').insert({name:n,description:desc.value.trim(),privacy:privacy.value,created_by:user.id}).select('id').single();if(r.error){status.textContent=r.error.message;return}await sb.from('group_members').insert({group_id:r.data.id,user_id:user.id,role:'admin'});name.value='';desc.value='';status.textContent='Created ✓';await load()}async function join(id){const r=await sb.from('group_members').insert({group_id:id,user_id:user.id,role:'member'});if(r.error)alert(r.error.message);else await load()}async function requestJoin(id){const r=await sb.from('group_join_requests').upsert({group_id:id,user_id:user.id,status:'pending'},{onConflict:'group_id,user_id'});if(r.error)alert(r.error.message);else{requests.set(id,'pending');render()}}function openGroup(id){location.href='group.html?id='+encodeURIComponent(id)}ready();</script></body></html>
