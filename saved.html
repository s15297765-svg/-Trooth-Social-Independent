<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74c69d"><title>Trooth — Saved</title><style>:root{--g:#74c69d;--g2:#2d6a4f;--p:#d8f3dc;--bg:#eef8f1;--ink:#173b29;--muted:#718276;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{background:var(--g);color:#fff;padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:900}.nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--g2);color:#fff;font-weight:800;cursor:pointer}.nav .btn{background:#fff;color:var(--g2)}main{max-width:850px;margin:20px auto;padding:0 14px}.card{background:var(--card);border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 3px 15px #245c3a12}.muted{color:var(--muted)}.body{white-space:pre-wrap;line-height:1.55;margin:12px 0}.tag{display:inline-block;background:var(--p);color:var(--g2);padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #e7efe9;padding-top:12px}.empty{text-align:center;padding:35px}.danger{background:#edf6f0;color:#2d6a4f}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.nav{width:100%;justify-content:stretch}.nav .btn{flex:1;min-width:85px;text-align:center}main{margin:12px auto}.card{padding:15px}}@media(max-width:420px){.nav .btn{font-size:12px;padding:9px 7px}.row{align-items:flex-start;flex-direction:column}.row .btn{width:100%}}</style></head><body><header class="top"><div class="logo">Trooth</div><nav class="nav"><button class="btn" onclick="location.href='index.html'">🏠 Home</button><button class="btn" onclick="location.href='friends.html'">👥 Friends</button><button class="btn" onclick="location.href='business.html'">💼 Business</button><button class="btn" onclick="location.href='chat.html'">💬 Messages</button><button class="btn" onclick="location.href='notifications-messages.html'">🔔 Alerts</button></nav></header><main><div class="card"><span class="tag">🔖 SAVED CONTENT</span><h1>My Saved Content</h1><p class="muted">News, Sports, Stores, Property, Film & Fashion, Business and Groups saved from the Unified Feed.</p><div id="status" class="muted">Loading…</div></div><section id="list"></section></main><script src="supabase-client.js"></script><script>async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));return window.troothSupabase}const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const cfg={news:{table:'news_stories',label:'📰 News',title:r=>r.title,body:r=>r.body,meta:r=>r.category||'News'},sports:{table:'sports_stories',label:'🏏 Sports',title:r=>r.title,body:r=>r.body,meta:r=>r.category||'Sports'},stores:{table:'store_listings',label:'🛍️ Store',title:r=>r.name,body:r=>r.description,meta:r=>r.category||'Store'},property:{table:'properties',label:'🏠 Property',title:r=>r.title,body:r=>r.description,meta:r=>(r.category||'Property')+(r.location?' · '+r.location:'')},film_fashion:{table:'film_fashion_stories',label:'🎬 Film & Fashion',title:r=>r.title,body:r=>r.body,meta:r=>r.category||'Story'},business:{table:'businesses',label:'💼 Business',title:r=>r.name,body:r=>r.description,meta:r=>r.category||'Business'},group:{table:'groups',label:'👥 Group',title:r=>r.name,body:r=>r.description,meta:r=>r.privacy||'Group'}};let channel=null,timer=null,sbRef=null,user=null;function schedule(ms){clearTimeout(timer);timer=setTimeout(load,ms||120)}async function load(){const sb=await ready();sbRef=sb;const u=(await sb.auth.getUser()).data.user;if(!u){location.href='auth.html';return}user=u;const s=await sb.from('saved_content').select('id,content_type,content_id,created_at').eq('user_id',u.id).order('created_at',{ascending:false});if(s.error){document.getElementById('status').textContent='Unable to load saved content.';return}const saves=s.data||[];if(!saves.length){document.getElementById('status').textContent='';document.getElementById('list').innerHTML='<div class="card empty">🔖 ابھی کوئی محفوظ مواد نہیں۔<br><br><button class="btn" onclick="location.href=\'index.html\'">Home Feed پر جائیں</button></div>';return}const buckets={};saves.forEach(x=>(buckets[x.content_type]??=[]).push(x.content_id));const fetched={};await Promise.all(Object.keys(buckets).map(async type=>{const c=cfg[type];if(!c)return;const r=await sb.from(c.table).select('*').in('id',buckets[type]);fetched[type]=r.data||[]}));const byKey={};Object.keys(fetched).forEach(type=>(fetched[type]||[]).forEach(r=>byKey[type+':'+r.id]=r));document.getElementById('status').textContent=saves.length+' saved item'+(saves.length===1?'':'s');document.getElementById('list').innerHTML=saves.map(x=>{const c=cfg[x.content_type],r=byKey[x.content_type+':'+x.content_id];if(!c||!r)return '';return '<article class="card"><span class="tag">'+c.label+'</span><h2>'+esc(c.title(r)||'Trooth Update')+'</h2><div class="body">'+esc(c.body(r)||'')+'</div><p class="muted">'+esc(c.meta(r)||'')+' · Saved '+new Date(x.created_at).toLocaleString()+'</p><div class="row"><small class="muted">🔖 Saved</small><button class="btn danger" onclick="unsave(\''+x.id+'\')">Remove Save</button></div></article>'}).join('')||'<div class="card empty">Saved content is no longer available.</div>'}async function unsave(id){const sb=await ready(),u=(await sb.auth.getUser()).data.user;if(!u)return;const r=await sb.from('saved_content').delete().eq('id',id).eq('user_id',u.id);if(r.error){alert('Could not remove saved content.');return}window.dispatchEvent(new CustomEvent('trooth-saved-content-refresh'));schedule(40)}async function live(){const sb=await ready();if(!user||channel)return;channel=sb.channel('trooth-saved-content-live-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'saved_content',filter:'user_id=eq.'+user.id},()=>schedule(80)).subscribe()}function cleanup(){clearTimeout(timer);if(channel&&sbRef){try{sbRef.removeChannel(channel)}catch(e){}channel=null}}async function init(){await load();await live();window.addEventListener('trooth-saved-content-refresh',()=>schedule(80));document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(250)});window.addEventListener('online',()=>schedule(250))}window.addEventListener('beforeunload',cleanup);init();</script></body></html>
