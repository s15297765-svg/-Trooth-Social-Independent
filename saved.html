<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74c69d"><title>Trooth — Saved Posts</title><style>:root{--g:#74c69d;--g2:#2d6a4f;--p:#d8f3dc;--bg:#eef8f1;--ink:#173b29;--muted:#718276;--card:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{background:var(--g);color:#fff;padding:12px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--g2);color:#fff;font-weight:800;cursor:pointer}.top .btn{background:#fff;color:var(--g2)}main{max-width:850px;margin:20px auto;padding:0 14px}.card{background:var(--card);border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 3px 15px #245c3a12}.muted{color:var(--muted)}.posthead{display:flex;gap:10px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.body{white-space:pre-wrap;line-height:1.55;margin:14px 0}.media{max-width:100%;max-height:520px;border-radius:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #e7efe9;padding-top:12px}.empty{text-align:center;padding:35px}.danger{background:#edf6f0;color:#2d6a4f}.tag{display:inline-block;background:var(--p);color:var(--g2);padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}.live{display:inline-flex;align-items:center;gap:6px;background:#edf6f0;color:#2d6a4f;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800}.pulse{width:8px;height:8px;border-radius:50%;background:#2d6a4f;box-shadow:0 0 0 0 #74c69d;animation:pulse 1.7s infinite}@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="btn" onclick="location.href='index.html'">⌂ Home</button></header><main><div class="card"><span class="tag">🔖 SAVED POSTS</span> <span class="live"><i class="pulse"></i> LIVE</span><h1>My Saved Posts</h1><p class="muted">Your private collection of posts you saved on Trooth.</p><div id="status" class="muted">Loading…</div></div><section id="list"></section></main><script src="supabase-client.js"></script><script>async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));return window.troothSupabase}const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let liveChannel=null,refreshTimer=null,busy=false,queued=false,currentUser=null,supabaseRef=null;async function load(){const sb=await ready();supabaseRef=sb;const u=(await sb.auth.getUser()).data.user;if(!u){location.href='auth.html';return}currentUser=u;if(busy){queued=true;return}busy=true;try{const r=await sb.from('saved_posts').select('id,post_id,created_at').eq('user_id',u.id).order('created_at',{ascending:false});if(r.error){document.getElementById('status').textContent='Unable to load saved posts.';return}const saves=r.data||[];if(!saves.length){document.getElementById('status').textContent='';document.getElementById('list').innerHTML='<div class="card empty">🔖 ابھی کوئی محفوظ پوسٹ نہیں۔<br><br><button class="btn" onclick="location.href=\'index.html\'">Home Feed پر جائیں</button></div>';return}const ids=saves.map(x=>x.post_id),pr=await sb.from('posts').select('id,user_id,body,created_at,media_url,media_type').in('id',ids),rows=pr.data||[],pids=[...new Set(rows.map(x=>x.user_id))],profiles={};if(pids.length){const pp=await sb.from('profiles').select('id,display_name,avatar_url').in('id',pids);(pp.data||[]).forEach(x=>profiles[x.id]=x)}const order={};saves.forEach((x,i)=>order[x.post_id]=i);rows.sort((a,b)=>(order[a.id]??999)-(order[b.id]??999));document.getElementById('status').textContent=saves.length+' saved post'+(saves.length===1?'':'s');document.getElementById('list').innerHTML=rows.map(x=>{const p=profiles[x.user_id]||{},n=p.display_name||'Trooth Member',a=p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':esc(n[0].toUpperCase()),m=x.media_url?(x.media_type==='video'?'<video class="media" src="'+esc(x.media_url)+'" controls></video>':'<img class="media" src="'+esc(x.media_url)+'">'):'';return '<article class="card" data-id="'+x.id+'"><div class="posthead"><div class="avatar">'+a+'</div><div><b>'+esc(n)+'</b><br><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div></div><div class="body">'+esc(x.body||'')+'</div>'+m+'<div class="row"><small class="muted">🔖 Saved</small><button class="btn danger" onclick="unsave(\''+x.id+'\')">Remove Save</button></div></article>'}).join('')}finally{busy=false;if(queued){queued=false;schedule(60)}}}function schedule(ms){clearTimeout(refreshTimer);refreshTimer=setTimeout(load,ms||180)}async function startLive(){const sb=await ready();supabaseRef=sb;if(!currentUser||liveChannel)return;liveChannel=sb.channel('trooth-saved-posts-live-'+currentUser.id).on('postgres_changes',{event:'*',schema:'public',table:'saved_posts',filter:'user_id=eq.'+currentUser.id},()=>schedule(80)).subscribe()}async function unsave(id){const sb=await ready(),u=(await sb.auth.getUser()).data.user;if(!u)return;const r=await sb.from('saved_posts').delete().eq('user_id',u.id).eq('post_id',id);if(r.error){alert('Could not remove saved post.');return}window.dispatchEvent(new CustomEvent('trooth-content-interaction-refresh'));schedule(40)}function cleanup(){clearTimeout(refreshTimer);if(liveChannel&&supabaseRef){try{supabaseRef.removeChannel(liveChannel)}catch(e){}liveChannel=null}}async function init(){await load();await startLive();window.addEventListener('trooth-content-interaction-refresh',()=>schedule(80));window.addEventListener('trooth-live-refresh-complete',()=>schedule(120));window.addEventListener('trooth-unread-refresh',()=>schedule(150));window.addEventListener('online',()=>schedule(250));document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(250)});window.addEventListener('pageshow',()=>schedule(250))}window.addEventListener('beforeunload',cleanup);init();</script></body></html>
