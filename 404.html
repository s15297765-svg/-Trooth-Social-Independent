<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#40916c">
<title>Trooth — صفحہ نہیں ملا</title>
<style>
:root{--g:#74c69d;--g2:#40916c;--p:#d8f3dc;--bg:#eef8f1;--ink:#173b29;--muted:#718276;--card:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--bg),var(--p));font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);padding:24px}.card{width:min(560px,100%);background:var(--card);border-radius:28px;padding:42px 28px;text-align:center;box-shadow:0 18px 55px #173b2918;border:1px solid #74c69d55}.logo{width:76px;height:76px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;background:var(--g);color:#fff;font-size:38px;font-weight:900}.code{font-size:72px;line-height:1;font-weight:900;color:var(--g2);margin:8px 0 12px}.title{font-size:28px;font-weight:800;margin:0 0 10px}.text{font-size:16px;color:var(--muted);line-height:1.8;margin:0 auto 24px;max-width:430px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}a{display:inline-block;text-decoration:none;padding:12px 20px;border-radius:14px;font-weight:800}.home{background:var(--g2);color:#fff}.back{background:var(--p);color:var(--ink)}small{display:block;margin-top:22px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
<div class="logo">🌿</div>
<div class="code">404</div>
<h1 class="title">یہ صفحہ نہیں ملا</h1>
<p class="text">لگتا ہے یہ Trooth صفحہ موجود نہیں، منتقل ہو گیا ہے، یا لنک درست نہیں۔ واپس Home Feed پر چلیں۔</p>
<div class="actions"><a class="home" href="./index.html">🏠 Home Feed</a><a class="back" href="javascript:history.back()">↩️ واپس</a></div>
<small>Trooth Social Independent</small>
</main>
</body>
</html>
