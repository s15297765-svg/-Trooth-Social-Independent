<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15803d"><title>Trooth Creator Page</title><style>:root{--g:#16a34a;--deep:#15803d;--soft:#dcfce7;--bg:#f3faf5;--ink:#173b29;--muted:#6c7d72;--line:#dbe9df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;display:flex;gap:8px;align-items:center}.top a,.top button{border:0;border-radius:20px;padding:9px 13px;background:#eef7f1;color:var(--deep);font-weight:850;text-decoration:none}.brand{margin:auto;font-weight:950;color:var(--deep)}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 5px 18px #1d5a3210}.cover{height:210px;background:linear-gradient(135deg,#15803d,#86efac);background-position:center;background-size:cover}.head{padding:0 18px 18px}.avatar{width:90px;height:90px;margin-top:-45px;border:5px solid #fff;border-radius:20px;background:var(--g);display:grid;place-items:center;color:#fff;font-size:32px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:27px;font-weight:950;margin-top:9px}.meta{color:var(--muted);font-size:13px;margin-top:3px}.bio{margin:9px 0;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--deep);color:#fff;font-weight:850}.btn.alt{background:#e8f5ec;color:var(--deep)}.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.stat{background:#f1f8f3;border-radius:10px;padding:8px 13px;font-size:12px}.stat b{font-size:18px;display:block}.post{padding:16px}.posthead{display:flex;gap:9px;align-items:center}.mini{width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.mini img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted);font-size:12px}.body{white-space:pre-wrap;line-height:1.55;margin:10px 0}.media{width:100%;max-height:600px;object-fit:cover;border-radius:12px}.empty{text-align:center;color:var(--muted);padding:24px}@media(max-width:600px){.cover{height:170px}.head{padding:0 14px 16px}.name{font-size:24px}.actions .btn{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr)}.stat{text-align:center;padding:7px 4px}}</style></head><body><header class="top"><a href="index.html">⌂ Home</a><div class="brand">Trooth</div><a href="dashboard.html">Creator Studio</a></header><main class="wrap"><section class="card"><div id="cover" class="cover"></div><div class="head"><div id="avatar" class="avatar">T</div><div id="name" class="name">Loading…</div><div id="meta" class="meta"></div><div id="bio" class="bio"></div><div class="actions"><button id="follow" class="btn">Follow</button><button class="btn alt" onclick="sharePage()">↗ Share Page</button></div><div class="stats"><div class="stat"><b id="followers">0</b>Followers</div><div class="stat"><b id="views">0</b>Views</div><div class="stat"><b id="posts">0</b>Posts</div></div></div></section><section class="card"><div id="feed"><div class="empty">Loading Page posts…</div></div></section></main><script src="supabase-client.js"></script><script>let sb=null,user=null,page=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function ready(){if(window.troothSupabase)return window.troothSupabase;return await new Promise((r,j)=>{let t=setTimeout(()=>j(new Error('Trooth services unavailable.')),10000);window.addEventListener('trooth-supabase-ready',()=>{clearTimeout(t);r(window.troothSupabase)},{once:true})})}async function boot(){sb=await ready();user=(await sb.auth.getUser()).data.user||null;const id=new URLSearchParams(location.search).get('id');if(!id){$('feed').innerHTML='<div class="empty">Creator Page not found.</div>';return}const r=await sb.from('creator_pages').select('*').eq('id',id).maybeSingle();if(r.error||!r.data){$('feed').innerHTML='<div class="empty">Creator Page is unavailable.</div>';return}page=r.data;render();await recordView();await loadStats();await loadPosts();await setupFollow()}function render(){const p=page,n=p.name||'Trooth Creator';$('name').textContent=n;$('meta').textContent=(p.category||'Creator')+' • Trooth Creator Page';$('bio').textContent=p.bio||'';$('avatar').innerHTML=p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':esc(n[0].toUpperCase());if(p.cover_url)$('cover').style.backgroundImage='url("'+esc(p.cover_url)+'")'}async function recordView(){if(!user||user.id===page.owner_id)return;await sb.from('creator_page_views').insert({page_id:page.id,viewer_id:user.id})}async function loadStats(){const [f,v,p]=await Promise.all([sb.from('creator_page_followers').select('user_id',{count:'exact',head:true}).eq('page_id',page.id),sb.from('creator_page_views').select('id',{count:'exact',head:true}).eq('page_id',page.id),sb.from('posts').select('id',{count:'exact',head:true}).eq('page_id',page.id)]);$('followers').textContent=f.count||0;$('views').textContent=v.count||0;$('posts').textContent=p.count||0}async function setupFollow(){const b=$('follow');if(!user){b.textContent='Login to Follow';b.onclick=()=>location.href='auth.html';return}if(user.id===page.owner_id){b.textContent='Your Page';b.disabled=true;return}const q=await sb.from('creator_page_followers').select('user_id').eq('page_id',page.id).eq('user_id',user.id).maybeSingle();b.textContent=q.data?'✓ Following':'Follow';b.onclick=async()=>{b.disabled=true;const cur=await sb.from('creator_page_followers').select('user_id').eq('page_id',page.id).eq('user_id',user.id).maybeSingle();if(cur.data)await sb.from('creator_page_followers').delete().eq('page_id',page.id).eq('user_id',user.id);else await sb.from('creator_page_followers').insert({page_id:page.id,user_id:user.id});await loadStats();await setupFollow()}}async function loadPosts(){const r=await sb.from('posts').select('id,user_id,body,media_url,media_type,created_at').eq('page_id',page.id).order('created_at',{ascending:false}).limit(50);if(r.error){$('feed').innerHTML='<div class="empty">Unable to load Page posts.</div>';return}const rows=r.data||[];$('feed').innerHTML=rows.map(x=>'<article class="post"><div class="posthead"><div class="mini">'+esc((page.name||'T')[0].toUpperCase())+'</div><div><b>'+esc(page.name)+'</b><br><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div></div><div class="body">'+esc(x.body||'')+'</div>'+(x.media_url?(x.media_type==='video'?'<video class="media" controls src="'+esc(x.media_url)+'"></video>':'<img class="media" src="'+esc(x.media_url)+'">'):'')+'</article>').join('')||'<div class="empty">No Page posts yet.</div>'}async function sharePage(){const url=location.href;try{if(navigator.share){await navigator.share({title:page.name,text:'Visit this Trooth Creator Page',url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Page link copied.')}}catch(e){}}boot();</script><script src="trooth-unified-nav-v1.js?v=20260924-4"></script></body></html>
