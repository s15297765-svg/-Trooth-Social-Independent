<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18a957"><title>Create Post — Trooth</title><style>:root{--g:#18a957;--ink:#18231d;--line:#dfe9e3}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.page{max-width:680px;margin:0 auto;padding:18px 12px}.card{border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(20,70,40,.08)}h1{font-size:21px;margin:0 0 4px}.muted{color:#718078;font-size:12px}.profile{display:flex;align-items:center;gap:10px;margin:14px 0}.avatar{width:44px;height:44px;border-radius:50%;background:#18a957;color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;resize:vertical;outline:0}textarea:focus{border-color:#8fd0a8}.actions{display:flex;gap:8px;align-items:center;margin-top:10px}.pick{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;background:#edf9f1;color:#187044;font-weight:800;font-size:13px;cursor:pointer}.pick input{display:none}.publish{margin-left:auto;border:0;border-radius:10px;padding:11px 18px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.publish:disabled{opacity:.6}.preview img,.preview video{width:100%;max-height:500px;object-fit:cover;border-radius:12px;margin-top:10px}.status{display:block;margin-top:9px}</style></head><body><main class="page"><section class="card"><h1 id="pageTitle">Create Post</h1><div id="pageHint" class="muted">Your post will be published to the Trooth feed.</div><div class="profile"><div id="avatar" class="avatar">T</div><div><b id="name">Trooth Member</b><div class="muted">Public post</div></div></div><textarea id="body" placeholder="What's on your mind?"></textarea><div id="preview" class="preview"></div><div class="actions"><label class="pick">▧ Picture<input id="image" type="file" accept="image/*"></label><label class="pick">▶ Video<input id="video" type="file" accept="video/*"></label><button id="publish" class="publish">Post</button></div><span id="status" class="muted status"></span></section></main><script src="supabase-client.js"></script><script>let user=null,file=null,type=null;const $=id=>document.getElementById(id);async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));return window.troothSupabase}function show(f,t){file=f;type=t;$('preview').innerHTML=f?(t==='image'?'<img src="'+URL.createObjectURL(f)+'">':'<video src="'+URL.createObjectURL(f)+'" controls playsinline preload="metadata"></video>'):''}async function boot(){const mode=new URLSearchParams(location.search).get('mode');if(mode==='video'){ $('pageTitle').textContent='Create Video'; $('pageHint').textContent='Choose a video and publish it to the Trooth feed.'; $('image').closest('.pick').style.display='none'; setTimeout(()=>$('video').click(),0); }else if(mode==='note'){ $('pageTitle').textContent='Create Note'; $('pageHint').textContent='Write a text note for the Trooth feed.'; $('image').closest('.pick').style.display='none'; $('video').closest('.pick').style.display='none'; }const s=await ready();user=(await s.auth.getUser()).data.user||null;if(!user){location.href='auth.html';return}const p=await s.from('profiles').select('display_name,avatar_url,updated_at').eq('id',user.id).maybeSingle();const n=p.data?.display_name||user.email?.split('@')[0]||'Trooth Member';$('name').textContent=n;if(p.data?.avatar_url){const u=String(p.data.avatar_url)+(String(p.data.avatar_url).includes('?')?'&':'?')+'v='+encodeURIComponent(p.data.updated_at||Date.now());$('avatar').innerHTML='<img src="'+u+'" alt="Profile photo">'}}$('image').onchange=e=>{const f=e.target.files[0];$('video').value='';if(f)show(f,'image')};$('video').onchange=e=>{const f=e.target.files[0];$('image').value='';if(f)show(f,'video')};$('publish').onclick=async()=>{const s=window.troothSupabase;if(!s){$('status').textContent='Trooth connection is still loading…';return}const live=(await s.auth.getUser()).data.user||null;if(!live){location.href='auth.html';return}user=live;const text=$('body').value.trim();if(!text&&!file){$('status').textContent='Write something or select a picture/video.';return}if(file&&file.size>20*1024*1024){$('status').textContent='Media must be 20 MB or smaller.';return}const b=$('publish');b.disabled=true;$('status').textContent='Posting…';let path=null;try{let url=null,media_type=null;if(file){if(!file.type||(type==='image'&&!file.type.startsWith('image/'))||(type==='video'&&!file.type.startsWith('video/'))){throw new Error('Selected media type is not valid. Please choose the file again.')}const ext=(file.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'bin';path=user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const u=await s.storage.from('post-media').upload(path,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(u.error)throw u.error;const pub=s.storage.from('post-media').getPublicUrl(path);url=pub.data?.publicUrl||null;if(!url)throw new Error('Media URL could not be created.')}const r=await s.from('posts').insert({user_id:user.id,body:text,media_url:url,media_type});if(r.error)throw r.error;$('body').value='';$('image').value='';$('video').value='';file=null;type=null;$('preview').innerHTML='';$('status').textContent='Post published ✓';setTimeout(()=>location.href='index.html#feed',500)}catch(e){if(path){try{await s.storage.from('post-media').remove([path])}catch(cleanErr){console.warn('Post media cleanup skipped:',cleanErr?.message||cleanErr)}}console.error('Trooth post publish failed:',e);$('status').textContent='Post failed: '+(e?.message||'Please try again.')}finally{b.disabled=false}};boot()</script><script src="trooth-profile-live-sync.js"></script><script src="trooth-unified-nav-v1.js?v=20261003-5"></script><script src="trooth-nav-final-icons-v1.js?v=20261003-3"></script></body></html>
