<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Business Network</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}header{background:#74c69d;color:#fff;padding:16px 5%;position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center}header b{font-size:23px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 14px #245c3a14}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #d8e8dc;font:inherit}input,textarea,select{width:100%;margin:5px 0}button{background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.nav a{color:#14532d;font-weight:bold;margin-right:12px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.biz{overflow:hidden;border:1px solid #dcebe1;border-radius:16px;background:#fff}.cover{height:120px;background:#d8f3dc;display:grid;place-items:center;color:#2d6a4f;font-size:38px}.cover img{width:100%;height:100%;object-fit:cover}.bizbody{padding:15px}.logo{width:72px;height:72px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:bold;overflow:hidden;margin-top:-45px;border:4px solid #fff;position:relative}.logo img{width:100%;height:100%;object-fit:cover}.muted{color:#718276;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.file{display:inline-block;background:#d8f3dc;color:#2d6a4f;padding:9px 12px;border-radius:9px;font-weight:bold;cursor:pointer}.hidden{display:none}.post{border-top:1px solid #e3eee6;padding:12px 0}.post img{max-width:100%;border-radius:10px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modalbox{background:#fff;max-width:700px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:18px}.close{float:right;background:#eee;color:#173b29}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:10px}@media(max-width:600px){main{padding:10px}header{padding:14px}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}</style></head><body><header><b>🌿 Trooth Business Network</b><span>💼 Live Business Profiles</span></header><main><nav class="card nav"><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="stores.html">Stores</a><a href="property.html">Property</a><a href="film-fashion.html">Film & Fashion</a><a href="auth.html">Profile</a></nav><section class="card"><h2>🏢 Create Your Business Profile</h2><form id="form"><input id="name" placeholder="Business Name" required><select id="category"><option>Retail</option><option>Services</option><option>Technology</option><option>Food</option><option>Property</option><option>Fashion</option><option>Entertainment</option><option>Other</option></select><textarea id="description" placeholder="Business description" required></textarea><input id="phone" placeholder="Phone / WhatsApp"><input id="website" placeholder="Website or social page"><input id="location" placeholder="City / Location"><div class="actions"><label class="file">🖼️ Logo<input id="logoInput" class="hidden" type="file" accept="image/*"></label><label class="file">🌄 Cover<input id="coverInput" class="hidden" type="file" accept="image/*"></label><button>Create Business Profile</button></div></form><p id="status" class="muted"></p></section><section class="card"><h2>🔎 Explore Businesses</h2><div class="toolbar"><input id="search" placeholder="Search by name, category or location..."><select id="filter"><option>All Categories</option><option>Retail</option><option>Services</option><option>Technology</option><option>Food</option><option>Property</option><option>Fashion</option><option>Entertainment</option><option>Other</option></select></div></section><div id="list" class="grid"></div></main><div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="modal.style.display='none'">✕</button><div id="detail"></div></div></div><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load();sb.channel('trooth-business-live').on('postgres_changes',{event:'*',schema:'public',table:'businesses'},load).subscribe()}async function upload(file,folder){if(!file)return null;const ext=file.name.split('.').pop().toLowerCase();const path=user.id+'/'+folder+'-'+Date.now()+'.'+ext;const r=await sb.storage.from('business-media').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;return sb.storage.from('business-media').getPublicUrl(path).data.publicUrl}async function load(){const r=await sb.from('businesses').select('id,user_id,name,category,description,phone,website,location,logo_url,cover_url,created_at').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){const q=search.value.toLowerCase().trim(),f=filter.value;const filtered=rows.filter(x=>(f==='All Categories'||x.category===f)&&((x.name||'')+' '+(x.category||'')+' '+(x.description||'')+' '+(x.location||'')).toLowerCase().includes(q));list.innerHTML=filtered.map(x=>{const initial=esc((x.name||'B')[0].toUpperCase());return `<article class="biz"><div class="cover">${x.cover_url?`<img src="${esc(x.cover_url)}">`:'🏢'}</div><div class="bizbody"><div class="logo">${x.logo_url?`<img src="${esc(x.logo_url)}">`:initial}</div><h2>${esc(x.name)}</h2><b>${esc(x.category)}</b><p>${esc(x.description||'')}</p><p class="muted">${x.location?'📍 '+esc(x.location):''}${x.phone?' • 📞 '+esc(x.phone):''}</p><div class="actions"><button onclick="openBiz('${x.id}')">View Business</button>${x.website?`<a href="${esc(x.website)}" target="_blank" rel="noopener"><button type="button">🌐 Website</button></a>`:''}</div><div id="i-${x.id}" style="margin-top:12px"></div></div></article>`}).join('')||'<p class="muted">No businesses found.</p>';filtered.forEach(x=>{const el=document.getElementById('i-'+x.id);if(el)TroothInteractions.render(sb,user,'business',x.id,el)})}async function openBiz(id){const x=rows.find(a=>a.id===id);if(!x)return;modal.style.display='flex';detail.innerHTML=`<div class="cover">${x.cover_url?`<img src="${esc(x.cover_url)}">`:'🏢'}</div><div class="logo">${x.logo_url?`<img src="${esc(x.logo_url)}">`:esc((x.name||'B')[0].toUpperCase())}</div><h2>${esc(x.name)}</h2><b>${esc(x.category)}</b><p>${esc(x.description||'')}</p><p>📍 ${esc(x.location||'Not listed')}<br>📞 ${esc(x.phone||'Not listed')}<br>🌐 ${x.website?`<a href="${esc(x.website)}" target="_blank">Open Website</a>`:'Not listed'}</p><hr><h3>📢 Business Posts</h3><div id="bizposts"></div>${user&&user.id===x.user_id?`<div class="card"><textarea id="bpbody" placeholder="Publish a post for your business..."></textarea><button onclick="publishBusinessPost('${x.id}')">Publish Business Post</button></div>`:''}`;await loadBusinessPosts(x.id)}async function loadBusinessPosts(id){const r=await sb.from('business_posts').select('id,body,created_at').eq('business_id',id).order('created_at',{ascending:false}).limit(30);bizposts.innerHTML=(r.data||[]).map(p=>`<div class="post"><p>${esc(p.body)}</p><small class="muted">${new Date(p.created_at).toLocaleString()}</small></div>`).join('')||'<p class="muted">No business posts yet.</p>'}async function publishBusinessPost(id){const body=bpbody.value.trim();if(!body||!user)return;const r=await sb.from('business_posts').insert({business_id:id,user_id:user.id,body});if(r.error){alert(r.error.message);return}bpbody.value='';await loadBusinessPosts(id)}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');location.href='auth.html';return}try{status.textContent='Creating business profile...';const logo=await upload(logoInput.files[0],'logo');const cover=await upload(coverInput.files[0],'cover');const r=await sb.from('businesses').insert({user_id:user.id,name:name.value.trim(),category:category.value,description:description.value.trim(),phone:phone.value.trim()||null,website:website.value.trim()||null,location:location.value.trim()||null,logo_url:logo,cover_url:cover});if(r.error)throw r.error;form.reset();status.textContent='Business Profile created successfully ✓';await load()}catch(e){status.textContent='';alert(e.message)}};search.oninput=render;filter.onchange=render;init()</script></body></html>
