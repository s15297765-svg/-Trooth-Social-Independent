<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trooth Business Network</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.top{background:#74c69d;color:#fff;padding:18px 5%;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:800}.top h1{font-size:20px}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #245c3a14}.hero{background:linear-gradient(135deg,#d8f3dc,#fff);text-align:center}.hero h2{font-size:28px;margin-bottom:8px}.hero p{color:#667b6d;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:bold;font-size:13px}.field input,.field textarea,.field select,.search{border:1px solid #d8e8dc;border-radius:10px;padding:11px;outline:0;background:#fbfefc}.field textarea{min-height:90px;resize:vertical}.btn{background:#40916c;color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:bold}.btn:hover{background:#2d6a4f}.btn.alt{background:#d8f3dc;color:#2d6a4f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.biz{border:1px solid #e0eee5;border-radius:14px;padding:16px;background:#fbfefc}.bizhead{display:flex;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:#40916c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px}.biz h3{margin-bottom:3px}.muted{color:#718276;font-size:13px}.tag{display:inline-block;background:#d8f3dc;color:#2d6a4f;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold;margin:10px 0}.desc{line-height:1.5;margin:8px 0}.stats{display:flex;gap:15px;margin-top:10px;color:#557363;font-size:12px}.empty{text-align:center;color:#718276;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{background:#fff;padding:9px 13px;border-radius:9px;font-weight:bold;box-shadow:0 2px 8px #245c3a10}.notice{padding:10px 13px;border-radius:9px;background:#d8f3dc;color:#2d6a4f;margin-top:10px;display:none}@media(max-width:700px){.grid,.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:14px}.top h1{font-size:17px}}</style></head><body><header class="top"><div class="logo">Trooth</div><h1>💼 Business Network</h1></header><main class="wrap"><nav class="nav"><a href="index.html">🏠 Home</a><a href="friends.html">👥 Friends</a><a href="auth.html">👤 Profile</a></nav><section class="card hero"><h2>Build Your Business on Trooth</h2><p>Connect businesses, entrepreneurs, professionals and customers in one independent network.</p></section><section class="card"><h2>➕ Add Your Business</h2><p class="muted" style="margin:6px 0 15px">Create a local business profile for the Trooth community.</p><form id="businessForm" class="formgrid"><div class="field"><label>Business Name</label><input id="bizName" required placeholder="e.g. Trooth Media Studio"></div><div class="field"><label>Category</label><select id="bizCategory"><option>Retail</option><option>Services</option><option>Technology</option><option>Food</option><option>Property</option><option>Fashion</option><option>Entertainment</option><option>Other</option></select></div><div class="field"><label>Location</label><input id="bizLocation" placeholder="City, Country"></div><div class="field"><label>Contact</label><input id="bizContact" placeholder="Phone, email or social handle"></div><div class="field full"><label>Website (optional)</label><input id="bizWebsite" placeholder="https://example.com"></div><div class="field full"><label>Description</label><textarea id="bizDescription" required placeholder="Tell people about your business..."></textarea></div><div class="field full"><button class="btn" type="submit">Create Business Profile</button></div></form><div id="notice" class="notice"></div></section><section class="card"><h2>🔎 Explore Businesses</h2><div style="display:flex;gap:9px;flex-wrap:wrap;margin:12px 0"><input id="search" class="search" style="flex:1;min-width:200px" placeholder="Search businesses..." oninput="renderBusinesses()"><select id="filter" class="search" onchange="renderBusinesses()"><option value="All">All Categories</option><option>Retail</option><option>Services</option><option>Technology</option><option>Food</option><option>Property</option><option>Fashion</option><option>Entertainment</option><option>Other</option></select></div><div id="businesses" class="grid"></div></section></main><script>const key='troothBusinesses',connKey='troothConnections',noticeKey='troothNotifications';function getBusinesses(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function saveBusinesses(x){localStorage.setItem(key,JSON.stringify(x))}function getConnections(){try{return JSON.parse(localStorage.getItem(connKey)||'{"friends":[],"following":[]}')}catch(e){return{friends:[],following:[]}}}function notify(text){let n=[];try{n=JSON.parse(localStorage.getItem(noticeKey)||'[]')}catch(e){}n.unshift({id:Date.now(),text,read:false,time:new Date().toLocaleString()});localStorage.setItem(noticeKey,JSON.stringify(n.slice(0,50)))}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function renderBusinesses(){const list=getBusinesses(),q=(document.getElementById('search').value||'').toLowerCase(),cat=document.getElementById('filter').value,box=document.getElementById('businesses');const filtered=list.filter(b=>(cat==='All'||b.category===cat)&&(!q||[b.name,b.category,b.location,b.description].join(' ').toLowerCase().includes(q)));if(!filtered.length){box.innerHTML='<div class="empty">No businesses yet. Be the first to add one!</div>';return}const con=getConnections();box.innerHTML=filtered.map(b=>{const following=con.following.includes(b.id);return '<article class="biz"><div class="bizhead"><div class="avatar">'+esc((b.name||'B')[0].toUpperCase())+'</div><div><h3>'+esc(b.name)+'</h3><div class="muted">'+esc(b.location||'Online')+'</div></div></div><span class="tag">'+esc(b.category)+'</span><p class="desc">'+esc(b.description)+'</p><div class="muted">📞 '+esc(b.contact||'Not provided')+'</div>'+(b.website?'<div class="muted">🌐 '+esc(b.website)+'</div>':'')+'<div class="stats">👥 '+(following?'Following':'Not following')+'</div><div class="actions"><button class="btn '+(following?'alt':'')+'" onclick="toggleFollow('+b.id+')">'+(following?'✓ Following':'＋ Follow Business')+'</button><button class="btn alt" onclick="contactBusiness('+b.id+')">💬 Contact</button></div></article>'}).join('')}function toggleFollow(id){const con=getConnections();const b=getBusinesses().find(x=>x.id===id);if(!b)return;if(!Array.isArray(con.following))con.following=[];const i=con.following.indexOf(id);if(i>=0){con.following.splice(i,1);notify('You unfollowed '+b.name+'.')}else{con.following.push(id);notify('You are now following '+b.name+'.')}localStorage.setItem(connKey,JSON.stringify(con));renderBusinesses()}function contactBusiness(id){const b=getBusinesses().find(x=>x.id===id);if(!b)return;const text=prompt('Write a message to '+b.name+':');if(!text||!text.trim())return;let m=[];try{m=JSON.parse(localStorage.getItem('troothMessages')||'[]')}catch(e){}m.push({id:Date.now(),to:b.name,text:text.trim(),time:new Date().toLocaleString()});localStorage.setItem('troothMessages',JSON.stringify(m));notify('Message sent to '+b.name+'.');alert('Message sent successfully.')}document.getElementById('businessForm').addEventListener('submit',e=>{e.preventDefault();const name=bizName.value.trim(),description=bizDescription.value.trim();if(!name||!description)return;const b={id:Date.now(),name,category:bizCategory.value,location:bizLocation.value.trim(),contact:bizContact.value.trim(),website:bizWebsite.value.trim(),description,created:new Date().toLocaleString()};const list=getBusinesses();list.unshift(b);saveBusinesses(list);notify('Business profile created: '+name+'.');e.target.reset();notice.textContent='Business profile created successfully!';notice.style.display='block';renderBusinesses();setTimeout(()=>notice.style.display='none',3000)});renderBusinesses();</script></body></html>
