<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Business Network</title><style>body{font-family:Arial;margin:0;background:#eef8f1;color:#173b29}header{background:#74c69d;color:white;padding:18px}main{max-width:1000px;margin:auto;padding:18px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 14px #0001}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #d8e8dc;font:inherit}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0}button{background:#40916c;color:white;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.biz{border:1px solid #dcebe1;padding:14px;border-radius:14px}.muted{color:#718276}a{color:#14532d;font-weight:bold;margin-right:10px}</style></head><body><header><b>🌿 Trooth</b> — 💼 Business Network</header><main><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="auth.html">Profile</a></nav><section class="card"><h2>Add Your Business</h2><form id="form"><input id="name" placeholder="Business Name" required><select id="category"><option>Retail</option><option>Services</option><option>Technology</option><option>Food</option><option>Property</option><option>Fashion</option><option>Entertainment</option><option>Other</option></select><textarea id="description" placeholder="Business description" required></textarea><button>Create Business Profile</button></form></section><section class="card"><h2>🔎 Explore Businesses</h2><input id="search" placeholder="Search businesses..."><div id="list" class="grid"></div></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load()}async function load(){let r=await sb.from('businesses').select('id,user_id,name,category,description,created_at').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){let q=search.value.toLowerCase();list.innerHTML=rows.filter(x=>(x.name+' '+x.category+' '+x.description).toLowerCase().includes(q)).map(x=>`<article class="biz"><h3>💼 ${esc(x.name)}</h3><b>${esc(x.category)}</b><p>${esc(x.description)}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small><div id="i-${x.id}" style="margin-top:12px"></div></article>`).join('')||'<p class="muted">No businesses yet.</p>';rows.forEach(x=>TroothInteractions.render(sb,user,'business',x.id,document.getElementById('i-'+x.id)))}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');return}let r=await sb.from('businesses').insert({user_id:user.id,name:name.value.trim(),category:category.value,description:description.value.trim()});if(r.error){alert(r.error.message);return}form.reset();await load()};search.oninput=render;init()</script></body></html>
