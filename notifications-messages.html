<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Notifications & Messages</title><style>:root{--g:#43c66b;--dark:#14532d;--bg:#eefaf1;--card:#fff;--line:#d8eadc}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17351f}.top{background:var(--g);color:#fff;padding:15px 18px;position:sticky;top:0;z-index:5}.top h1{margin:0 0 9px;font-size:22px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{background:#fff;color:var(--dark);text-decoration:none;padding:7px 10px;border-radius:18px;font-size:12px}.wrap{max-width:1000px;margin:20px auto;padding:0 14px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:bold}.tabs .active{background:var(--g);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #14532d12}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h2{margin:0;color:var(--dark)}.btn{border:0;background:var(--g);color:#fff;padding:9px 13px;border-radius:9px;font-weight:bold}.item{border-top:1px solid var(--line);padding:13px 4px;display:flex;gap:11px;align-items:flex-start}.item:first-child{border-top:0}.avatar{width:40px;height:40px;border-radius:50%;background:#40916c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}.item b{color:var(--dark)}.item p{margin:4px 0;color:#566b5d;line-height:1.4;font-size:14px}.time{font-size:11px;color:#819487}.unread{background:#f0fbf3;border-radius:10px;padding:8px}.compose{display:flex;gap:8px;margin-top:12px}.compose input{flex:1;padding:11px;border:1px solid #bddcc4;border-radius:10px}.empty{text-align:center;padding:30px;color:#718276}footer{text-align:center;color:#fff;background:#2d6a4f;padding:24px;margin-top:20px;font-size:13px}</style></head><body><header class="top"><h1>🌿 Trooth Social Independent</h1><nav class="nav"><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="stores.html">Stores</a><a href="property.html">Property</a><a href="film-fashion.html">Film & Fashion</a><a href="auth.html">Profile</a></nav></header><main class="wrap"><div class="tabs"><button id="nb" onclick="show('notifications')">🔔 Notifications</button><button id="mb" onclick="show('messages')">💬 Messages</button></div><section id="notifications" class="card"><div class="head"><h2>🔔 Notifications</h2><button class="btn" onclick="markRead()">Mark all read</button></div><div id="notices"></div></section><section id="messages" class="card" style="display:none"><div class="head"><h2>💬 Messages</h2><button class="btn" onclick="clearMessages()">Clear all</button></div><div id="messagesList"></div><div class="compose"><input id="msg" placeholder="Write a local message..."><button class="btn" onclick="sendMessage()">Send</button></div></section></main><footer><b>Trooth Social Independent</b><br>Independent • Social • News • Sports • Business • Stores • Property • Film & Fashion</footer><script>const NK='troothNotifications',MK='troothMessages';function get(k){try{let x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function save(k,x){localStorage.setItem(k,JSON.stringify(x))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(which){notifications.style.display=which==='notifications'?'block':'none';messages.style.display=which==='messages'?'block':'none';nb.classList.toggle('active',which==='notifications');mb.classList.toggle('active',which==='messages');if(which==='notifications')renderN();else renderM()}function renderN(){let a=get(NK);if(!a.length){notices.innerHTML='<div class="empty">🔔 No notifications yet.</div>';return}notices.innerHTML=a.map((x,i)=>`<div class="item ${x.read?'':'unread'}"><div class="avatar">🔔</div><div><b>${esc(x.title||'Trooth Notification')}</b><p>${esc(x.text||x.message||'')}</p><span class="time">${esc(x.time||'')}</span></div></div>`).join('')}function renderM(){let a=get(MK);if(!a.length){messagesList.innerHTML='<div class="empty">💬 No messages yet. Start a local message below.</div>';return}messagesList.innerHTML=a.map(x=>`<div class="item"><div class="avatar">${esc((x.from||x.sender||'T')[0]||'T').toUpperCase()}</div><div><b>${esc(x.from||x.sender||'Trooth Member')}</b><p>${esc(x.text||x.message||'')}</p><span class="time">${esc(x.time||'')}</span></div></div>`).join('')}function markRead(){let a=get(NK);a.forEach(x=>x.read=true);save(NK,a);renderN()}function clearMessages(){if(confirm('Clear all local messages?')){save(MK,[]);renderM()}}function sendMessage(){let v=msg.value.trim();if(!v)return;let a=get(MK);a.push({from:'You',text:v,time:new Date().toLocaleString()});save(MK,a);msg.value='';renderM()}document.getElementById('nb').classList.add('active');renderN();</script></body></html>
