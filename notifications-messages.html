<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Notifications & Messages</title><style>:root{--g:#43c66b;--dark:#14532d;--bg:#eefaf1;--card:#fff;--line:#d8eadc;--muted:#66786d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17351f}.top{background:var(--g);color:#fff;padding:15px 18px;position:sticky;top:0;z-index:5}.top h1{margin:0 0 9px;font-size:22px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{background:#fff;color:var(--dark);text-decoration:none;padding:7px 10px;border-radius:18px;font-size:12px}.wrap{max-width:1050px;margin:20px auto;padding:0 14px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:bold;cursor:pointer}.tabs .active{background:var(--g);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #14532d12}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.head h2{margin:0;color:var(--dark)}.btn{border:0;background:var(--g);color:#fff;padding:9px 13px;border-radius:9px;font-weight:bold;cursor:pointer}.btn.secondary{background:#e8f7ec;color:var(--dark)}.item{border-top:1px solid var(--line);padding:13px 4px;display:flex;gap:11px;align-items:flex-start}.item:first-child{border-top:0}.avatar{width:42px;height:42px;border-radius:50%;background:#40916c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}.item b{color:var(--dark)}.item p{margin:4px 0;color:#566b5d;line-height:1.4;font-size:14px}.time{font-size:11px;color:#819487}.unread{background:#f0fbf3;border-radius:10px;padding:9px}.type{display:inline-block;font-size:10px;background:#dff4e4;color:var(--dark);padding:3px 7px;border-radius:12px;margin-right:6px}.compose{display:flex;gap:8px;margin-top:12px}.compose input{flex:1;padding:11px;border:1px solid #bddcc4;border-radius:10px}.empty{text-align:center;padding:30px;color:#718276}.count{display:inline-flex;min-width:22px;height:22px;padding:0 6px;border-radius:11px;align-items:center;justify-content:center;background:#fff;color:var(--dark);font-size:11px;margin-left:5px}footer{text-align:center;color:#fff;background:#2d6a4f;padding:24px;margin-top:20px;font-size:13px}</style></head><body><header class="top"><h1>🌿 Trooth Social Independent</h1><nav class="nav"><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="stores.html">Stores</a><a href="property.html">Property</a><a href="film-fashion.html">Film & Fashion</a><a href="auth.html">Profile</a></nav></header><main class="wrap"><div class="tabs"><button id="nb" onclick="show('notifications')">🔔 Notifications <span id="ncount" class="count">0</span></button><button id="mb" onclick="show('messages')">💬 Messages <span id="mcount" class="count">0</span></button></div><section id="notifications" class="card"><div class="head"><h2>🔔 Notifications</h2><div><button class="btn secondary" onclick="refreshAll()">↻ Refresh</button> <button class="btn" onclick="markRead()">Mark all read</button></div></div><div id="notices"></div></section><section id="messages" class="card" style="display:none"><div class="head"><h2>💬 Messages</h2><button class="btn secondary" onclick="renderM()">↻ Refresh</button></div><div id="messagesList"></div><p style="color:var(--muted);font-size:13px">To start a new conversation, open Friends and select a member.</p></section></main><footer><b>Trooth Social Independent</b><br>Independent • Social • News • Sports • Business • Stores • Property • Film & Fashion</footer><script src="supabase-client.js"></script><script>let supabase=null,currentUser=null,profiles=[];const $=id=>document.getElementById(id);const ready=()=>new Promise(r=>{if(window.troothSupabase)r();else window.addEventListener('trooth-supabase-ready',r,{once:true})});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();supabase=window.troothSupabase;const {data:{user}}=await supabase.auth.getUser();currentUser=user;if(!user){$('notices').innerHTML='<div class="empty">Please login first to view your notifications and messages.</div>';return}await loadProfiles();await refreshAll()}async function loadProfiles(){const {data}=await supabase.from('profiles').select('id,display_name');profiles=data||[]}function profileName(id){return profiles.find(p=>p.id===id)?.display_name||'Trooth Member'}function typeLabel(k){const m={Like:'❤️ Like',Comment:'💬 Comment',Follow:'👤 Follow',Friend:'🤝 Friend',Message:'✉️ Message'};return m[k]||('🔔 '+(k||'Notification'))}async function renderN(){const {data,error}=await supabase.from('notifications').select('id,actor_id,kind,body,is_read,created_at').eq('user_id',currentUser.id).order('created_at',{ascending:false});if(error){$('notices').innerHTML='<div class="empty">Unable to load notifications.</div>';return}const rows=data||[];$('ncount').textContent=rows.filter(x=>!x.is_read).length;$('notices').innerHTML=rows.map(x=>`<div class="item ${x.is_read?'':'unread'}"><div class="avatar">🔔</div><div><b>${esc(profileName(x.actor_id))}</b><p><span class="type">${esc(typeLabel(x.kind))}</span>${esc(x.body||'')}</p><span class="time">${new Date(x.created_at).toLocaleString()} ${x.is_read?'':'· Unread'}</span></div></div>`).join('')||'<div class="empty">🔔 No notifications yet.</div>'}async function markRead(){if(!currentUser)return;await supabase.from('notifications').update({is_read:true}).eq('user_id',currentUser.id).eq('is_read',false);await renderN()}async function renderM(){if(!currentUser)return;const {data,error}=await supabase.from('messages').select('id,sender_id,receiver_id,body,created_at').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order('created_at',{ascending:false});if(error){$('messagesList').innerHTML='<div class="empty">Unable to load messages.</div>';return}const rows=data||[];$('mcount').textContent=rows.filter(x=>x.receiver_id===currentUser.id).length;$('messagesList').innerHTML=rows.map(x=>{const other=x.sender_id===currentUser.id?x.receiver_id:x.sender_id;return `<div class="item"><div class="avatar">${esc((profileName(other)[0]||'T').toUpperCase())}</div><div><b>${esc(x.sender_id===currentUser.id?'You → '+profileName(other):profileName(other)+' → You')}</b><p>${esc(x.body)}</p><span class="time">${new Date(x.created_at).toLocaleString()}</span></div></div>`}).join('')||'<div class="empty">💬 No messages yet.</div>'}async function refreshAll(){if(!currentUser)return;await loadProfiles();await renderN();await renderM()}function show(which){$('notifications').style.display=which==='notifications'?'block':'none';$('messages').style.display=which==='messages'?'block':'none';$('nb').classList.toggle('active',which==='notifications');$('mb').classList.toggle('active',which==='messages');if(which==='notifications')renderN();else renderM()}$('nb').classList.add('active');init();</script></body></html>
