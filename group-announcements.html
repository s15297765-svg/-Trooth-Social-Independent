<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74c69d"><title>Trooth Group Announcements</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:13px 5%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}.logo{font-size:23px;font-weight:800;margin-right:auto}.btn{border:0;border-radius:9px;padding:9px 13px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.top .btn{background:#fff;color:#2d6a4f}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #245c3a14}.hero{background:linear-gradient(135deg,#74c69d,#d8f3dc)}h1,h2,h3{margin-top:0}.muted{color:#718276;font-size:13px}.form input,.form textarea{width:100%;border:1px solid #dcebe2;border-radius:10px;padding:10px;margin:6px 0 10px;font:inherit}.form textarea{min-height:110px;resize:vertical}.announcement{border:1px solid #dcebe2;border-left:5px solid #40916c;border-radius:12px;padding:15px;margin-top:12px;background:#fbfffc}.announcement h3{margin-bottom:6px;color:#2d6a4f}.time{font-size:11px;color:#819487}.danger{background:#c94c4c}.empty{text-align:center;padding:30px;color:#718276}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:180px;border:1px solid #dcebe2;border-radius:10px;padding:10px;font:inherit}.pin{display:inline-block;background:#d8f3dc;color:#2d6a4f;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;margin-bottom:6px}.announce-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(max-width:600px){.wrap{padding:10px}.top{padding:10px}.card{padding:14px}}</style></head><body><header class="top"><div class="logo">🌿 Trooth</div><button class="btn" onclick="location.href='groups.html'">👥 Groups</button><button class="btn" onclick="location.href='index.html'">⌂ Home</button></header><main class="wrap"><section id="hero" class="card hero"><h1>📢 Group Announcements</h1><p class="muted">Loading group...</p></section><section id="admin" class="card form" style="display:none"><h2>📢 Create Announcement</h2><input id="title" maxlength="160" placeholder="Announcement title"><textarea id="body" maxlength="5000" placeholder="Write an important announcement..."></textarea><button id="publishBtn" class="btn" onclick="createAnnouncement()">Publish Announcement</button> <span id="status" class="muted"></span></section><section class="card"><div class="toolbar"><input id="search" class="search" placeholder="Search announcements..." oninput="renderAnnouncements()"><button class="btn" onclick="loadAnnouncements()">↻ Refresh</button></div><p id="count" class="muted"></p><div id="list"></div></section></main><script src="supabase-client.js"></script><script>let sb,user,groupId,group,rows=[],pm={},channel;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function init(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;groupId=new URLSearchParams(location.search).get('id');user=(await sb.auth.getUser()).data.user||null;if(!groupId){$('hero').innerHTML='<h1>📢 No group selected</h1>';return}await loadGroup();await loadAnnouncements();subscribe()}async function loadGroup(){const r=await sb.from('groups').select('id,name,description,created_by,privacy').eq('id',groupId).maybeSingle();if(r.error||!r.data){$('hero').innerHTML='<h1>Group not found</h1>';return}group=r.data;$('hero').innerHTML='<h1>📢 '+esc(group.name)+'</h1><p>'+esc(group.description||'Community announcements and important updates.')+'</p><div class="muted">'+(group.privacy==='private'?'🔒 Private Group':'🌐 Public Group')+'</div>'+(user&&user.id===group.created_by?'<div class="announce-actions"><button class="btn" onclick="location.href=\'group-admin.html?id='+encodeURIComponent(groupId)+'\'">⚙️ Open Full Admin Panel</button><button class="btn" onclick="location.href=\'group.html?id='+encodeURIComponent(groupId)+'\'">👥 Open Group</button></div>':'');if(user&&user.id===group.created_by)$('admin').style.display='block'}async function loadAnnouncements(){const r=await sb.from('group_announcements').select('id,title,body,created_by,created_at').eq('group_id',groupId).order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<div class="empty">Unable to load announcements.</div>';return}rows=r.data||[];const ids=[...new Set(rows.map(x=>x.created_by))];pm={};if(ids.length){const p=await sb.from('profiles').select('id,display_name').in('id',ids);(p.data||[]).forEach(x=>pm[x.id]=x)}renderAnnouncements()}function renderAnnouncements(){const q=($('search').value||'').toLowerCase().trim(),filtered=rows.filter(x=>(x.title+' '+x.body).toLowerCase().includes(q));$('count').textContent=filtered.length+' announcement'+(filtered.length===1?'':'s');if(!filtered.length){$('list').innerHTML='<div class="empty">📢 No matching announcements.</div>';return}$('list').innerHTML=filtered.map((x,i)=>'<article class="announcement"><span class="pin">'+(i===0&&!q?'LATEST':'ANNOUNCEMENT')+'</span><h3>📌 '+esc(x.title)+'</h3><p style="white-space:pre-wrap;line-height:1.5">'+esc(x.body)+'</p><div class="time">By '+esc(pm[x.created_by]?.display_name||'Group Admin')+' • '+new Date(x.created_at).toLocaleString()+'</div>'+(user&&group&&user.id===group.created_by?'<div class="announce-actions"><button class="btn" onclick="editAnnouncement(\''+x.id+'\')">✏️ Edit</button><button class="btn danger" onclick="deleteAnnouncement(\''+x.id+'\')">🗑️ Delete</button></div>':'')+'</article>').join('')}async function createAnnouncement(){if(!user||!group||user.id!==group.created_by)return;const title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body){$('status').textContent='Title and message are required.';return}const b=$('publishBtn');b.disabled=true;b.textContent='Publishing…';$('status').textContent='';const r=await sb.from('group_announcements').insert({group_id:groupId,created_by:user.id,title,body});b.disabled=false;b.textContent='Publish Announcement';if(r.error){$('status').textContent=r.error.message;return}$('title').value='';$('body').value='';$('status').textContent='Published ✓';await loadAnnouncements()}async function editAnnouncement(id){const x=rows.find(a=>a.id===id);if(!x)return;const title=prompt('Announcement title:',x.title),body=prompt('Announcement message:',x.body);if(title===null||body===null||!title.trim()||!body.trim())return;const r=await sb.from('group_announcements').update({title:title.trim(),body:body.trim()}).eq('id',id).eq('group_id',groupId);if(r.error)alert(r.error.message);else loadAnnouncements()}async function deleteAnnouncement(id){if(!confirm('Delete this announcement?'))return;const r=await sb.from('group_announcements').delete().eq('id',id).eq('group_id',groupId);if(r.error)alert(r.error.message);else loadAnnouncements()}function subscribe(){if(channel)return;channel=sb.channel('trooth-announcements-live-'+groupId).on('postgres_changes',{event:'*',schema:'public',table:'group_announcements',filter:'group_id=eq.'+groupId},()=>loadAnnouncements()).subscribe()}init();</script></body></html>
