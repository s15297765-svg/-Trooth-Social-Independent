<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth News Center</title><style>body{font-family:Arial;margin:0;background:#eef8f1;color:#173b29}header{background:#74c69d;color:white;padding:18px}main{max-width:1050px;margin:auto;padding:18px}.card,.story{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 3px 14px #0001}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #d8e8dc;font:inherit}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0}button{background:#40916c;color:white;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.story{margin:0}.tag{color:#2d6a4f;font-weight:bold}.muted{color:#718276}a{color:#14532d;font-weight:bold;margin-right:10px}</style></head><body><header><b>🌿 Trooth</b> — 📰 News Center</header><main><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="auth.html">Profile</a></nav><section class="card"><h2>Publish News Story</h2><form id="form"><input id="title" placeholder="Headline" required><select id="category"><option>National</option><option>International</option><option>Independent Voices</option><option>Featured Stories</option></select><textarea id="body" placeholder="Write your story..." required></textarea><button>Publish Story</button></form></section><section class="card"><input id="search" placeholder="Search news..."><div id="list" class="grid"></div></section></main><script src="supabase-client.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load()}async function load(){let r=await sb.from('news_stories').select('*').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){let q=search.value.toLowerCase();list.innerHTML=rows.filter(x=>(x.title+' '+x.body+' '+x.category).toLowerCase().includes(q)).map(x=>`<article class="story"><span class="tag">${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small></article>`).join('')||'<p class="muted">No stories yet.</p>'}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');return}let r=await sb.from('news_stories').insert({user_id:user.id,title:title.value.trim(),category:category.value,body:body.value.trim()});if(r.error){alert(r.error.message);return}form.reset();await load()};search.oninput=render;init()</script></body></html>
