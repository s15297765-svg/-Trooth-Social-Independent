<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trooth News Center</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.top{background:#74c69d;color:#fff;padding:18px 5%;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:800}.wrap{max-width:1150px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{background:#fff;padding:9px 13px;border-radius:9px;font-weight:bold;box-shadow:0 2px 8px #245c3a10}.hero,.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #245c3a14}.hero{background:linear-gradient(135deg,#d8f3dc,#fff)}.hero h2{font-size:28px;margin-bottom:8px}.hero p,.muted{color:#667b6d;line-height:1.5}.tools{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;border:1px solid #d8e8dc;border-radius:22px;padding:11px 16px;outline:0}.tabs{display:flex;gap:8px;overflow:auto;margin-top:14px}.tab{border:0;background:#eef8f1;color:#2d6a4f;padding:9px 13px;border-radius:20px;font-weight:bold;white-space:nowrap}.tab.active{background:#40916c;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.story{border:1px solid #e0eee5;border-radius:14px;padding:16px;background:#fbfefc}.tag{display:inline-block;background:#d8f3dc;color:#2d6a4f;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold;margin-bottom:9px}.story h3{font-size:18px;margin-bottom:7px}.story p{color:#667b6d;line-height:1.5;font-size:14px}.meta{font-size:11px;color:#718276;margin:10px 0}.actions{display:flex;gap:8px;margin-top:12px}.btn{background:#40916c;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:bold}.btn.alt{background:#d8f3dc;color:#2d6a4f}.empty{text-align:center;padding:25px;color:#718276}.compose{display:grid;gap:10px}.compose input,.compose textarea,.compose select{border:1px solid #d8e8dc;border-radius:10px;padding:11px;outline:0;background:#fbfefc}.compose textarea{min-height:80px;resize:vertical}@media(max-width:700px){.grid{grid-template-columns:1fr}.top h1{font-size:17px}}</style></head><body><header class="top"><div class="logo">Trooth</div><h1>📰 News Center</h1></header><main class="wrap"><nav class="nav"><a href="index.html">🏠 Home</a><a href="friends.html">👥 Friends</a><a href="business.html">💼 Business</a><a href="auth.html">👤 Profile</a></nav><section class="hero"><h2>Independent News on Trooth</h2><p>National, international and community stories — with space for independent voices and featured stories.</p></section><section class="card"><div class="tools"><input id="search" class="search" placeholder="Search news..." oninput="render()"><button class="btn" onclick="toggleCompose()">✍️ Publish Story</button></div><div class="tabs"><button class="tab active" data-cat="All" onclick="setCat('All',this)">All</button><button class="tab" data-cat="National" onclick="setCat('National',this)">🇵🇰 National</button><button class="tab" data-cat="International" onclick="setCat('International',this)">🌍 International</button><button class="tab" data-cat="Independent Voices" onclick="setCat('Independent Voices',this)">🗣️ Independent Voices</button><button class="tab" data-cat="Featured Stories" onclick="setCat('Featured Stories',this)">⭐ Featured Stories</button></div></section><section id="compose" class="card" style="display:none"><h2>✍️ Publish a Story</h2><form id="storyForm" class="compose" style="margin-top:12px"><input id="title" required placeholder="Story headline"><select id="category"><option>National</option><option>International</option><option>Independent Voices</option><option>Featured Stories</option></select><input id="author" placeholder="Author / Publisher"><textarea id="body" required placeholder="Write your story..."></textarea><button class="btn" type="submit">Publish to News Center</button></form></section><section class="card"><h2>Latest Stories</h2><div id="stories" class="grid" style="margin-top:12px"></div></section></main><script>const key='troothNews',noticeKey='troothNotifications';let current='All';function getNews(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function saveNews(x){localStorage.setItem(key,JSON.stringify(x))}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function seed(){if(getNews().length)return;saveNews([{id:1,title:'Welcome to Trooth News Center',category:'Featured Stories',author:'Trooth Social Independent',body:'A dedicated space for national, international and independent community stories is now part of Trooth.',time:'Just now'},{id:2,title:'Independent Voices Have a Place on Trooth',category:'Independent Voices',author:'Trooth Community',body:'Creators and community members can publish their perspectives and stories through the News Center.',time:'Just now'},{id:3,title:'Pakistan Community News',category:'National',author:'Trooth News',body:'National stories, public affairs and community updates can be organized here.',time:'Just now'},{id:4,title:'Global Stories on Trooth',category:'International',author:'Trooth News',body:'International developments and important global stories can be shared with the community.',time:'Just now'}])}function notify(t){let n=[];try{n=JSON.parse(localStorage.getItem(noticeKey)||'[]')}catch(e){}n.unshift({id:Date.now(),text:t,read:false,time:new Date().toLocaleString()});localStorage.setItem(noticeKey,JSON.stringify(n.slice(0,50)))}function setCat(c,b){current=c;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function toggleCompose(){const x=document.getElementById('compose');x.style.display=x.style.display==='none'?'block':'none'}function render(){const q=(document.getElementById('search').value||'').toLowerCase(),list=getNews().filter(s=>(current==='All'||s.category===current)&&(!q||(s.title+' '+s.body+' '+s.author).toLowerCase().includes(q)));const box=document.getElementById('stories');if(!list.length){box.innerHTML='<div class="empty">No stories found.</div>';return}box.innerHTML=list.map(s=>'<article class="story"><span class="tag">'+esc(s.category)+'</span><h3>'+esc(s.title)+'</h3><div class="meta">By '+esc(s.author||'Trooth Community')+' • '+esc(s.time||'Just now')+'</div><p>'+esc(s.body)+'</p><div class="actions"><button class="btn alt" onclick="shareStory('+s.id+')">↗️ Share</button><button class="btn alt" onclick="likeStory(this)">👍 Like <span>0</span></button></div></article>').join('')}function likeStory(b){const s=b.querySelector('span'),n=Number(s.textContent)||0;b.innerHTML='❤️ Liked <span>'+(n+1)+'</span>'}function shareStory(id){navigator.clipboard?.writeText(location.href+'#story-'+id);alert('Story link copied/shared.')}document.getElementById('storyForm').addEventListener('submit',e=>{e.preventDefault();const list=getNews();const a=author.value.trim()||'Trooth Community';list.unshift({id:Date.now(),title:title.value.trim(),category:category.value,author:a,body:body.value.trim(),time:'Just now'});saveNews(list);notify('New news story published: '+title.value.trim());e.target.reset();document.getElementById('compose').style.display='none';render();alert('Story published successfully!')});seed();render();</script></body></html>
