<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Comments & Interactions</title><style>:root{--g:#74c69d;--d:#2d6a4f;--bg:#eef8f1}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#173b29}.top{background:var(--g);color:#fff;padding:14px 18px;position:sticky;top:0}.top h1{margin:0}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.nav a{background:#fff;color:var(--d);padding:7px 10px;border-radius:18px;text-decoration:none;font-size:12px}.wrap{max-width:850px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 3px 14px #245c3a14}.composer{display:flex;gap:8px}.composer input{flex:1;padding:12px;border:1px solid #cde4d3;border-radius:22px}.btn{border:0;background:var(--d);color:#fff;padding:10px 14px;border-radius:10px;font-weight:bold}.post{border-top:1px solid #e2eee5;padding:14px 0}.post:first-child{border-top:0}.meta{color:#6b7e70;font-size:12px}.text{line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{border:1px solid #cde4d3;background:#f8fcf9;padding:8px 12px;border-radius:9px}.comments{margin-left:18px}.comment{background:#f1f8f3;padding:9px 11px;border-radius:11px;margin:6px 0;font-size:13px}.empty{text-align:center;color:#6b7e70;padding:25px}</style></head><body><header class="top"><h1>🌿 Trooth Social Independent</h1><nav class="nav"><a href="index.html">Home</a><a href="search.html">🔎 Search</a><a href="friends.html">Friends</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="business.html">Business</a><a href="auth.html">Profile</a></nav></header><main class="wrap"><section class="card"><h2>💬 Comments & Interactions</h2><p>یہاں Trooth کی محفوظ شدہ پوسٹس پر Like، Comment اور Share interactions دیکھیں۔</p><div class="composer"><input id="q" placeholder="Search posts..." oninput="render()"><button class="btn" onclick="render()">Search</button></div></section><section class="card"><div id="feed"></div></section></main><script>const pk='troothPosts',uk='troothUser';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function posts(){try{let p=JSON.parse(localStorage.getItem(pk)||'[]');return Array.isArray(p)?p:[]}catch(e){return[]}}function name(){try{return JSON.parse(localStorage.getItem(uk)||'{}').name||'You'}catch(e){return'You'}}function save(p){localStorage.setItem(pk,JSON.stringify(p))}function render(){let q=document.getElementById('q').value.toLowerCase().trim(),p=posts().filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));let f=document.getElementById('feed');if(!p.length){f.innerHTML='<div class="empty">کوئی پوسٹ نہیں ملی۔ Home Feed سے نئی پوسٹ بنائیں۔</div>';return}f.innerHTML=p.map((x,i)=>{let comments=Array.isArray(x.comments)?x.comments:[];return `<article class="post"><b>👤 ${esc(x.author||x.name||name())}</b><div class="meta">${esc(x.time||'Trooth Post')} • 🌐 Public</div><p class="text">${esc(x.text||x.body||x.content||'')}</p><div class="actions"><button onclick="like(${i})">👍 Like ${Number(x.likes||0)}</button><button onclick="addComment(${i})">💬 Comment ${comments.length}</button><button onclick="share(${i})">↗️ Share ${Number(x.shares||0)}</button></div><div class="comments">${comments.map(c=>`<div class="comment"><b>${esc(c.author||'You')}:</b> ${esc(c.text||c)}</div>`).join('')}</div></article>`}).join('')}function like(i){let p=posts();p[i].likes=Number(p[i].likes||0)+1;save(p);render()}function share(i){let p=posts();p[i].shares=Number(p[i].shares||0)+1;save(p);navigator.clipboard?.writeText(location.origin+location.pathname.replace('interactions.html','index.html'));render()}function addComment(i){let v=prompt('اپنا comment لکھیں:');if(!v||!v.trim())return;let p=posts();if(!Array.isArray(p[i].comments))p[i].comments=[];p[i].comments.push({author:name(),text:v.trim(),time:Date.now()});save(p);render()}render();</script></body></html>
