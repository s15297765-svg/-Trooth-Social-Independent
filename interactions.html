<!doctype html><html lang="ur" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Comments & Interactions</title><style>:root{--g:#74c69d;--d:#2d6a4f;--bg:#eef8f1}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#173b29}.top{background:var(--g);color:#fff;padding:15px 5%;position:sticky;top:0;z-index:2}.top h1{margin:0;font-size:22px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.nav a{background:#fff;color:var(--d);padding:7px 10px;border-radius:18px;text-decoration:none;font-size:12px}.wrap{max-width:900px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 3px 14px #245c3a14}.muted{color:#6b7e70}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;padding:12px;border:1px solid #cde4d3;border-radius:22px}.btn{border:0;background:var(--d);color:#fff;padding:10px 14px;border-radius:10px;font-weight:bold;cursor:pointer}.item{border-top:1px solid #e2eee5;padding:15px 0}.item:first-child{border-top:0}.tag{display:inline-block;background:#d8f3dc;color:#2d6a4f;border-radius:15px;padding:4px 8px;font-size:11px;font-weight:bold}.body{line-height:1.5;margin:8px 0}.empty{text-align:center;padding:25px;color:#6b7e70}@media(max-width:600px){.toolbar{flex-direction:column}.toolbar input{min-width:0}.top{padding:13px 4%}}</style></head><body><header class="top"><h1>🌿 Trooth Social Independent</h1><nav class="nav"><a href="index.html">Home</a><a href="search.html">🔎 Search</a><a href="friends.html">Friends</a><a href="notifications-messages.html">🔔 Notifications</a><a href="auth.html">👤 Profile</a></nav></header><main class="wrap"><section class="card"><h2>💬 Comments & Interactions Center</h2><p class="muted">آپ کے Trooth content کے Likes اور Comments یہاں Supabase سے دکھائے جاتے ہیں۔</p><div class="toolbar"><input id="q" placeholder="Search your interactions..." oninput="render()"><button class="btn" onclick="render()">Refresh</button></div></section><section class="card"><div id="status" class="muted">Loading...</div><div id="feed"></div></section></main><script src="supabase-client.js"></script><script>let sb=null,user=null,items=[];const ready=()=>new Promise(r=>{if(window.troothSupabase)r();else window.addEventListener('trooth-supabase-ready',r,{once:true})});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={news:'News',sports:'Sports',business:'Business',property:'Property',stores:'Stores',film_fashion:'Film & Fashion'};async function init(){await ready();sb=window.troothSupabase;const {data:{user:u}}=await sb.auth.getUser();user=u;if(!u){status.textContent='Please login first to view your interactions.';return}await load();render()}async function load(){items=[];const [{data:likes},{data:comments}]=await Promise.all([sb.from('content_likes').select('content_type,content_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('content_comments').select('content_type,content_id,body,created_at').eq('user_id',user.id).order('created_at',{ascending:false})]);const types=[...new Set([...(likes||[]).map(x=>x.content_type),...(comments||[]).map(x=>x.content_type)])];for(const type of types){const table={news:'news_stories',sports:'sports_stories',business:'businesses',property:'properties',stores:'store_listings',film_fashion:'film_fashion_stories'}[type];if(!table)continue;const ids=[...(likes||[]),...(comments||[])].filter(x=>x.content_type===type).map(x=>x.content_id);const {data}=await sb.from(table).select('*').in('id',[...new Set(ids)]);for(const row of data||[]){const l=(likes||[]).find(x=>x.content_type===type&&x.content_id===row.id);const cs=(comments||[]).filter(x=>x.content_type===type&&x.content_id===row.id);items.push({type,row,liked:!!l,comments:cs,last:new Date(l?.created_at||cs[0]?.created_at||row.created_at)})}}items.sort((a,b)=>b.last-a.last);status.textContent=`${items.length} content item${items.length===1?'':'s'} with your interactions.`}function render(){const q=(document.getElementById('q').value||'').toLowerCase().trim();const list=items.filter(x=>JSON.stringify(x.row).toLowerCase().includes(q)||labels[x.type].toLowerCase().includes(q)||x.comments.some(c=>c.body.toLowerCase().includes(q)));feed.innerHTML=list.map(x=>{const title=x.row.title||x.row.name||x.row.location||'Trooth Post';const text=x.row.body||x.row.description||'';return `<article class="item"><span class="tag">${esc(labels[x.type])}</span><h3>${esc(title)}</h3><div class="body">${esc(text)}</div><div>👍 ${x.liked?'You liked this':'Like'} &nbsp; 💬 ${x.comments.length} comment${x.comments.length===1?'':'s'}</div>${x.comments.map(c=>`<div class="body" style="background:#f1f8f3;padding:9px;border-radius:10px"><b>Your comment:</b> ${esc(c.body)}<br><small class="muted">${new Date(c.created_at).toLocaleString()}</small></div>`).join('')}</article>`}).join('')||'<div class="empty">ابھی کوئی interaction نہیں ملی۔ Home یا News/Sports/Business pages سے Like یا Comment کریں۔</div>'}init();</script></body></html>
