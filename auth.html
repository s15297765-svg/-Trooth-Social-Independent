<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trooth — Profile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29;min-height:100vh}.top{background:#74c69d;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800}.home{background:#fff;color:#2d6a4f;border:0;border-radius:9px;padding:9px 14px;font-weight:bold;cursor:pointer}.wrap{width:min(980px,94%);margin:28px auto}.card{background:#fff;border-radius:20px;box-shadow:0 8px 30px #245c3a18;overflow:hidden}.cover{height:145px;background:linear-gradient(135deg,#74c69d,#b7e4c7)}.profileBody{padding:0 30px 30px;position:relative}.avatar{width:105px;height:105px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-size:38px;font-weight:bold;border:6px solid #fff;position:relative;margin-top:-52px}.name{font-size:28px;margin:12px 0 3px}.muted{color:#718276}.stats{display:flex;gap:12px;margin:22px 0}.stat{background:#f1f7f3;border-radius:12px;padding:12px 18px;text-align:center}.stat b{display:block;font-size:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.btn.secondary{background:#d8f3dc;color:#2d6a4f}.edit{display:none;margin-top:20px;padding:20px;background:#f7fbf8;border-radius:14px}.edit input,.edit textarea{width:100%;padding:11px;border:1px solid #d8e9de;border-radius:9px;margin:7px 0 13px;font:inherit}.loginBox{width:min(520px,94%);margin:45px auto}.loginBox .inner{padding:30px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;padding:11px;border:0;border-radius:9px;background:#d8f3dc;color:#2d6a4f;font-weight:bold}.tabs button.active{background:#40916c;color:#fff}label{display:block;font-size:13px;font-weight:bold;margin:11px 0 5px}input{width:100%;padding:12px;border:1px solid #d8e9de;border-radius:10px;outline:none}.loginBtn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.form{display:none}.form.active{display:block}@media(max-width:600px){.profileBody{padding:0 18px 22px}.stats{flex-wrap:wrap}.cover{height:110px}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="home" onclick="location.href='index.html'">🏠 Home Feed</button></header><div id="app"></div><script>const key='troothUser';const getUser=()=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}};const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(){const u=getUser();if(!u){document.getElementById('app').innerHTML='<div class="loginBox card"><div class="inner"><div class="tabs"><button id="lt" class="active" onclick="tab(\'login\')">Login</button><button id="st" onclick="tab(\'signup\')">Create Account</button></div><form id="login" class="form active" onsubmit="login(event)"><h2>Welcome back</h2><label>Email</label><input id="le" type="email" required><label>Password</label><input id="lp" type="password" required><button class="loginBtn">Login to Trooth</button></form><form id="signup" class="form" onsubmit="signup(event)"><h2>Create your profile</h2><label>Full Name</label><input id="sn" required><label>Email</label><input id="se" type="email" required><label>Password</label><input id="sp" type="password" minlength="6" required><button class="loginBtn">Create Account</button></form></div></div>';return}const initial=(u.name||'T')[0].toUpperCase();document.getElementById('app').innerHTML='<main class="wrap"><section class="card"><div class="cover"></div><div class="profileBody"><div class="avatar">'+esc(initial)+'</div><h1 class="name">'+esc(u.name)+'</h1><p class="muted">'+esc(u.email)+'</p><p class="muted">Trooth Member • Independent Social & Business Network</p><div class="stats"><div class="stat"><b id="postCount">0</b><span class="muted">Posts</span></div><div class="stat"><b>0</b><span class="muted">Friends</span></div><div class="stat"><b>0</b><span class="muted">Following</span></div></div><div class="actions"><button class="btn" onclick="toggleEdit()">✏️ Edit Profile</button><button class="btn secondary" onclick="location.href='index.html'">📰 View Feed</button><button class="btn secondary" onclick="logout()">Log out</button></div><div id="edit" class="edit"><h3>Edit Profile</h3><label>Display Name</label><input id="en" value="'+esc(u.name)+'"><label>Bio</label><textarea id="eb" rows="3" placeholder="Tell the Trooth community about yourself...">'+esc(u.bio||'')+'</textarea><button class="btn" onclick="saveProfile()">Save Changes</button></div></div></section></main>';const posts=JSON.parse(localStorage.getItem('troothPosts')||'[]');document.getElementById('postCount').textContent=posts.length}function tab(x){login.classList.toggle('active',x==='login');signup.classList.toggle('active',x==='signup');lt.classList.toggle('active',x==='login');st.classList.toggle('active',x==='signup')}function signup(e){e.preventDefault();const u={name:sn.value.trim(),email:se.value.trim().toLowerCase(),password:sp.value,bio:''};localStorage.setItem(key,JSON.stringify(u));render();alert('Account created successfully!')}function login(e){e.preventDefault();const u=getUser();if(!u||u.email!==le.value.trim().toLowerCase()||u.password!==lp.value){alert('Email or password is incorrect.');return}render()}function toggleEdit(){edit.style.display=edit.style.display==='block'?'none':'block'}function saveProfile(){const u=getUser();u.name=en.value.trim()||u.name;u.bio=eb.value.trim();localStorage.setItem(key,JSON.stringify(u));render();alert('Profile updated successfully!')}function logout(){localStorage.removeItem(key);location.href='index.html'}render()</script></body></html>
