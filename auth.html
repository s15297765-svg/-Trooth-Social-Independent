<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth — Profile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:800}.home,.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}.home{background:#fff;color:#2d6a4f}.wrap{width:min(900px,94%);margin:20px auto}.card{background:#fff;border-radius:18px;box-shadow:0 6px 25px #245c3a18;margin-bottom:18px;padding:20px}.cover{height:220px;border-radius:15px;background:linear-gradient(135deg,#74c69d,#d8f3dc);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px}.avatar{width:125px;height:125px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-size:45px;font-weight:bold;overflow:hidden;border:5px solid #fff;margin-bottom:-62px}.avatar img{width:100%;height:100%;object-fit:cover}.profileHead{padding:72px 5px 10px}.muted{color:#718276}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f1f7f3;padding:11px 18px;border-radius:10px;text-align:center}.tabs{display:flex;gap:7px;overflow:auto;border-bottom:1px solid #e0eee5;padding-bottom:10px;margin-bottom:15px}.tabs button{white-space:nowrap;border:0;background:#f1f7f3;color:#2d6a4f;padding:11px 15px;border-radius:10px;font-weight:bold;cursor:pointer}.tabs button.active{background:#40916c;color:#fff}.panel{display:none}.panel.active{display:block}.post,.notice,.item{padding:14px;border:1px solid #e0eee5;border-radius:12px;margin:9px 0}.mediaBtns{display:flex;gap:8px;flex-wrap:wrap}.mediaBtns label{margin:0;background:#d8f3dc;color:#2d6a4f;padding:9px 12px;border-radius:9px;cursor:pointer}.mediaBtns input{display:none}.editbox{background:#f7fbf8;border:1px solid #e0eee5;padding:14px;border-radius:12px;margin-top:15px}input,textarea{width:100%;padding:12px;border:1px solid #d8e9de;border-radius:9px;font:inherit}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.quick a{background:#f1f7f3;padding:12px;border-radius:11px;text-align:center;font-weight:bold;color:#2d6a4f;text-decoration:none}.status{background:#f1f7f3;border-radius:10px;padding:12px;margin-top:10px}@media(max-width:650px){.quick{grid-template-columns:repeat(2,1fr)}.cover{height:180px}.avatar{width:105px;height:105px}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="home" onclick="location.href='index.html'">🏠 Home Feed</button></header><main class="wrap" id="app"><div class="card">Loading Trooth Profile…</div></main><script src="supabase-client.js"></script><script>let sb,user,profile,cache={posts:[],followers:[],following:[],likes:[],comments:[],shares:[],saved:[],notices:[]},bootTimer;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const app=document.getElementById('app');function setStatus(t){const e=document.getElementById('authMsg');if(e)e.textContent=t}async function waitForSupabase(){if(window.troothSupabase)return window.troothSupabase;return await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(t);resolve(window.troothSupabase||null)};const t=setTimeout(finish,9000);window.addEventListener('trooth-supabase-ready',finish,{once:true})})}async function init(){try{sb=await waitForSupabase();if(!sb){renderLogin('Trooth connection is taking too long. Please refresh and try again.');return}const r=await sb.auth.getUser();if(r.error)throw r.error;user=r.data?.user||null;if(user){await ensureProfile();await loadData();renderProfile()}else renderLogin()}catch(e){console.error('Trooth profile init',e);renderLogin('Profile access needs login. You can log in or create an account below.')}}async function ensureProfile(){const p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.error)throw p.error;if(p.data){profile=p.data;return}const display=user.user_metadata?.display_name||user.phone||'Trooth User';const n=await sb.from('profiles').insert({id:user.id,display_name:display,bio:''}).select().single();if(n.error)throw n.error;profile=n.data}async function loadData(){const [p,f,fo,l,c,sa,n]=await Promise.all([sb.from('posts').select('id,body,created_at,media_url,media_type').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('connections').select('following_id,created_at').eq('follower_id',user.id),sb.from('connections').select('follower_id,created_at').eq('following_id',user.id),sb.from('content_likes').select('content_id,content_type,created_at').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('content_comments').select('id,content_id,content_type,body,created_at').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('saved_content').select('id,content_id,content_type,created_at').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(20)]);const sh=await sb.from('notifications').select('id,body,kind,created_at').eq('actor_id',user.id).ilike('kind','%share%').order('created_at',{ascending:false}).limit(100);cache={posts:p.data||[],followers:f.data||[],following:fo.data||[],likes:l.data||[],comments:c.data||[],shares:sh.data||[],saved:sa.data||[],notices:n.data||[]}}function renderLogin(message){app.innerHTML='<div class="card"><h2>Welcome to Trooth 👋</h2><p class="muted">Login or create your independent Trooth account.</p><button class="btn" onclick="showLogin()">Login / Create Account</button>'+(message?'<div class="status">'+esc(message)+'</div>':'')+'</div>'}function showLogin(){app.innerHTML='<div class="card"><h2>Join Trooth 🌿</h2><p class="muted">نیا پروفائل بنانے کے لیے صرف فون نمبر درکار ہے۔ ای میل کی ضرورت نہیں۔</p><input id="displayName" placeholder="Your name" autocomplete="name"><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Phone number e.g. +923001234567" style="margin-top:10px"><input id="password" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" style="margin-top:10px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="signupBtn" onclick="signup()">Create Account</button><button class="btn" id="loginBtn" onclick="login()">Login</button></div><p id="authMsg" class="muted"></p></div>'}function validPhone(v){return /^\+[1-9]\d{7,14}$/.test(v)}function busy(id,on){const b=document.getElementById(id);if(b)b.disabled=on}async function signup(){const name=document.getElementById('displayName')?.value.trim(),tel=document.getElementById('phone')?.value.trim(),pass=document.getElementById('password')?.value;if(!name||!validPhone(tel)||pass.length<6){setStatus('براہِ کرم نام، درست فون نمبر (مثلاً +923001234567) اور کم از کم 6 حروف/اعداد کا پاس ورڈ دیں۔');return}busy('signupBtn',true);setStatus('Account بنایا جا رہا ہے…');try{const r=await sb.auth.signUp({phone:tel,password:pass,options:{data:{display_name:name}}});if(r.error)throw r.error;if(r.data.user&&!r.data.session){sessionStorage.setItem('trooth_pending_phone',tel);sessionStorage.setItem('trooth_pending_name',name);location.href='phone-verify.html';return}if(r.data.user){user=r.data.user;await ensureProfile();await loadData();renderProfile()}}catch(e){setStatus(e?.message||'Account create نہیں ہو سکا۔ دوبارہ کوشش کریں۔')}finally{busy('signupBtn',false)}}async function login(){const tel=document.getElementById('phone')?.value.trim(),pass=document.getElementById('password')?.value;if(!validPhone(tel)||!pass){setStatus('فون نمبر اور پاس ورڈ درج کریں۔');return}busy('loginBtn',true);setStatus('Login ہو رہا ہے…');try{const r=await sb.auth.signInWithPassword({phone:tel,password:pass});if(r.error)throw r.error;user=r.data.user;await ensureProfile();await loadData();renderProfile()}catch(e){setStatus(e?.message||'Login نہیں ہو سکا۔ فون نمبر اور پاس ورڈ چیک کریں۔')}finally{busy('loginBtn',false)}}function renderProfile(){const p=profile||{},initial=esc((p.display_name||'T')[0].toUpperCase());app.innerHTML=`<div class="card"><div class="cover" style="${p.cover_url?`background-image:url('${esc(p.cover_url)}')`:''}"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="Profile photo">`:initial}</div></div><div class="profileHead"><h1>${esc(p.display_name||'Trooth User')}</h1><p class="muted">${esc(p.bio||'Trooth Member • Independent Social & Business Network')}</p><div class="stats"><div class="stat"><b>${cache.posts.length}</b><br>Posts</div><div class="stat"><b>${cache.followers.length}</b><br>Followers</div><div class="stat"><b>${cache.following.length}</b><br>Following</div><div class="stat"><b>${cache.likes.length}</b><br>Likes</div></div></div><div class="mediaBtns"><label>📷 Profile Photo<input type="file" accept="image/*" onchange="uploadMedia('avatar',this.files[0])"></label><label>🖼️ Cover Photo<input type="file" accept="image/*" onchange="uploadMedia('cover',this.files[0])"></label><button class="btn" onclick="editProfile()">✏️ Edit Profile</button><button class="btn" onclick="logout()">Log out</button></div><div class="quick"><a href="friends.html">👥 Friends</a><a href="chat.html">💬 Messages</a><a href="saved.html">🔖 Saved</a><a href="activity.html">📊 Activity</a></div><div id="edit"></div></div><div class="card"><div class="tabs"><button class="active" onclick="tab('posts',this)">📝 Posts</button><button onclick="tab('people',this)">👥 People</button><button onclick="tab('activity',this)">📊 Activity</button><button onclick="tab('notifications',this)">🔔 Notifications</button></div><section id="posts" class="panel active">${postsHTML()}</section><section id="people" class="panel"><div class="peopleWrap" data-trooth-profile-people><p class="muted">Loading friends, followers and following…</p></div></section><section id="activity" class="panel">${activityHTML()}</section><section id="notifications" class="panel">${noticesHTML()}</section></div>`}function renderPeople(){const el=document.querySelector('[data-trooth-profile-people]');if(!el)return;const ids=[...new Set([...cache.followers.map(x=>x.follower_id),...cache.following.map(x=>x.following_id)])];if(!ids.length){el.innerHTML='<p class="muted">No friends, followers or following yet. Visit Friends to discover people.</p><a class="btn" href="friends.html" style="display:inline-block;text-decoration:none;background:#40916c;color:#fff">👥 Open Friends</a>';return}sb.from('profiles').select('id,display_name,bio,avatar_url').in('id',ids).then(({data,error})=>{if(error){el.innerHTML='<p class="muted">Unable to load people right now.</p>';return}const followers=new Set(cache.followers.map(x=>x.follower_id)),following=new Set(cache.following.map(x=>x.following_id));el.innerHTML='<div class="stats"><div class="stat"><b>'+cache.followers.length+'</b><br>Followers</div><div class="stat"><b>'+cache.following.length+'</b><br>Following</div></div>'+data.map(x=>{const role=followers.has(x.id)&&following.has(x.id)?'Friend / Mutual Follow':followers.has(x.id)?'Follower':'Following';return '<div class="item" style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:48px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:bold;overflow:hidden">'+(x.avatar_url?'<img src="'+esc(x.avatar_url)+'" style="width:100%;height:100%;object-fit:cover">':esc((x.display_name||'T')[0].toUpperCase()))+'</div><div><b>'+esc(x.display_name||'Trooth User')+'</b><br><small class="muted">'+esc(role)+'</small></div></div>'}).join('')+'<a class="btn" href="friends.html" style="display:inline-block;text-decoration:none;background:#40916c;color:#fff;margin-top:8px">👥 Manage Friends</a>'}).catch(()=>{el.innerHTML='<p class="muted">Unable to load people right now.</p>'})}function tab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(btn)btn.classList.add('active');if(id==='people')renderPeople()}function postsHTML(){return cache.posts.length?cache.posts.map(x=>'<div class="post"><b>📝 '+esc(profile.display_name)+'</b><p>'+esc(x.body||'')+'</p>'+(x.media_url?(x.media_type&&x.media_type.startsWith('video')?'<video src="'+esc(x.media_url)+'" controls style="max-width:100%;border-radius:10px"></video>':'<img src="'+esc(x.media_url)+'" style="max-width:100%;border-radius:10px">'):'')+'<br><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join(''):'<p class="muted">No posts yet. Go to Home Feed and share your first post.</p>'}function activityHTML(){const a=[...cache.likes.map(x=>({d:x.created_at,t:'👍 You liked '+(x.content_type||'content')})),...cache.comments.map(x=>({d:x.created_at,t:'💬 You commented on '+(x.content_type||'content')})),...cache.shares.map(x=>({d:x.created_at,t:'↗ You shared content'})),...cache.saved.map(x=>({d:x.created_at,t:'🔖 You saved '+(x.content_type||'content')}))].sort((a,b)=>new Date(b.d)-new Date(a.d));return a.length?a.slice(0,40).map(x=>'<div class="item">'+x.t+'<br><small class="muted">'+new Date(x.d).toLocaleString()+'</small></div>').join(''):'<p class="muted">No activity yet.</p>'}function noticesHTML(){return cache.notices.length?cache.notices.map(x=>'<div class="notice '+(!x.is_read?'unread':'')+'">🔔 '+esc(x.body||'Notification')+'<br><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join(''):'<p class="muted">No notifications yet.</p>'}function editProfile(){document.getElementById('edit').innerHTML='<div class="editbox"><h3>Edit Profile</h3><input id="editName" value="'+esc(profile.display_name||'')+'" placeholder="Display name"><textarea id="editBio" rows="3" style="margin-top:10px" placeholder="Bio">'+esc(profile.bio||'')+'</textarea><button class="btn" onclick="saveProfile()">Save Profile</button></div>'}async function saveProfile(){const r=await sb.from('profiles').update({display_name:editName.value.trim()||profile.display_name,bio:editBio.value.trim(),updated_at:new Date().toISOString()}).eq('id',user.id);if(r.error)return alert(r.error.message);profile.display_name=editName.value.trim()||profile.display_name;profile.bio=editBio.value.trim();window.dispatchEvent(new CustomEvent('trooth-profile-updated',{detail:{profile}}));renderProfile()}function publicUrl(path){return sb.storage.from('profile-media').getPublicUrl(path).data.publicUrl}async function uploadMedia(kind,file){if(!file||!user)return;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/'+kind+'-'+Date.now()+'.'+ext,r=await sb.storage.from('profile-media').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(r.error)return alert(r.error.message);const url=publicUrl(path),field=kind==='avatar'?'avatar_url':'cover_url',u=await sb.from('profiles').update({[field]:url,updated_at:new Date().toISOString()}).eq('id',user.id);if(u.error)return alert(u.error.message);profile[field]=url;window.dispatchEvent(new CustomEvent('trooth-profile-updated',{detail:{profile}}));renderProfile()}async function logout(){await sb.auth.signOut();location.href='index.html'}init();</script></body></html>
