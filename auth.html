<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trooth — Login & Profile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29;min-height:100vh;display:grid;place-items:center}.wrap{width:min(920px,94%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 35px #245c3a22}.brand{background:#74c69d;color:#fff;padding:48px}.brand h1{font-size:42px;margin:0 0 12px}.brand p{line-height:1.6}.box{padding:38px}.box h2{margin-top:0}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;padding:11px;border:0;border-radius:9px;background:#d8f3dc;color:#2d6a4f;font-weight:bold}.tabs button.active{background:#40916c;color:#fff}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #d8e9de;border-radius:10px;outline:none}.btn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.profile{display:none}.avatar{width:82px;height:82px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:bold;margin-bottom:12px}.profile p{color:#667b6d}.link{display:block;text-align:center;margin-top:15px;color:#2d6a4f;text-decoration:none}@media(max-width:700px){.wrap{grid-template-columns:1fr}.brand{padding:28px}.brand h1{font-size:32px}.box{padding:25px}}</style></head><body><div class="wrap"><section class="brand"><h1>Trooth</h1><p><b>Social • Independent • Business</b></p><p>Join Trooth Social Independent and build your profile, connect with people, share posts and discover communities.</p><p>💚 Light, simple and community-focused.</p></section><section class="box"><div id="auth"><div class="tabs"><button id="loginTab" class="active" onclick="show('login')">Login</button><button id="signupTab" onclick="show('signup')">Create Account</button></div><form id="login" onsubmit="login(event)"><h2>Welcome back</h2><label>Email</label><input id="lemail" type="email" required placeholder="you@example.com"><label>Password</label><input id="lpass" type="password" required placeholder="••••••••"><button class="btn">Login to Trooth</button></form><form id="signup" style="display:none" onsubmit="signup(event)"><h2>Create your profile</h2><label>Full Name</label><input id="sname" required placeholder="Your name"><label>Email</label><input id="semail" type="email" required placeholder="you@example.com"><label>Password</label><input id="spass" type="password" minlength="6" required placeholder="Minimum 6 characters"><button class="btn">Create Account</button></form></div><div id="profile" class="profile"><div class="avatar" id="avatar">T</div><h2 id="pname">Your Profile</h2><p id="pemail"></p><p>🎉 Your Trooth profile is ready on this device.</p><button class="btn" onclick="location.href='index.html'">Go to Trooth Home</button><button class="btn" onclick="logout()" style="background:#2d6a4f">Log out</button></div></section></div><script>const key='troothUser';function show(x){login.style.display=x==='login'?'block':'none';signup.style.display=x==='signup'?'block':'none';loginTab.classList.toggle('active',x==='login');signupTab.classList.toggle('active',x==='signup')}function signup(e){e.preventDefault();const u={name:sname.value.trim(),email:semail.value.trim(),password:spass.value};localStorage.setItem(key,JSON.stringify(u));render(u);alert('Account created successfully on this device!')}function login(e){e.preventDefault();const u=JSON.parse(localStorage.getItem(key)||'null');if(!u||u.email!==lemail.value||u.password!==lpass.value){alert('No matching local account found. Please create an account first.');return}render(u)}function render(u){auth.style.display='none';profile.style.display='block';pname.textContent=u.name;pemail.textContent=u.email;avatar.textContent=(u.name[0]||'T').toUpperCase()}function logout(){localStorage.removeItem(key);location.reload()}const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)render(saved)</script></body></html>
