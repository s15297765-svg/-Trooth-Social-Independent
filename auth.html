<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth — Account</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.home,.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}.home{background:#fff;color:#2d6a4f}.wrap{width:min(850px,94%);margin:28px auto}.card{background:#fff;border-radius:18px;box-shadow:0 6px 25px #245c3a18;margin-bottom:18px;padding:25px}.tabs{display:flex;gap:8px}.tabs button{flex:1;border:0;padding:11px;border-radius:9px;background:#d8f3dc;color:#2d6a4f;font-weight:bold}.tabs .on,.btn{background:#40916c;color:#fff}.form{display:none}.form.on{display:block}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #d8e9de;border-radius:9px;font:inherit}.btn{margin-top:15px}.profile{display:grid;gap:12px}.cover{height:180px;border-radius:15px;background:linear-gradient(135deg,#74c69d,#d8f3dc);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px}.avatar{width:110px;height:110px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-size:40px;font-weight:bold;overflow:hidden;border:5px solid #fff;margin-bottom:-55px}.avatar img{width:100%;height:100%;object-fit:cover}.profileHead{padding-top:60px}.muted{color:#718276}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f1f7f3;padding:12px 18px;border-radius:10px}.post{padding:14px;border:1px solid #e0eee5;border-radius:12px;margin:9px 0}.notice{padding:12px;background:#f1f7f3;border-radius:10px;margin:8px 0}.notice.unread{background:#d8f3dc}.mediaBtns{display:flex;gap:8px;flex-wrap:wrap}.mediaBtns label{margin:0;background:#d8f3dc;color:#2d6a4f;padding:9px 12px;border-radius:9px;cursor:pointer}.mediaBtns input{display:none}.editbox{background:#f7fbf8;border:1px solid #e0eee5;padding:14px;border-radius:12px;margin-top:15px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.quick a{background:#f1f7f3;padding:13px;border-radius:12px;text-align:center;font-weight:bold;color:#2d6a4f}@media(max-width:600px){.quick{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="home" onclick="location.href='index.html'">🏠 Home Feed</button></header><main class="wrap" id="app"><div class="card"><div class="tabs"><button id="loginTab" class="on" onclick="showTab('login')">Login</button><button id="signupTab" onclick="showTab('signup')">Create Account</button></div><form id="loginForm" class="form on" onsubmit="login(event)"><h2>Welcome back 👋</h2><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn">Login to Trooth</button></form><form id="signupForm" class="form" onsubmit="signup(event)"><h2>Create your Trooth account 🚀</h2><label>Full Name</label><input id="name" required><label>Email</label><input id="newEmail" type="email" required><label>Password</label><input id="newPassword" type="password" minlength="6" required><button class="btn">Create Account</button></form></div></main><script src="supabase-client.js"></script><script>let sb,user,profile;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user||null;if(user){await ensureProfile();renderProfile()}}async function ensureProfile(){const p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(p.data){profile=p.data;return}const display=user.user_metadata?.display_name||user.email.split('@')[0];const n=await sb.from('profiles').insert({id:user.id,display_name:display,bio:''}).select().single();profile=n.data}function showTab(x){loginForm.classList.toggle('on',x==='login');signupForm.classList.toggle('on',x==='signup');loginTab.classList.toggle('on',x==='login');signupTab.classList.toggle('on',x==='signup')}async function signup(e){e.preventDefault();const r=await sb.auth.signUp({email:newEmail.value.trim(),password:newPassword.value,options:{data:{display_name:name.value.trim()}}});if(r.error){alert(r.error.message);return}if(r.data.user){user=r.data.user;if(r.data.session){await ensureProfile();renderProfile();alert('Account created successfully!')}else alert('Account created. Please confirm your email, then login.')}}async function login(e){e.preventDefault();const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){alert(r.error.message);return}user=r.data.user;await ensureProfile();renderProfile()}function publicUrl(path){return sb.storage.from('profile-media').getPublicUrl(path).data.publicUrl}async function uploadMedia(kind,file){if(!file||!user)return;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=user.id+'/'+kind+'-'+Date.now()+'.'+ext;const r=await sb.storage.from('profile-media').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(r.error){alert(r.error.message);return}const url=publicUrl(path),field=kind==='avatar'?'avatar_url':'cover_url';const u=await sb.from('profiles').update({[field]:url,updated_at:new Date().toISOString()}).eq('id',user.id);if(u.error){alert(u.error.message);return}profile[field]=url;renderProfile()}async function renderProfile(){const p=profile||{},posts=await sb.from('posts').select('id,body,created_at').eq('user_id',user.id).order('created_at',{ascending:false}),following=await sb.from('connections').select('following_id',{count:'exact',head:true}).eq('follower_id',user.id),followers=await sb.from('connections').select('follower_id',{count:'exact',head:true}).eq('following_id',user.id),notices=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(10);const initial=esc((p.display_name||'T')[0].toUpperCase());app.innerHTML='<div class="card"><div class="cover" style="'+(p.cover_url?'background-image:url(\''+esc(p.cover_url)+'\')':'')+'"><div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="Profile photo">':initial)+'</div></div><div class="profileHead"><h1>'+esc(p.display_name||'Trooth User')+'</h1><p class="muted">'+esc(user.email||'')+'</p><p class="muted">'+esc(p.bio||'Trooth Member • Independent Social & Business Network')+'</p></div><div class="mediaBtns"><label>📷 Profile Photo<input type="file" accept="image/*" onchange="uploadMedia(\'avatar\',this.files[0])"></label><label>🖼️ Cover Photo<input type="file" accept="image/*" onchange="uploadMedia(\'cover\',this.files[0])"></label></div><div class="stats"><div class="stat"><b>'+(posts.data?.length||0)+'</b><br>Posts</div><div class="stat"><b>'+(followers.count||0)+'</b><br>Followers</div><div class="stat"><b>'+(following.count||0)+'</b><br>Following</div></div><button class="btn" onclick="editProfile()">✏️ Edit Profile</button> <button class="btn" onclick="logout()">Log out</button><div class="quick"><a href="friends.html">👥 Friends</a><a href="business.html">💼 Business</a><a href="notifications-messages.html">💬 Messages</a></div><div id="edit"></div></div><div class="card"><h2>📝 My Posts</h2>'+(posts.data?.length?posts.data.map(x=>'<div class="post">'+esc(x.body)+'<br><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join(''):'<p class="muted">No posts yet.</p>')+'</div><div class="card"><h2>🔔 Notifications</h2>'+(notices.data?.length?notices.data.map(x=>'<div class="notice '+(!x.is_read?'unread':'')+'">'+esc(x.body)+'<br><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join(''):'<p class="muted">No notifications yet.</p>')+'</div>'}function editProfile(){edit.innerHTML='<div class="editbox"><h3>Edit Profile</h3><label>Display Name</label><input id="editName" value="'+esc(profile.display_name||'')+'"><label>Bio</label><textarea id="editBio" rows="3">'+esc(profile.bio||'')+'</textarea><button class="btn" onclick="saveProfile()">Save Profile</button></div>'}async function saveProfile(){const r=await sb.from('profiles').update({display_name:editName.value.trim()||profile.display_name,bio:editBio.value.trim(),updated_at:new Date().toISOString()}).eq('id',user.id);if(r.error){alert(r.error.message);return}profile.display_name=editName.value.trim()||profile.display_name;profile.bio=editBio.value.trim();renderProfile()}async function logout(){await sb.auth.signOut();location.href='index.html'}init();</script></body></html>
