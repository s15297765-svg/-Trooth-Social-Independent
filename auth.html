<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trooth — Profile & Notifications</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29;min-height:100vh}.top{background:#74c69d;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800}.home{background:#fff;color:#2d6a4f;border:0;border-radius:9px;padding:9px 14px;font-weight:bold;cursor:pointer}.wrap{width:min(980px,94%);margin:28px auto}.card{background:#fff;border-radius:20px;box-shadow:0 8px 30px #245c3a18;overflow:hidden;margin-bottom:18px}.cover{height:145px;background:linear-gradient(135deg,#74c69d,#b7e4c7)}.profileBody{padding:0 30px 30px;position:relative}.avatar{width:105px;height:105px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-size:38px;font-weight:bold;border:6px solid #fff;position:relative;margin-top:-52px}.name{font-size:28px;margin:12px 0 3px}.muted{color:#718276}.stats{display:flex;gap:12px;margin:22px 0}.stat{background:#f1f7f3;border-radius:12px;padding:12px 18px;text-align:center}.stat b{display:block;font-size:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.btn.secondary{background:#d8f3dc;color:#2d6a4f}.edit{display:none;margin-top:20px;padding:20px;background:#f7fbf8;border-radius:14px}.edit input,.edit textarea{width:100%;padding:11px;border:1px solid #d8e9de;border-radius:9px;margin:7px 0 13px;font:inherit}.myposts{margin-top:20px}.mypost{padding:16px;border:1px solid #e0eee5;border-radius:13px;margin:10px 0;background:#fbfefc}.myposthead{display:flex;gap:9px;align-items:center}.miniavatar{width:38px;height:38px;border-radius:50%;background:#74c69d;color:#fff;display:grid;place-items:center;font-weight:bold}.mypost p{line-height:1.55;margin:10px 0 4px}.panel{padding:22px}.panel h2{margin-top:0}.notice{padding:13px;border-radius:12px;background:#f1f7f3;margin:9px 0;border-left:4px solid #74c69d}.notice.unread{background:#d8f3dc}.notice b{display:block;margin-bottom:4px}.msg{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e3eee6}.msg:last-child{border-bottom:0}.msgavatar{width:42px;height:42px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:bold}.loginBox{width:min(520px,94%);margin:45px auto}.loginBox .inner{padding:30px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;padding:11px;border:0;border-radius:9px;background:#d8f3dc;color:#2d6a4f;font-weight:bold}.tabs button.active{background:#40916c;color:#fff}.form{display:none}.form.active{display:block}label{display:block;font-size:13px;font-weight:bold;margin:11px 0 5px}input{width:100%;padding:12px;border:1px solid #d8e9de;border-radius:10px;outline:none}.loginBtn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}@media(max-width:600px){.profileBody{padding:0 18px 22px}.stats{flex-wrap:wrap}.cover{height:110px}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="home" onclick="location.href='index.html'">🏠 Home Feed</button></header><div id="app"></div><script>const key='troothUser',postsKey='troothPosts',connKey='troothConnections',notifKey='troothNotifications',msgKey='troothMessages';const getUser=()=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}};const getPosts=()=>{try{return JSON.parse(localStorage.getItem(postsKey)||'[]')}catch(e){return[]}};const getConn=()=>{try{return JSON.parse(localStorage.getItem(connKey)||'{"friends":[],"following":[]}')}catch(e){return{friends:[],following:[]}}};const getNotifs=()=>{try{return JSON.parse(localStorage.getItem(notifKey)||'[]')}catch(e){return[]}};const getMsgs=()=>{try{return JSON.parse(localStorage.getItem(msgKey)||'[]')}catch(e){return[]}};const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function seed(){if(!localStorage.getItem(notifKey))localStorage.setItem(notifKey,JSON.stringify([{id:'welcome',title:'Welcome to Trooth!',text:'Your Trooth community is ready.',read:false,time:'Just now'},{id:'community',title:'Community',text:'Connect with creators, businesses and independent voices.',read:false,time:'Today'}]));if(!localStorage.getItem(msgKey))localStorage.setItem(msgKey,JSON.stringify([{from:'Trooth Team',initial:'T',text:'Welcome! Your messages area is connected to your local Trooth account.',time:'Just now'}]))}function render(){const u=getUser();if(!u){document.getElementById('app').innerHTML='<div class="loginBox card"><div class="inner"><div class="tabs"><button id="lt" class="active" onclick="tab(\'login\')">Login</button><button id="st" onclick="tab(\'signup\')">Create Account</button></div><form id="login" class="form active" onsubmit="login(event)"><h2>Welcome back</h2><label>Email</label><input id="le" type="email" required><label>Password</label><input id="lp" type="password" required><button class="loginBtn">Login to Trooth</button></form><form id="signup" class="form" onsubmit="signup(event)"><h2>Create your profile</h2><label>Full Name</label><input id="sn" required><label>Email</label><input id="se" type="email" required><label>Password</label><input id="sp" type="password" minlength="6" required><button class="loginBtn">Create Account</button></form></div></div>';return}seed();const initial=(u.name||'T')[0].toUpperCase(),posts=getPosts(),mine=posts.filter(p=>p.author===u.name),c=getConn(),notifs=getNotifs(),msgs=getMsgs();document.getElementById('app').innerHTML='<main class="wrap"><section class="card"><div class="cover"></div><div class="profileBody"><div class="avatar">'+esc(initial)+'</div><h1 class="name">'+esc(u.name)+'</h1><p class="muted">'+esc(u.email)+'</p><p class="muted">'+esc(u.bio||'Trooth Member • Independent Social & Business Network')+'</p><div class="stats"><div class="stat"><b>'+mine.length+'</b><span class="muted">Posts</span></div><div class="stat"><b>'+c.friends.length+'</b><span class="muted">Friends</span></div><div class="stat"><b>'+c.following.length+'</b><span class="muted">Following</span></div></div><div class="actions"><button class="btn" onclick="toggleEdit()">✏️ Edit Profile</button><button class="btn secondary" onclick="location.href='friends.html'">👥 Friends</button><button class="btn secondary" onclick="location.href='index.html'">📰 View Feed</button><button class="btn secondary" onclick="logout()">Log out</button></div><div id="edit" class="edit"><h3>Edit Profile</h3><label>Display Name</label><input id="en" value="'+esc(u.name)+'"><label>Bio</label><textarea id="eb" rows="3">'+esc(u.bio||'')+'</textarea><button class="btn" onclick="saveProfile()">Save Changes</button></div><div class="myposts"><h2>📝 My Posts</h2>'+(mine.length?mine.slice().reverse().map(p=>'<article class="mypost"><div class="myposthead"><div class="miniavatar">'+esc(p.initial||initial)+'</div><div><b>'+esc(p.author)+'</b><br><small class="muted">'+esc(p.time||'Just now')+' • 🌐 Public</small></div></div><p>'+esc(p.text)+'</p></article>').join(''):'<p class="muted" style="margin-top:10px">Your published posts will appear here.</p>')+'</div></div></section><section class="card panel"><h2>🔔 Notifications <span style="font-size:12px;color:#40916c">'+notifs.filter(n=>!n.read).length+' unread</span></h2><div id="notifications">'+(notifs.length?notifs.map(n=>'<div class="notice '+(!n.read?'unread':'')+'"><b>'+esc(n.title)+'</b><span>'+esc(n.text)+'</span><br><small class="muted">'+esc(n.time||'Now')+'</small></div>').join(''):'<p class="muted">No notifications yet.</p>')+'</div><br><button class="btn secondary" onclick="markRead()">✓ Mark all as read</button></section><section class="card panel"><h2>💬 Messages</h2><div>'+msgs.map(m=>'<div class="msg"><div class="msgavatar">'+esc(m.initial||'T')+'</div><div><b>'+esc(m.from||'Trooth Member')+'</b><p style="margin:4px 0">'+esc(m.text)+'</p><small class="muted">'+esc(m.time||'Now')+'</small></div></div>').join('')+'</div><br><button class="btn" onclick="newMessage()">✉️ New Message</button></section></main>'}function markRead(){const n=getNotifs().map(x=>({...x,read:true}));localStorage.setItem(notifKey,JSON.stringify(n));render()}function newMessage(){const v=prompt('Write a message:');if(v&&v.trim()){const m=getMsgs();m.push({from:getUser().name,initial:(getUser().name||'T')[0].toUpperCase(),text:v.trim(),time:'Just now'});localStorage.setItem(msgKey,JSON.stringify(m));render()}}function tab(x){login.classList.toggle('active',x==='login');signup.classList.toggle('active',x==='signup');lt.classList.toggle('active',x==='login');st.classList.toggle('active',x==='signup')}function signup(e){e.preventDefault();const u={name:sn.value.trim(),email:se.value.trim().toLowerCase(),password:sp.value,bio:''};localStorage.setItem(key,JSON.stringify(u));render();alert('Account created successfully!')}function login(e){e.preventDefault();const u=getUser();if(!u||u.email!==le.value.trim().toLowerCase()||u.password!==lp.value){alert('Email or password is incorrect.');return}render()}function toggleEdit(){edit.style.display=edit.style.display==='block'?'none':'block'}function saveProfile(){const u=getUser();u.name=en.value.trim()||u.name;u.bio=eb.value.trim();localStorage.setItem(key,JSON.stringify(u));render();alert('Profile updated successfully!')}function logout(){localStorage.removeItem(key);location.href='index.html'}render()</script></body></html>
