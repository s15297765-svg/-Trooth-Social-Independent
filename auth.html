<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trooth — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0fdf4;color:#173b29;min-height:100vh;display:grid;place-items:center}
.wrap{width:min(460px,94%)}.brand{text-align:center;margin-bottom:16px}.brand h1{margin:0;color:#15803d;font-size:38px}.brand p{margin:6px 0;color:#718276}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #16653418}
h2{margin:0 0 8px}.muted{color:#718276}input{width:100%;padding:13px;border:1px solid #cfe8d5;border-radius:10px;font:inherit;margin-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.btn{border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;background:#15803d;color:#fff}.btn.alt{background:#dcfce7;color:#166534}.btn:disabled{opacity:.6;cursor:not-allowed}
.status{margin-top:13px;padding:11px;border-radius:10px;background:#f1f7f3;line-height:1.45;min-height:20px}.home{display:block;text-align:center;margin-top:14px;color:#166534;text-decoration:none;font-weight:bold}
@media(max-width:430px){.actions{grid-template-columns:1fr}.brand h1{font-size:32px}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand"><h1>Trooth</h1><p>Social Independent • Connect • Build • Grow</p></div>
<section class="card">
<h2>Welcome to Trooth 👋</h2>
<p class="muted">اپنا نام، ای میل اور پاس ورڈ استعمال کریں۔</p>
<input id="displayName" placeholder="Your name (for new account)" autocomplete="name">
<input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Email address">
<input id="password" type="password" autocomplete="current-password" placeholder="Password (6+ characters)">
<div class="actions">
<button class="btn" id="loginBtn" onclick="login()">Login</button>
<button class="btn alt" id="signupBtn" onclick="signup()">Create Account</button>
</div>
<button class="btn alt" id="resendBtn" onclick="resendConfirmation()" style="width:100%;margin-top:9px">Resend confirmation email</button>
<div id="authMsg" class="status"></div>
<a class="home" href="index.html">🏠 Back to Home Feed</a>
</section>
</main>
<script src="supabase-client.js"></script>
<script>
let sb=null;
const $=id=>document.getElementById(id);
function msg(t){$('authMsg').textContent=t||''}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}
function busy(id,on){const b=$(id);if(b)b.disabled=on}
async function ready(){
 if(window.troothSupabase)return window.troothSupabase;
 return await new Promise((resolve,reject)=>{
  let done=false;
  const finish=(v,e)=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('trooth-supabase-ready',on);e?reject(e):resolve(v)};
  const on=()=>window.troothSupabase?finish(window.troothSupabase):finish(null,new Error('Trooth services are unavailable. Please refresh.'));
  const timer=setTimeout(()=>finish(null,new Error('Trooth services took too long to start. Please refresh.')),10000);
  window.addEventListener('trooth-supabase-ready',on,{once:true});
 });
}
async function start(){try{sb=await ready();const r=await sb.auth.getUser();if(r.data?.user)location.href='profile.html';}catch(e){msg(e.message)}}
async function login(){
 const email=$('email').value.trim().toLowerCase(),pass=$('password').value;
 if(!validEmail(email)||!pass){msg('براہِ کرم درست ای میل اور پاس ورڈ درج کریں۔');return}
 busy('loginBtn',true);msg('Login ہو رہا ہے…');
 try{const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error)throw r.error;msg('Login کامیاب ✓');location.href='profile.html';}
 catch(e){msg(e?.message||'Login نہیں ہو سکا۔ اگر confirmation باقی ہے تو نیچے Resend confirmation email دبائیں۔')}
 finally{busy('loginBtn',false)}
}
async function signup(){
 const name=$('displayName').value.trim(),email=$('email').value.trim().toLowerCase(),pass=$('password').value;
 if(!name||!validEmail(email)||pass.length<6){msg('نام، درست ای میل اور کم از کم 6 حروف/اعداد کا پاس ورڈ دیں۔');return}
 busy('signupBtn',true);msg('Account بنایا جا رہا ہے…');
 try{
  const r=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
  if(r.error)throw r.error;
  if(r.data?.session){msg('Account تیار ہے ✓');location.href='profile.html';return}
  msg('Account بن گیا ہے۔ Confirmation email آئے تو اسے confirm کریں، پھر Login کریں۔');
 }catch(e){msg(e?.message||'Account create نہیں ہو سکا۔')}
 finally{busy('signupBtn',false)}
}
async function resendConfirmation(){
 const email=$('email').value.trim().toLowerCase();
 if(!validEmail(email)){msg('پہلے اپنی درست ای میل درج کریں۔');return}
 busy('resendBtn',true);msg('Confirmation email بھیجی جا رہی ہے…');
 try{const r=await sb.auth.resend({type:'signup',email});if(r.error)throw r.error;msg('Confirmation email دوبارہ بھیج دی گئی ہے۔ Inbox/Spam چیک کریں۔')}
 catch(e){msg(e?.message||'Confirmation email نہیں بھیجی جا سکی۔')}
 finally{busy('resendBtn',false)}
}
window.addEventListener('load',start);
</script>
</body></html>
