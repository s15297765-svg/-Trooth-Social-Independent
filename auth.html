<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trooth — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0fdf4;color:#173b29;min-height:100vh;display:grid;place-items:center}
.wrap{width:min(460px,94%)}.brand{text-align:center;margin-bottom:16px}.brand h1{margin:0;color:#15803d;font-size:38px}.brand p{margin:6px 0;color:#718276}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #16653418}
h2{margin:0 0 8px}.muted{color:#718276}input{width:100%;padding:13px;border:1px solid #cfe8d5;border-radius:10px;font:inherit;margin-top:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.btn{border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;background:#15803d;color:#fff}.btn.alt{background:#dcfce7;color:#166534}.btn:disabled{opacity:.6;cursor:not-allowed}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 4px;padding:4px;background:#f1f7f3;border-radius:12px}.mode{border:0;border-radius:9px;padding:9px;background:transparent;color:#537064;font-weight:800;cursor:pointer}.mode.active{background:#fff;color:#15803d;box-shadow:0 2px 7px #16653412}.status{margin-top:13px;padding:11px;border-radius:10px;background:#f1f7f3;line-height:1.45;min-height:20px}.home{display:block;text-align:center;margin-top:14px;color:#166534;text-decoration:none;font-weight:bold}
@media(max-width:430px){.actions{grid-template-columns:1fr}.brand h1{font-size:32px}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand"><h1>Trooth</h1><p>Social Independent • Connect • Build • Grow</p></div>
<section class="card">
<h2 id="authTitle">Log in to Trooth</h2>
<p class="muted" id="authHint">اپنا ای میل/موبائل نمبر اور پاس ورڈ استعمال کریں۔</p>
<input id="displayName" placeholder="Your name" autocomplete="name" hidden>
<input id="identifier" type="text" inputmode="email" autocomplete="username" placeholder="Email or mobile number">
<input id="password" type="password" autocomplete="current-password" placeholder="Password (6+ characters)">
<div class="mode-tabs"><button type="button" id="loginTab" class="mode active" onclick="setMode(false)">Login</button><button type="button" id="signupTab" class="mode" onclick="setMode(true)">Create Account</button></div>
<div class="actions">
<button class="btn" id="loginBtn" onclick="login()">Login</button>
<button class="btn alt" id="signupBtn" onclick="signup()" hidden>Create Account</button>
</div>
<button class="btn alt" id="resendBtn" onclick="resendConfirmation()" style="width:100%;margin-top:9px">Resend confirmation email</button>
<div id="authMsg" class="status"></div>
<a class="home" href="index.html">🏠 Back to Home Feed</a>
</section>
</main>
<script src="supabase-client.js?v=20261008-37"></script>
<script>
let sb=null;
const $=id=>document.getElementById(id);
function msg(t){$('authMsg').textContent=t||''}
function setMode(signup){$('displayName').hidden=!signup;$('loginBtn').hidden=signup;$('signupBtn').hidden=!signup;$('loginTab').classList.toggle('active',!signup);$('signupTab').classList.toggle('active',signup);$('authTitle').textContent=signup?'Create your Trooth account':'Log in to Trooth';$('authHint').textContent=signup?'نام، ای میل/موبائل نمبر اور پاس ورڈ سے نیا اکاؤنٹ بنائیں۔':'اپنا ای میل/موبائل نمبر اور پاس ورڈ استعمال کریں۔';msg('')}

function authErrorText(e,action){const code=e?.code||'',status=e?.status||'';if(code==='invalid_credentials')return 'ای میل/موبائل یا پاس ورڈ درست نہیں۔';if(code==='email_not_confirmed')return 'ای میل ابھی confirm نہیں ہوئی۔ نیچے Resend confirmation email دبائیں۔';if(status===401||/invalid api key|invalid api/i.test(e?.message||''))return 'Supabase API رابطہ مستحکم نہیں۔ تازہ Trooth build استعمال کریں؛ API configuration دوبارہ چیک کی گئی ہے۔';return e?.message||(' '+action+' نہیں ہو سکا۔')}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}
function isEmail(v){return validEmail(v)}
function phoneValue(v){let p=String(v||'').trim().replace(/[\s()-]/g,'');if(/^00\d{8,15}$/.test(p))p='+'+p.slice(2);return p}
function isPhone(v){const p=phoneValue(v);return /^\+?[1-9]\d{7,14}$/.test(p)}
function identifier(v){return isEmail(v)?{email:v.trim().toLowerCase()}:isPhone(v)?{phone:phoneValue(v)}:null}
function busy(id,on){const b=$(id);if(b)b.disabled=on}
async function ready(){
 if(window.troothSupabase)return window.troothSupabase;
 return await new Promise((resolve,reject)=>{
  let done=false;
  const finish=(v,e)=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('trooth-supabase-ready',on);window.removeEventListener('trooth-supabase-error',onError);e?reject(e):resolve(v)};
  const on=()=>window.troothSupabase?finish(window.troothSupabase):finish(null,new Error('Trooth services are unavailable. Please refresh.'));
  const onError=e=>finish(null,e?.detail?.error||new Error('Trooth services could not start. Please refresh.'));
  const timer=setTimeout(()=>finish(null,new Error('Trooth services took too long to start. Please refresh.')),12000);
  window.addEventListener('trooth-supabase-ready',on,{once:true});
  window.addEventListener('trooth-supabase-error',onError,{once:true});
 });
}
async function start(){try{sb=await ready();const r=await sb.auth.getUser();if(r.data?.user){msg('Session موجود ہے ✓');location.href='index.html';return}sb.auth.onAuthStateChange((event,session)=>{if(session?.user&&(event==='SIGNED_IN'||event==='INITIAL_SESSION')){location.href='index.html'}})}catch(e){msg(e.message)}}
async function login(){
 if(!sb){try{sb=await ready()}catch(e){msg('Trooth service ابھی تیار نہیں۔ براہِ کرم دوبارہ کوشش کریں۔');return}}
 const raw=$('identifier').value.trim(),pass=$('password').value,cred=identifier(raw);
 if(!cred||!pass){msg('براہِ کرم درست ای میل/موبائل نمبر اور پاس ورڈ درج کریں۔');return}
 busy('loginBtn',true);msg('Login ہو رہا ہے…');
 try{const r=await sb.auth.signInWithPassword({...cred,password:pass});if(r.error)throw r.error;msg('Login کامیاب ✓');location.href='index.html';}
 catch(e){msg(authErrorText(e,'Login')+' اگر confirmation باقی ہے تو نیچے Resend confirmation email دبائیں۔')}
 finally{busy('loginBtn',false)}
}
function authRedirect(){return location.origin+location.pathname}
async function signup(){
 if(!sb){try{sb=await ready()}catch(e){msg(e.message);return}}
 const name=$('displayName').value.trim(),raw=$('identifier').value.trim(),cred=identifier(raw),pass=$('password').value;
 if(!name||!cred||pass.length<6){msg('نام، درست ای میل/موبائل نمبر اور کم از کم 6 حروف/اعداد کا پاس ورڈ دیں۔');return}
 busy('signupBtn',true);msg('Account بنایا جا رہا ہے…');
 try{
  const r=await sb.auth.signUp({...cred,password:pass,options:{data:{display_name:name},emailRedirectTo:cred.email?authRedirect():undefined}});
  if(r.error)throw r.error;
  if(r.data?.session){msg('Account تیار ہے ✓');location.href='index.html';return}
  msg('Account بن گیا ہے۔ Confirmation email آئے تو اسے confirm کریں، پھر Login کریں۔');
 }catch(e){msg(authErrorText(e,'Account create')+'')}
 finally{busy('signupBtn',false)}
}
async function resendConfirmation(){
 if(!sb){try{sb=await ready()}catch(e){msg(e.message);return}}
 const raw=$('identifier').value.trim(),cred=identifier(raw);
 if(!cred){msg('پہلے درست ای میل یا موبائل نمبر درج کریں۔');return}
 busy('resendBtn',true);msg('Confirmation email بھیجی جا رہی ہے…');
 try{const r=cred.email?await sb.auth.resend({type:'signup',email:cred.email,options:{emailRedirectTo:authRedirect()}}):await sb.auth.resend({type:'sms',phone:cred.phone});if(r.error)throw r.error;msg(cred.email?'Confirmation email دوبارہ بھیج دی گئی ہے۔ Inbox/Spam چیک کریں۔':'SMS confirmation دوبارہ بھیج دی گئی ہے۔')}
 catch(e){msg(authErrorText(e,'Confirmation email'))}
 finally{busy('resendBtn',false)}
}
window.addEventListener('load',()=>{setMode(false);start()});
if(location.hash.includes('error_code=')){try{const p=new URLSearchParams(location.hash.slice(1));msg('Email confirmation response: '+(p.get('error_description')||'Please request a fresh confirmation email.'))}catch(e){}}
</script>
<script>
/* Trooth dream login/session polish */
(function(){
 var st=document.createElement('style');st.textContent='.brand h1{font-size:42px;font-weight:950;letter-spacing:-2px}.brand h1:after{content:"";display:block;width:110px;height:4px;background:#18a957;border-radius:5px;margin:5px auto}.card{border:1px solid #dfeee4;box-shadow:0 8px 28px rgba(20,70,40,.09)}.btn{background:#18a957}.btn.alt{background:#eaf8ef;color:#166534}';document.head.appendChild(st);
})();
</script>
</body></html>
