<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth — Phone Verification</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,92%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 35px #245c3a20;text-align:center}.logo{font-size:34px;font-weight:900;color:#27845b;margin-bottom:6px}.muted{color:#718276;line-height:1.6}input{width:100%;padding:14px;border:1px solid #d8e9de;border-radius:12px;font-size:20px;text-align:center;letter-spacing:5px;margin:15px 0}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#40916c;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}.secondary{background:#d8f3dc;color:#2d6a4f}.msg{min-height:25px;margin-top:14px}.home{display:block;margin-top:15px;color:#2d6a4f;text-decoration:none;font-weight:bold}</style></head><body><main class="card"><div class="logo">Trooth</div><h2>📱 Phone Verification</h2><p class="muted">آپ کے فون پر آنے والا 6 ہندسوں کا verification code درج کریں۔</p><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><button class="btn" onclick="verify()">Verify & Continue</button><button class="btn secondary" onclick="resend()">Resend Code</button><div id="msg" class="msg muted"></div><a class="home" href="auth.html">← واپس Login / Create Account</a></main><script src="supabase-client.js"></script><script>let sb,pendingPhone='';async function init(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;pendingPhone=sessionStorage.getItem('trooth_pending_phone')||'';if(!pendingPhone)msg.textContent='Verification کے لیے پہلے نیا اکاؤنٹ بنائیں۔'}function cleanCode(){return otp.value.replace(/\D/g,'').slice(0,6)}async function verify(){const token=cleanCode();if(!pendingPhone)return msg.textContent='فون نمبر دستیاب نہیں۔ پہلے signup کریں۔';if(token.length!==6)return msg.textContent='6 ہندسوں کا code درج کریں۔';msg.textContent='Verification ہو رہی ہے…';const r=await sb.auth.verifyOtp({phone:pendingPhone,token,type:'sms'});if(r.error){msg.textContent=r.error.message;return}sessionStorage.removeItem('trooth_pending_phone');location.href='profile.html'}async function resend(){if(!pendingPhone)return msg.textContent='پہلے signup کریں۔';msg.textContent='نیا code بھیجا جا رہا ہے…';const r=await sb.auth.signInWithOtp({phone:pendingPhone});msg.textContent=r.error?r.error.message:'نیا verification code SMS کر دیا گیا ہے۔'}otp.addEventListener('input',()=>{otp.value=cleanCode()});init();</script></body></html>
