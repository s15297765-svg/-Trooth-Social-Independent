<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#69c79a"><title>Trooth — Phone Verification</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef8f1,#d8f3dc);color:#173b29;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(440px,96%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 14px 40px #245c3a20;text-align:center;border:1px solid #d9eee1}.logo{font-size:34px;font-weight:900;color:#27845b}.badge{display:inline-block;margin:7px 0 2px;background:#d8f3dc;color:#2d6a4f;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}.muted{color:#718276;line-height:1.6}input{width:100%;padding:14px;border:1px solid #d8e9de;border-radius:12px;font-size:20px;text-align:center;letter-spacing:5px;margin:15px 0;outline:0}input:focus{border-color:#69c79a;box-shadow:0 0 0 3px #e3f8eb}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#40916c;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}.secondary{background:#d8f3dc;color:#2d6a4f}.msg{min-height:25px;margin-top:14px}.home{display:block;margin-top:15px;color:#2d6a4f;text-decoration:none;font-weight:bold}</style></head><body><main class="card"><div class="logo">Trooth</div><span class="badge">SOCIAL • BUSINESS • INDEPENDENT</span><h2>📱 Phone Verification</h2><p id="intro" class="muted">آپ کے فون پر آنے والا 6 ہندسوں کا verification code درج کریں۔</p><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="6 digit verification code"><button class="btn" id="verifyBtn" onclick="verify()">Verify & Continue</button><button class="btn secondary" id="resendBtn" onclick="resend()">Resend Code</button><div id="msg" class="msg muted"></div><a class="home" href="auth.html">← واپس Trooth</a></main><script src="supabase-client.js"></script><script>let sb,pendingPhone='',mode='signup';const msgEl=()=>document.getElementById('msg');async function init(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;pendingPhone=sessionStorage.getItem('trooth_pending_phone')||'';mode=sessionStorage.getItem('trooth_login_mode')==='1'?'login':'signup';document.getElementById('intro').textContent=mode==='login'?'آپ کے فون پر آنے والا 6 ہندسوں کا login code درج کریں۔':'آپ کے فون پر آنے والا 6 ہندسوں کا verification code درج کریں۔';if(!pendingPhone){msgEl().textContent='فون نمبر دستیاب نہیں۔ پہلے Trooth سے Login یا Create Profile شروع کریں۔';busy('verifyBtn',true);busy('resendBtn',true)}}function cleanCode(){return document.getElementById('otp').value.replace(/\D/g,'').slice(0,6)}function busy(id,on){const b=document.getElementById(id);if(b)b.disabled=on}async function verify(){const token=cleanCode();if(!pendingPhone)return msgEl().textContent='فون نمبر دستیاب نہیں۔ واپس Trooth پر جائیں۔';if(token.length!==6)return msgEl().textContent='براہِ کرم 6 ہندسوں کا code درج کریں۔';busy('verifyBtn',true);msgEl().textContent='Verification ہو رہی ہے…';try{const r=await sb.auth.verifyOtp({phone:pendingPhone,token,type:'sms'});if(r.error){msgEl().textContent=r.error.message;busy('verifyBtn',false);return}sessionStorage.removeItem('trooth_pending_phone');sessionStorage.removeItem('trooth_login_mode');sessionStorage.setItem('trooth_verified','1');msgEl().textContent='ماشاءاللہ! فون verify ہوگیا۔ Trooth Profile کھولی جا رہی ہے…';setTimeout(()=>location.href='auth.html',500)}catch(e){msgEl().textContent=e?.message||'Verification failed. دوبارہ کوشش کریں۔'}finally{busy('verifyBtn',false)}}async function resend(){if(!pendingPhone)return msgEl().textContent='پہلے Trooth پر Login یا Create Profile شروع کریں۔';busy('resendBtn',true);msgEl().textContent='نیا code بھیجا جا رہا ہے…';try{const r=await sb.auth.resend({type:'sms',phone:pendingPhone});msgEl().textContent=r.error?r.error.message:'نیا verification code SMS کر دیا گیا ہے۔'}catch(e){msgEl().textContent=e?.message||'SMS resend نہیں ہو سکا۔'}finally{busy('resendBtn',false)}}document.getElementById('otp').addEventListener('input',e=>{e.target.value=cleanCode()});document.getElementById('otp').addEventListener('keydown',e=>{if(e.key==='Enter')verify()});init();</script></body></html>
