<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Stores</title><style>body{font-family:Arial;margin:0;background:#f3fff5;color:#18321f}header{background:#b8f2c2;padding:18px;color:#14532d}main{max-width:1100px;margin:auto;padding:18px}.card,.store{background:white;padding:18px;border:1px solid #cdebd4;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.store{margin:0}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #cdebd4;font:inherit}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0}button{background:#b8f2c2;color:#14532d;font-weight:bold}a{color:#14532d;font-weight:bold;margin-right:10px}.muted{color:#718276}.platform{background:#f8fffa;padding:16px;border:1px solid #cdebd4;border-radius:14px}.platform a{display:inline-block;margin-top:8px}</style></head><body><header>🛍️ <b>Trooth International Stores</b></header><main><nav><a href="index.html">Home</a><a href="business.html">Business</a><a href="auth.html">Profile</a></nav><section class="card"><h2>🌍 Global Platforms</h2><div class="grid"><div class="platform"><h3>Amazon</h3><p>Global online marketplace.</p><a href="https://www.amazon.com/" target="_blank" rel="noopener">Visit Amazon ↗</a></div><div class="platform"><h3>Alibaba</h3><p>Global wholesale and marketplace platform.</p><a href="https://www.alibaba.com/" target="_blank" rel="noopener">Visit Alibaba ↗</a></div><div class="platform"><h3>Shopify</h3><p>Online store and commerce platform.</p><a href="https://www.shopify.com/" target="_blank" rel="noopener">Visit Shopify ↗</a></div></div></section><section class="card"><h2>Add Store / Marketplace Listing</h2><form id="form"><input id="name" placeholder="Store name" required><select id="category"><option>Trooth Marketplace</option><option>Local Business</option><option>Global Platforms</option></select><input id="url" placeholder="Website URL (optional)"><textarea id="description" placeholder="Description" required></textarea><button>Add Store</button></form></section><section class="card"><input id="search" placeholder="Search stores..."><div id="list" class="grid"></div></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load()}async function load(){let r=await sb.from('store_listings').select('*').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){let q=search.value.toLowerCase();list.innerHTML=rows.filter(x=>(x.name+' '+x.category+' '+x.description).toLowerCase().includes(q)).map(x=>`<article class="store" data-id="${x.id}"><h3>🏪 ${esc(x.name)}</h3><b>${esc(x.category)}</b><p>${esc(x.description)}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Visit Store ↗</a>`:''}</article>`).join('')||'<p class="muted">No stores yet.</p>';rows.forEach(x=>{const el=document.querySelector('[data-id="'+x.id+'"]');if(el)TroothInteractions.render(sb,user,'stores',x.id,el)})}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');return}let r=await sb.from('store_listings').insert({user_id:user.id,name:name.value.trim(),category:category.value,url:url.value.trim(),description:description.value.trim()});if(r.error){alert(r.error.message);return}form.reset();await load()};search.oninput=render;init()</script></body></html>
