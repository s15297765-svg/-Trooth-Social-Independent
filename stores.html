<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Trooth International Stores</title><style>
:root{--g:#b8f2c2;--d:#14532d;--bg:#f3fff5;--w:#fff;--b:#cdebd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#18321f}header{background:var(--g);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:4}h1{margin:0;color:var(--d);font-size:24px}nav a{margin-left:12px;text-decoration:none;color:var(--d);font-weight:bold}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.hero,.card{background:var(--w);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 14px #0000000d}.hero{background:linear-gradient(135deg,#dffff0,var(--g))}.hero h2{margin:0 0 8px;color:var(--d)}.search{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;font-size:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:var(--d);font-weight:bold;cursor:pointer}.tabs button.active{background:var(--d);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.store{border:1px solid var(--b);border-radius:15px;padding:18px;background:#fbfffc}.logo{font-size:38px}.store h3{margin:8px 0;color:var(--d)}.meta{color:#617568;font-size:13px;margin-bottom:10px}.store a{color:var(--d);font-weight:bold}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font:inherit}.form textarea{min-height:100px}.full{grid-column:1/-1}@media(max-width:650px){.form{grid-template-columns:1fr}nav{display:none}}
</style></head><body><header><h1>🛍️ Trooth Stores</h1><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="auth.html">Profile</a></nav></header><main class="wrap">
<section class="hero"><h2>International Stores & Marketplace</h2><p>Discover global shopping platforms and build your own Trooth marketplace listings.</p></section>
<section class="card"><input id="search" class="search" placeholder="Search stores..."><div class="tabs"><button class="active" data-cat="All">All</button><button data-cat="Global Platforms">🌍 Global Platforms</button><button data-cat="Trooth Marketplace">🛒 Trooth Marketplace</button><button data-cat="Local Business">🏬 Local Business</button></div></section>
<section id="stores" class="grid"></section>
<section class="card"><h2>Add Your Store / Listing</h2><form id="form" class="form"><input id="name" placeholder="Store name" required><select id="category"><option>Trooth Marketplace</option><option>Local Business</option><option>Global Platforms</option></select><input id="country" placeholder="Country / Location" required><input id="website" type="url" placeholder="Website URL (optional)"><textarea id="description" class="full" placeholder="Store or product description" required></textarea><button class="btn" type="submit">Add Store</button></form></section>
</main><script>
const KEY='troothStores';let active='All';
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function seed(){if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify([
{id:1,name:'Amazon',category:'Global Platforms',country:'Global',icon:'📦',description:'Global online marketplace. Visit the official Amazon website for shopping and seller services.',url:'https://www.amazon.com/'},
{id:2,name:'Alibaba',category:'Global Platforms',country:'Global',icon:'🌐',description:'Global wholesale and business marketplace. Visit the official Alibaba website.',url:'https://www.alibaba.com/'},
{id:3,name:'Shopify',category:'Global Platforms',country:'Global',icon:'🛍️',description:'Platform for creating and operating online stores. Visit the official Shopify website.',url:'https://www.shopify.com/'}]));}
function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function notify(t){let n=JSON.parse(localStorage.getItem('troothNotifications')||'[]');n.unshift({id:Date.now(),text:t,read:false,time:new Date().toLocaleString()});localStorage.setItem('troothNotifications',JSON.stringify(n))}
function render(){let q=document.getElementById('search').value.toLowerCase();let d=data().filter(x=>(active==='All'||x.category===active)&&(x.name+' '+x.country+' '+x.description).toLowerCase().includes(q));document.getElementById('stores').innerHTML=d.map(x=>`<article class="store"><div class="logo">${esc(x.icon||'🏪')}</div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.category)} · ${esc(x.country)}</div><p>${esc(x.description)}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Visit Store ↗</a>`:''}</article>`).join('')||'<div class="card">No stores found.</div>'}
document.querySelector('.tabs').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;active=e.target.dataset.cat;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render()});document.getElementById('search').addEventListener('input',render);
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let d=data();d.unshift({id:Date.now(),name:name.value.trim(),category:category.value,country:country.value.trim(),icon:'🏪',description:description.value.trim(),url:website.value.trim()});localStorage.setItem(KEY,JSON.stringify(d));notify('A new store/listing was added to Trooth Stores.');e.target.reset();render()});seed();render();
</script></body></html>
