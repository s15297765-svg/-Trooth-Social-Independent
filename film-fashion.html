<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Film & Fashion</title><style>:root{--g:#b8f2c2;--d:#14532d;--bg:#f3fff5;--w:#fff;--b:#cdebd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#18321f}header{background:var(--g);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3;box-shadow:0 2px 10px #0001}h1{margin:0;color:var(--d);font-size:23px}nav a{margin-left:10px;color:var(--d);text-decoration:none;font-weight:bold}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.hero,.card,.story{background:var(--w);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 14px #0001}.hero{background:linear-gradient(135deg,#dffff0,var(--g))}.hero h2{margin:0;color:var(--d)}.search{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;font-size:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:var(--d);font-weight:bold;cursor:pointer}.tabs .active{background:var(--d);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.story h3{color:var(--d);margin:8px 0}.meta{font-size:13px;color:#617568}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font:inherit}.form textarea{min-height:110px}.full{grid-column:1/-1}.tag{display:inline-block;background:var(--g);color:var(--d);border-radius:20px;padding:5px 9px;font-size:12px;font-weight:bold}@media(max-width:650px){.form{grid-template-columns:1fr}nav{display:none}}</style></head><body><header><h1>🎬👗 Trooth Film & Fashion</h1><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="sports.html">Sports</a><a href="stores.html">Stores</a><a href="property.html">Property</a><a href="auth.html">Profile</a></nav></header><main class="wrap"><section class="hero"><h2>Film & Fashion Story Space</h2><p>One shared space for cinema, celebrities, style, designers, trends and independent creative voices.</p></section><section class="card"><input id="search" class="search" placeholder="Search film & fashion stories..."><div class="tabs"><button class="active" data-cat="All">All</button><button data-cat="Film">🎬 Film</button><button data-cat="Fashion">👗 Fashion</button><button data-cat="Trends">✨ Trends</button></div></section><section class="card"><h2>Publish Story</h2><form id="form" class="form"><input id="title" placeholder="Story headline" required><select id="category"><option>Film</option><option>Fashion</option><option>Trends</option></select><input id="author" placeholder="Actor / Designer / Author" required><input id="source" placeholder="Production / Brand (optional)"><textarea id="body" class="full" placeholder="Write your story..." required></textarea><button class="btn" type="submit">Publish Story</button></form></section><section id="stories" class="grid"></section></main><script>const KEY='troothFilmFashion';let active='All';function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function seed(){if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify([{id:1,title:'Welcome to Trooth Film & Fashion',category:'Trends',author:'Trooth Team',source:'Trooth',body:'A shared story space for film, fashion and creative culture.',likes:0},{id:2,title:'Independent Film Voices',category:'Film',author:'Trooth Creatives',source:'Film Community',body:'Discover stories, reviews and conversations around cinema and independent creators.',likes:0},{id:3,title:'Fashion & Style Stories',category:'Fashion',author:'Trooth Creatives',source:'Fashion Community',body:'Share designer stories, style inspiration and fashion trends with the Trooth community.',likes:0}]))}function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')}function notify(t){let n=JSON.parse(localStorage.getItem('troothNotifications')||'[]');n.unshift({id:Date.now(),text:t,read:false,time:new Date().toLocaleString()});localStorage.setItem('troothNotifications',JSON.stringify(n))}function render(){let q=document.getElementById('search').value.toLowerCase();let d=data().filter(x=>(active==='All'||x.category===active)&&(x.title+' '+x.body+' '+x.author+' '+x.source).toLowerCase().includes(q));document.getElementById('stories').innerHTML=d.map(x=>`<article class="story"><span class="tag">${esc(x.category)}</span><h3>${esc(x.title)}</h3><div class="meta">${esc(x.author)}${x.source?' · '+esc(x.source):''}</div><p>${esc(x.body)}</p><button class="btn" onclick="like(${x.id})">👍 Like ${x.likes||0}</button> <button class="btn" onclick="share(${x.id})">↗ Share</button></article>`).join('')||'<div class="card">No stories found.</div>'}function like(id){let d=data(),x=d.find(a=>a.id===id);if(x){x.likes=(x.likes||0)+1;localStorage.setItem(KEY,JSON.stringify(d));render()}}function share(id){let x=data().find(a=>a.id===id);if(!x)return;let t=x.title+' — Trooth Film & Fashion';if(navigator.share)navigator.share({title:'Trooth Film & Fashion',text:t});else if(navigator.clipboard){navigator.clipboard.writeText(t);alert('Story title copied.')}else alert(t)}document.querySelector('.tabs').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;active=e.target.dataset.cat;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render()});document.getElementById('search').addEventListener('input',render);document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let d=data();d.unshift({id:Date.now(),title:title.value.trim(),category:category.value,author:author.value.trim(),source:source.value.trim(),body:body.value.trim(),likes:0});localStorage.setItem(KEY,JSON.stringify(d));notify('A new Film & Fashion story was published on Trooth.');e.target.reset();render()});seed();render();</script></body></html>
