<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Film & Fashion</title><style>body{font-family:Arial;margin:0;background:#f3fff5;color:#18321f}header{background:#b8f2c2;padding:18px;color:#14532d}main{max-width:1100px;margin:auto;padding:18px}.card,.story{background:white;padding:18px;border:1px solid #cdebd4;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.story{margin:0}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #cdebd4;font:inherit}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0}button{background:#b8f2c2;color:#14532d;font-weight:bold}a{color:#14532d;font-weight:bold;margin-right:10px}.muted{color:#718276}.tag{font-weight:bold;color:#2d6a4f}</style></head><body><header>🎬👗 <b>Trooth Film & Fashion</b></header><main><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="auth.html">Profile</a></nav><section class="card"><h2>One Shared Film & Fashion Story Space</h2><form id="form"><input id="title" placeholder="Story headline" required><select id="category"><option>Film</option><option>Fashion</option><option>Trends</option></select><textarea id="body" placeholder="Write your story..." required></textarea><button>Publish Story</button></form></section><section class="card"><input id="search" placeholder="Search stories..."><div id="list" class="grid"></div></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load()}async function load(){let r=await sb.from('film_fashion_stories').select('*').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){let q=search.value.toLowerCase();list.innerHTML=rows.filter(x=>(x.title+' '+x.body+' '+x.category).toLowerCase().includes(q)).map(x=>`<article class="story" data-id="${x.id}"><span class="tag">${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small></article>`).join('')||'<p class="muted">No stories yet.</p>';rows.forEach(x=>{const el=document.querySelector('[data-id="'+x.id+'"]');if(el)TroothInteractions.render(sb,user,'film_fashion',x.id,el)})}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');return}let r=await sb.from('film_fashion_stories').insert({user_id:user.id,title:title.value.trim(),category:category.value,body:body.value.trim()});if(r.error){alert(r.error.message);return}form.reset();await load()};search.oninput=render;init()</script></body></html>
