<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Film & Fashion</title><style>body{font-family:Arial;margin:0;background:#f3fff5;color:#18321f}header{background:#74c69d;padding:18px;color:#fff}main{max-width:1100px;margin:auto;padding:18px}.card,.story{background:#fff;padding:18px;border:1px solid #cdebd4;border-radius:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.story{margin:0}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #cdebd4;font:inherit}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0}button{background:#40916c;color:#fff;font-weight:bold}a{color:#14532d;font-weight:bold;margin-right:10px}.muted{color:#718276}.tag{font-weight:bold;color:#2d6a4f}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button.active{outline:3px solid #b7e4c7}.story p{line-height:1.6}</style></head><body><header>🎬👗 <b>Trooth Film & Fashion</b> — One Shared Story Space</header><main><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="auth.html">Profile</a></nav><section class="card"><h2>🎬👗 Film + Fashion Stories</h2><p class="muted">ایک ہی جگہ پر Film، Fashion اور Trends کی stories</p><form id="form"><input id="title" placeholder="Story headline" required><select id="category"><option>Film</option><option>Fashion</option><option>Trends</option></select><textarea id="body" placeholder="Write your story..." required></textarea><button>Publish Story</button></form></section><section class="card"><div class="tabs"><button type="button" class="active" data-filter="All">All</button><button type="button" data-filter="Film">🎬 Film</button><button type="button" data-filter="Fashion">👗 Fashion</button><button type="button" data-filter="Trends">✨ Trends</button></div><input id="search" placeholder="Search stories..."><div id="list" class="grid"></div></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[],active='All';const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load();sb.channel('trooth-film-fashion').on('postgres_changes',{event:'*',schema:'public',table:'film_fashion_stories'},()=>load()).subscribe()}async function load(){const r=await sb.from('film_fashion_stories').select('*').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){const q=search.value.toLowerCase();const filtered=rows.filter(x=>(active==='All'||x.category===active)&&(x.title+' '+x.body+' '+x.category).toLowerCase().includes(q));list.innerHTML=filtered.map(x=>`<article class="story" data-id="${x.id}"><span class="tag">${x.category==='Film'?'🎬':x.category==='Fashion'?'👗':'✨'} ${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small><div id="i-${x.id}" style="margin-top:12px"></div></article>`).join('')||'<p class="muted">No stories yet.</p>';filtered.forEach(x=>TroothInteractions.render(sb,user,'film_fashion',x.id,document.getElementById('i-'+x.id)))}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');return}const r=await sb.from('film_fashion_stories').insert({user_id:user.id,title:title.value.trim(),category:category.value,body:body.value.trim()});if(r.error){alert(r.error.message);return}form.reset();await load()};search.oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});init()</script></body></html>
