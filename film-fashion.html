<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Film & Fashion</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}header{background:#74c69d;color:#fff;padding:15px 5%;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #245c3a22}header b{font-size:22px}main{max-width:1100px;margin:auto;padding:16px}.card,.story{background:#fff;padding:18px;border:1px solid #d8eadc;border-radius:16px;margin:14px 0;box-shadow:0 3px 14px #245c3a12}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{color:#14532d;font-weight:bold;text-decoration:none;padding:8px 10px;border-radius:9px;background:#f3fff5}.hero{background:linear-gradient(135deg,#d8f3dc,#f3fff5);border:1px solid #b7e4c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.story{margin:0;overflow:hidden}.story h3{margin:8px 0}.story p{line-height:1.6;white-space:pre-wrap}.tag{font-weight:bold;color:#2d6a4f;background:#d8f3dc;padding:6px 9px;border-radius:999px;display:inline-block}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #cdebd4;font:inherit}input,textarea,select{width:100%;margin:5px 0}textarea{min-height:120px;resize:vertical}button{background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button.active{outline:3px solid #b7e4c7}.muted{color:#718276}.status{min-height:20px}.empty{text-align:center;padding:25px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.feedbtn{background:#d8f3dc;color:#2d6a4f;border:1px solid #b7ddc2;border-radius:999px;font-weight:800}@media(max-width:600px){main{padding:10px}header{padding:13px}.card,.story{padding:14px}}</style></head><body><header><b>🎬👗 Trooth Film & Fashion</b><div>One Shared Story Space</div></header><main><nav class="card nav"><a href="index.html">🏠 Home</a><a href="friends.html">👥 Friends</a><a href="business.html">💼 Business</a><a href="news.html">📰 News</a><a href="sports.html">🏏 Sports</a><a href="stores.html">🛍️ Stores</a><a href="property.html">🏠 Property</a><a href="auth.html">👤 Profile</a></nav><section class="card hero"><h2>🎬👗 Film + Fashion Stories</h2><p class="muted">Film، Fashion اور Trends کی تمام stories ایک ہی جگہ پر۔</p><form id="form"><input id="title" placeholder="Story headline" required><select id="category"><option>Film</option><option>Fashion</option><option>Trends</option></select><textarea id="body" placeholder="Write your story..." required></textarea><div class="actions"><button>Publish Story</button></div><p id="status" class="muted status"></p></form></section><section class="card"><h2>✨ Live Stories</h2><div class="tabs"><button type="button" class="active" data-filter="All">All</button><button type="button" data-filter="Film">🎬 Film</button><button type="button" data-filter="Fashion">👗 Fashion</button><button type="button" data-filter="Trends">✨ Trends</button></div><input id="search" placeholder="Search by headline, story or category..."><div id="list" class="grid" style="margin-top:14px"></div></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[],active='All',channel;const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load();channel=sb.channel('trooth-film-fashion-live').on('postgres_changes',{event:'*',schema:'public',table:'film_fashion_stories'},()=>load()).subscribe()}async function load(){const r=await sb.from('film_fashion_stories').select('*').order('created_at',{ascending:false});if(r.error){list.innerHTML='<p class="muted empty">Unable to load stories right now.</p>';return}rows=r.data||[];render()}function render(){const q=search.value.trim().toLowerCase();const filtered=rows.filter(x=>(active==='All'||x.category===active)&&(String(x.title||'')+' '+String(x.body||'')+' '+String(x.category||'')).toLowerCase().includes(q));list.innerHTML=filtered.map(x=>{const icon=x.category==='Film'?'🎬':x.category==='Fashion'?'👗':'✨';return `<article class="story" data-id="${esc(x.id)}"><span class="tag">${icon} ${esc(x.category)}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small class="muted">${x.created_at?new Date(x.created_at).toLocaleString():''}</small><div class="actions"><button class="feedbtn" type="button" onclick="shareToFeed('${esc(x.id)}')">🏠 Share to Trooth Feed</button></div><div id="i-${esc(x.id)}" style="margin-top:12px"></div></article>`}).join('')||'<p class="muted empty">No stories found.</p>';filtered.forEach(x=>{const el=document.getElementById('i-'+x.id);if(el&&window.TroothInteractions)TroothInteractions.render(sb,user,'film_fashion',x.id,el)})}async function shareToFeed(id){if(!user){alert('Please login first.');location.href='auth.html';return}const x=rows.find(r=>r.id===id);if(!x)return;const text='🎬👗 '+x.title+' — '+x.category+'\n\n'+x.body+'\n\n#TroothFilmFashion';const r=await sb.from('posts').insert({user_id:user.id,body:text,media_url:null,media_type:null});if(r.error){alert(r.error.message);return}status.textContent='Story shared to your Trooth Feed ✓';setTimeout(()=>status.textContent='',2200)}form.onsubmit=async e=>{e.preventDefault();if(!user){location.href='auth.html';return}try{status.textContent='Publishing story...';const r=await sb.from('film_fashion_stories').insert({user_id:user.id,title:title.value.trim(),category:category.value,body:body.value.trim()});if(r.error)throw r.error;form.reset();status.textContent='Story published successfully ✓';await load()}catch(e){status.textContent=e.message||'Could not publish story.'}};search.oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});init()</script></body></html>
