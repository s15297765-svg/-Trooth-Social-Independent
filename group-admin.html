<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Group Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:800}.btn{border:0;border-radius:9px;padding:9px 13px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.top .btn{background:#fff;color:#2d6a4f}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #245c3a14}.field{width:100%;border:1px solid #dcebe2;border-radius:10px;padding:10px;margin:6px 0;font:inherit}.member,.announcement{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e0eee5;border-radius:10px;margin:8px 0}.announcement{display:block}.muted{color:#718276;font-size:13px}.danger{background:#b94a48}.status{margin-left:8px}.notice{background:#fff7d6;padding:10px;border-radius:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.empty{padding:10px;border-radius:10px;background:#f4faf6;color:#718276}@media(max-width:600px){.wrap{padding:10px}.member{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="btn" onclick="history.back()">← Back</button><button class="btn" onclick="location.href='groups.html'">👥 Groups</button></header><main class="wrap"><section id="app" class="card"><h2>⚙️ Group Admin</h2><p class="muted">Loading...</p></section></main><script src="supabase-client.js"></script><script>let sb,user,groupId,group,members=[],announcements=[];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const id=()=>new URLSearchParams(location.search).get('id');const fmt=d=>d?new Date(d).toLocaleString():'';async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;groupId=id();const u=await sb.auth.getUser();user=u.data.user||null;if(!user||!groupId){app.innerHTML='<div class="notice">Please login and select a group.</div>';return}await load()}async function load(){const r=await sb.from('groups').select('id,name,description,privacy,created_by').eq('id',groupId).maybeSingle();if(r.error||!r.data){app.innerHTML='<div class="notice">Group not found.</div>';return}group=r.data;if(group.created_by!==user.id){app.innerHTML='<div class="notice">Only the group creator can use this admin panel.</div>';return}const m=await sb.from('group_members').select('user_id,role').eq('group_id',groupId);members=m.data||[];const a=await sb.from('group_announcements').select('id,title,body,created_by,created_at').eq('group_id',groupId).order('created_at',{ascending:false}).limit(30);announcements=a.data||[];const ids=[...new Set([...members.map(x=>x.user_id),...announcements.map(x=>x.created_by)])];const p=ids.length?await sb.from('profiles').select('id,display_name').in('id',ids):{data:[]};const pm={};(p.data||[]).forEach(x=>pm[x.id]=x);app.innerHTML='<h2>⚙️ '+esc(group.name)+'</h2><div><label>Group Name</label><input id="name" class="field" value="'+esc(group.name)+'"><label>Description</label><textarea id="desc" class="field" rows="4">'+esc(group.description||'')+'</textarea><label>Privacy</label><select id="privacy" class="field"><option value="public" '+(group.privacy==='public'?'selected':'')+'>🌐 Public</option><option value="private" '+(group.privacy==='private'?'selected':'')+'>🔒 Private</option></select><button class="btn" onclick="save()">Save Group</button><span id="status" class="status muted"></span></div><hr><h3>📢 Announcements ('+announcements.length+')</h3><input id="atitle" class="field" placeholder="Announcement title"><textarea id="abody" class="field" rows="4" placeholder="Write an important announcement..."></textarea><button class="btn" onclick="addAnnouncement()">📢 Publish Announcement</button><span id="astatus" class="status muted"></span><div id="alist">'+(announcements.length?announcements.map(x=>'<div class="announcement"><b>'+esc(x.title)+'</b><p>'+esc(x.body).replace(/\n/g,'<br>')+'</p><div class="muted">By '+esc(pm[x.created_by]?.display_name||'Trooth Member')+' · '+esc(fmt(x.created_at))+'</div><div class="actions"><button class="btn" onclick="editAnnouncement(\''+x.id+'\',\''+esc(x.title).replace(/'/g,'&#39;')+'\',\''+esc(x.body).replace(/'/g,'&#39;').replace(/\n/g,'&#10;')+'\')">✏️ Edit</button><button class="btn danger" onclick="deleteAnnouncement(\''+x.id+'\')">🗑️ Delete</button></div></div>').join(''):'<div class="empty">No announcements yet.</div>')+'</div><hr><h3>👥 Members ('+members.length+')</h3><div id="list">'+members.map(x=>'<div class="member"><span><b>'+esc(pm[x.user_id]?.display_name||'Trooth Member')+'</b> <span class="muted">'+(x.role==='admin'?'⭐ Admin':'Member')+'</span></span><span>'+ (x.user_id===user.id?'<span class="muted">You</span>':('<select class="field" style="width:auto;display:inline-block;margin:0" onchange="role(\''+x.user_id+'\',this.value)"><option value="member" '+(x.role==='member'?'selected':'')+'>Member</option><option value="admin" '+(x.role==='admin'?'selected':'')+'>Admin</option></select> <button class="btn danger" onclick="removeMember(\''+x.user_id+'\')">Remove</button>'))+'</span></div>').join('')+'</div><p class="muted">Admins can manage members. The group creator remains the owner.</p>'}async function save(){const r=await sb.from('groups').update({name:name.value.trim(),description:desc.value.trim(),privacy:privacy.value}).eq('id',groupId).eq('created_by',user.id);status.textContent=r.error?r.error.message:'Saved ✓'}async function addAnnouncement(){const title=atitle.value.trim(),body=abody.value.trim();if(!title||!body){astatus.textContent='Title and message are required.';return}const r=await sb.from('group_announcements').insert({group_id:groupId,created_by:user.id,title,body});if(r.error){astatus.textContent=r.error.message;return}atitle.value='';abody.value='';astatus.textContent='Published ✓';await load()}async function editAnnouncement(uid,title,body){const nt=prompt('Announcement title:',title),nb=prompt('Announcement message:',body);if(nt===null||nb===null||!nt.trim()||!nb.trim())return;const r=await sb.from('group_announcements').update({title:nt.trim(),body:nb.trim()}).eq('id',uid).eq('group_id',groupId);if(r.error)alert(r.error.message);else load()}async function deleteAnnouncement(uid){if(!confirm('Delete this announcement?'))return;const r=await sb.from('group_announcements').delete().eq('id',uid).eq('group_id',groupId);if(r.error)alert(r.error.message);else load()}async function role(uid,value){const r=await sb.from('group_members').update({role:value}).eq('group_id',groupId).eq('user_id',uid);if(r.error)alert(r.error.message);else load()}async function removeMember(uid){if(!confirm('Remove this member?'))return;const r=await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',uid);if(r.error)alert(r.error.message);else load()}ready();</script></body></html>
