<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74c69d"><title>Trooth Group Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:800;margin-right:auto}.btn{border:0;border-radius:9px;padding:9px 13px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.top .btn{background:#fff;color:#2d6a4f}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #245c3a14}.field{width:100%;border:1px solid #dcebe2;border-radius:10px;padding:10px;margin:6px 0;font:inherit}.member,.announcement,.request{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e0eee5;border-radius:10px;margin:8px 0}.announcement{display:block}.muted{color:#718276;font-size:13px}.danger{background:#b94a48}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.empty{padding:10px;border-radius:10px;background:#f4faf6;color:#718276}.notice{background:#fff7d6;padding:10px;border-radius:10px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{background:#f4faf6;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:#2d6a4f}.search{max-width:320px}.toast{position:fixed;right:16px;bottom:16px;background:#2d6a4f;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:20}@media(max-width:600px){.wrap{padding:10px}.member,.request{align-items:flex-start;flex-direction:column}.statgrid{grid-template-columns:1fr 1fr 1fr}.top{padding:12px 10px}.logo{font-size:20px}}</style></head><body><header class="top"><div class="logo">🌿 Trooth</div><button class="btn" onclick="history.back()">← Back</button><button class="btn" onclick="location.href='groups.html'">👥 Groups</button></header><main class="wrap"><section id="app" class="card"><h2>⚙️ Group Admin</h2><p class="muted">Loading...</p></section></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="supabase-client.js"></script><script>let sb,user,groupId,group,members=[],announcements=[],requests=[],profiles={},busy=false;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const fmt=d=>d?new Date(d).toLocaleString():'';function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.display='none',2400)}async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;groupId=new URLSearchParams(location.search).get('id');const u=await sb.auth.getUser();user=u.data.user||null;if(!user||!groupId){app.innerHTML='<div class="notice">Please login and select a group.</div>';return}await load();subscribe()}async function load(){if(busy)return;busy=true;try{const r=await sb.from('groups').select('id,name,description,privacy,created_by').eq('id',groupId).maybeSingle();if(r.error||!r.data){app.innerHTML='<div class="notice">Group not found.</div>';return}group=r.data;if(group.created_by!==user.id){app.innerHTML='<div class="notice">Only the group creator can use this admin panel.</div>';return}const [m,a,q]=await Promise.all([sb.from('group_members').select('user_id,role').eq('group_id',groupId),sb.from('group_announcements').select('id,title,body,created_by,created_at').eq('group_id',groupId).order('created_at',{ascending:false}).limit(30),sb.from('group_join_requests').select('id,user_id,status,created_at').eq('group_id',groupId).eq('status','pending').order('created_at',{ascending:false})]);members=m.data||[];announcements=a.data||[];requests=q.data||[];const ids=[...new Set([...members.map(x=>x.user_id),...announcements.map(x=>x.created_by),...requests.map(x=>x.user_id)])];const p=ids.length?await sb.from('profiles').select('id,display_name').in('id',ids):{data:[]};profiles={};(p.data||[]).forEach(x=>profiles[x.id]=x);render()}finally{busy=false}}function render(){app.innerHTML='<h2>⚙️ '+esc(group.name)+'</h2><div class="statgrid"><div class="stat"><b>'+members.length+'</b>Members</div><div class="stat"><b>'+requests.length+'</b>Pending</div><div class="stat"><b>'+announcements.length+'</b>Announcements</div></div><div><label>Group Name</label><input id="name" class="field" value="'+esc(group.name)+'"><label>Description</label><textarea id="desc" class="field" rows="4">'+esc(group.description||'')+'</textarea><label>Privacy</label><select id="privacy" class="field"><option value="public" '+(group.privacy==='public'?'selected':'')+'>🌐 Public</option><option value="private" '+(group.privacy==='private'?'selected':'')+'>🔒 Private</option></select><button class="btn" onclick="save()">💾 Save Group</button> <span id="status" class="muted"></span></div><hr><h3>🔐 Join Requests ('+requests.length+')</h3><input id="requestSearch" class="field search" placeholder="Search requests..." oninput="filterRequests()"><div id="requests">'+requestHtml(requests)+'</div><hr><h3>📢 Announcements ('+announcements.length+')</h3><input id="atitle" class="field" placeholder="Announcement title"><textarea id="abody" class="field" rows="4" placeholder="Write an important announcement..."></textarea><button class="btn" onclick="addAnnouncement()">📢 Publish Announcement</button> <span id="astatus" class="muted"></span><div id="alist">'+announcementHtml()+'</div><hr><h3>👥 Members ('+members.length+')</h3><input id="memberSearch" class="field search" placeholder="Search members..." oninput="filterMembers()"><div id="list">'+memberHtml(members)+'</div><p class="muted">The group creator remains the owner and cannot be removed or demoted.</p>'}function requestHtml(list){return list.length?list.map(x=>'<div class="request" data-name="'+esc(profiles[x.user_id]?.display_name||'Trooth Member').toLowerCase()+'"><span><b>'+esc(profiles[x.user_id]?.display_name||'Trooth Member')+'</b><div class="muted">Requested '+esc(fmt(x.created_at))+'</div></span><span class="actions"><button class="btn" onclick="approve(\''+x.id+'\',\''+x.user_id+'\')">✅ Approve</button><button class="btn danger" onclick="reject(\''+x.id+'\')">❌ Reject</button></span></div>').join(''):'<div class="empty">No pending join requests.</div>'}function memberHtml(list){return list.map(x=>'<div class="member" data-name="'+esc(profiles[x.user_id]?.display_name||'Trooth Member').toLowerCase()+'"><span><b>'+esc(profiles[x.user_id]?.display_name||'Trooth Member')+'</b> <span class="muted">'+(x.user_id===user.id?'👑 Owner':x.role==='admin'?'⭐ Admin':'Member')+'</span></span><span>'+(x.user_id===user.id?'<span class="muted">You</span>':('<select class="field" style="width:auto;display:inline-block;margin:0" onchange="role(\''+x.user_id+'\',this.value)"><option value="member" '+(x.role==='member'?'selected':'')+'>Member</option><option value="admin" '+(x.role==='admin'?'selected':'')+'>Admin</option></select> <button class="btn danger" onclick="removeMember(\''+x.user_id+'\')">Remove</button>'))+'</span></div>').join('')}function announcementHtml(){return announcements.length?announcements.map(x=>'<div class="announcement"><b>'+esc(x.title)+'</b><p>'+esc(x.body).replace(/\n/g,'<br>')+'</p><div class="muted">By '+esc(profiles[x.created_by]?.display_name||'Trooth Member')+' · '+esc(fmt(x.created_at))+'</div><div class="actions"><button class="btn" onclick="editAnnouncement(\''+x.id+'\')">✏️ Edit</button><button class="btn danger" onclick="deleteAnnouncement(\''+x.id+'\')">🗑️ Delete</button></div></div>').join(''):'<div class="empty">No announcements yet.</div>'}function filterRequests(){const q=(requestSearch.value||'').toLowerCase();document.querySelectorAll('#requests .request').forEach(x=>x.style.display=x.dataset.name.includes(q)?'flex':'none')}function filterMembers(){const q=(memberSearch.value||'').toLowerCase();document.querySelectorAll('#list .member').forEach(x=>x.style.display=x.dataset.name.includes(q)?'flex':'none')}async function save(){const n=name.value.trim(),d=desc.value.trim();if(!n){status.textContent='Group name is required.';return}const r=await sb.from('groups').update({name:n,description:d,privacy:privacy.value}).eq('id',groupId).eq('created_by',user.id);status.textContent=r.error?r.error.message:'Saved ✓';if(!r.error){toast('Group settings saved ✓');await load()}}async function approve(requestId,uid){const a=await sb.from('group_join_requests').update({status:'approved'}).eq('id',requestId).eq('group_id',groupId);if(a.error){toast(a.error.message);return}const m=await sb.from('group_members').upsert({group_id:groupId,user_id:uid,role:'member'},{onConflict:'group_id,user_id'});if(m.error){toast(m.error.message);return}const n=await sb.from('notifications').insert({user_id:uid,actor_id:user.id,kind:'group_join_approved',body:'Your request to join '+group.name+' was approved'});if(n.error)toast('Approved, but notification could not be created.');else toast('Member approved + notification sent ✓');await load()}async function reject(requestId){const r=await sb.from('group_join_requests').update({status:'rejected'}).eq('id',requestId).eq('group_id',groupId);if(r.error)toast(r.error.message);else{toast('Request rejected');await load()}}async function addAnnouncement(){const title=atitle.value.trim(),body=abody.value.trim();if(!title||!body){astatus.textContent='Title and message are required.';return}const r=await sb.from('group_announcements').insert({group_id:groupId,created_by:user.id,title,body});if(r.error){astatus.textContent=r.error.message;return}atitle.value='';abody.value='';toast('Announcement published ✓');await load()}async function editAnnouncement(uid){const x=announcements.find(a=>a.id===uid);if(!x)return;const nt=prompt('Announcement title:',x.title),nb=prompt('Announcement message:',x.body);if(nt===null||nb===null||!nt.trim()||!nb.trim())return;const r=await sb.from('group_announcements').update({title:nt.trim(),body:nb.trim()}).eq('id',uid).eq('group_id',groupId);if(r.error)toast(r.error.message);else{toast('Announcement updated ✓');load()}}async function deleteAnnouncement(uid){if(!confirm('Delete this announcement?'))return;const r=await sb.from('group_announcements').delete().eq('id',uid).eq('group_id',groupId);if(r.error)toast(r.error.message);else{toast('Announcement deleted');load()}}async function role(uid,value){const r=await sb.from('group_members').update({role:value}).eq('group_id',groupId).eq('user_id',uid);if(r.error)toast(r.error.message);else{toast(value==='admin'?'Admin promoted ⭐':'Admin role removed');load()}}async function removeMember(uid){if(!confirm('Remove this member from the group?'))return;const r=await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',uid);if(r.error)toast(r.error.message);else{toast('Member removed');load()}}function subscribe(){if(!sb||!groupId||window.__troothGroupAdminChannel)return;window.__troothGroupAdminChannel=sb.channel('trooth-group-admin-'+groupId).on('postgres_changes',{event:'*',schema:'public',table:'group_join_requests',filter:'group_id=eq.'+groupId},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'group_members',filter:'group_id=eq.'+groupId},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'group_announcements',filter:'group_id=eq.'+groupId},()=>load()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'groups',filter:'id=eq.'+groupId},()=>load()).subscribe(()=>toast('Admin live ✓'))}ready();</script></body></html>
