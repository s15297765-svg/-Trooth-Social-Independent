<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Real Account</title><script src="supabase-client.js"></script><style>body{font-family:Arial,sans-serif;background:#eef8f1;color:#173b29;margin:0;padding:20px}.wrap{max-width:700px;margin:auto}.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 3px 14px #245c3a14;margin-bottom:18px}h1{color:#2d6a4f}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #d8e8dd;border-radius:10px}button{background:#40916c;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}button.secondary{background:#d8f3dc;color:#2d6a4f}.status{padding:10px;border-radius:10px;background:#f1f7f3;margin:10px 0}.hidden{display:none}a{color:#2d6a4f;font-weight:bold}</style></head><body><div class="wrap"><div class="card"><h1>🌿 Trooth Real Account</h1><p>یہ Trooth کے حقیقی multi-user backend کا ابتدائی دروازہ ہے۔</p><div id="status" class="status">Supabase سے رابطہ ہو رہا ہے...</div></div><div id="auth" class="card"><h2>🔐 Create Account / Login</h2><input id="name" placeholder="Display Name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signup()">Create Account</button><button class="secondary" onclick="login()">Login</button><p id="msg"></p></div><div id="account" class="card hidden"><h2>👤 My Account</h2><p id="who"></p><textarea id="bio" placeholder="Your bio"></textarea><button onclick="saveProfile()">Save Profile</button><button class="secondary" onclick="logout()">Logout</button><hr><h3>📝 Test Real Post</h3><textarea id="post" placeholder="Write a real post..."></textarea><button onclick="createPost()">Publish Post</button><div id="posts"></div></div><div class="card"><a href="index.html">← Back to Trooth Home</a></div></div><script>const $=id=>document.getElementById(id);function setMsg(t){$('msg').textContent=t}function ready(){return !!window.troothSupabase}async function signup(){if(!ready())return setMsg('Backend ابھی load ہو رہا ہے۔');const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim()||'Trooth User';if(!email||password.length<6)return setMsg('Email دیں اور password کم از کم 6 حروف کا رکھیں۔');const {data,error}=await troothSupabase.auth.signUp({email,password});if(error)return setMsg(error.message);if(data.user){const r=await troothSupabase.from('profiles').upsert({id:data.user.id,display_name:name});if(r.error)return setMsg(r.error.message)}setMsg('Account بن گیا۔ اگر email confirmation مانگی جائے تو email verify کریں۔');await load()}async function login(){if(!ready())return setMsg('Backend ابھی load ہو رہا ہے۔');const {error}=await troothSupabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return setMsg(error.message);setMsg('Login کامیاب۔');await load()}async function logout(){await troothSupabase.auth.signOut();await load()}async function load(){if(!ready())return;const {data}=await troothSupabase.auth.getUser();const u=data.user;if(!u){$('auth').classList.remove('hidden');$('account').classList.add('hidden');$('status').textContent='Supabase backend connected — Login required.';return}$('auth').classList.add('hidden');$('account').classList.remove('hidden');$('status').textContent='✅ Real multi-user backend connected';$('who').textContent='Logged in: '+u.email;const p=await troothSupabase.from('profiles').select('*').eq('id',u.id).maybeSingle();if(p.data){$('bio').value=p.data.bio||'';$('who').textContent=p.data.display_name+' • '+u.email}await loadPosts()}async function saveProfile(){const {data}=await troothSupabase.auth.getUser();if(!data.user)return;const name=prompt('Display name',$('who').textContent.split(' • ')[0])||'Trooth User';const {error}=await troothSupabase.from('profiles').upsert({id:data.user.id,display_name:name,bio:$('bio').value});alert(error?error.message:'Profile saved successfully.');await load()}async function createPost(){const text=$('post').value.trim();if(!text)return;const {data}=await troothSupabase.auth.getUser();if(!data.user)return;const {error}=await troothSupabase.from('posts').insert({user_id:data.user.id,body:text});if(error)return alert(error.message);$('post').value='';await loadPosts()}async function loadPosts(){const r=await troothSupabase.from('posts').select('id,body,created_at,profiles(display_name)').order('created_at',{ascending:false}).limit(10);if(r.error){$('posts').innerHTML='<p>'+r.error.message+'</p>';return}$('posts').innerHTML=r.data.map(x=>'<div class="status"><b>'+esc(x.profiles?.display_name||'Trooth User')+'</b><br>'+esc(x.body)+'</div>').join('')||'<p>No posts yet.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.addEventListener('trooth-supabase-ready',load);</script></body></html>
