<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Group</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:13px 5%;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:800}.btn{border:0;border-radius:9px;padding:9px 13px;background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.top .btn{background:#fff;color:#2d6a4f}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #245c3a14}.cover{background:linear-gradient(135deg,#74c69d,#d8f3dc);padding:28px;border-radius:16px}.cover h1{margin:0 0 8px}.muted{color:#718276;font-size:13px}.composer textarea{width:100%;min-height:80px;border:1px solid #dcebe2;border-radius:12px;padding:12px;font:inherit;resize:vertical}.post{border-top:1px solid #e3eee6;padding-top:14px;margin-top:14px}.posthead{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:bold}.postbody{white-space:pre-wrap;line-height:1.5;margin:12px 0}.actions{display:flex;gap:8px}.actions button{border:0;background:#d8f3dc;color:#2d6a4f;border-radius:8px;padding:7px 12px}.comment{background:#f4faf6;border-radius:10px;padding:8px;margin-top:8px;font-size:13px}.commentbox{display:flex;gap:7px;margin-top:9px}.commentbox input{flex:1;border:1px solid #dcebe2;border-radius:9px;padding:8px}.members{display:flex;gap:8px;flex-wrap:wrap}.member{background:#d8f3dc;padding:7px 9px;border-radius:12px;font-size:12px;display:flex;gap:7px;align-items:center}.mini{border:0;border-radius:7px;padding:4px 7px;background:#fff;color:#2d6a4f;cursor:pointer}.admin{background:#f7fffa;border:1px solid #cfe8d7}.admin input,.admin textarea{width:100%;border:1px solid #dcebe2;border-radius:9px;padding:9px;margin:5px 0;font:inherit}.admin textarea{min-height:60px}.notice{background:#fff7d6;border:1px solid #f0df9b;border-radius:10px;padding:10px;margin-top:10px}@media(max-width:600px){.wrap{padding:10px}.top{padding:10px}.logo{font-size:20px}}</style></head><body><header class="top"><div class="logo">Trooth</div><button class="btn" onclick="location.href='groups.html'">👥 Groups</button><button class="btn" onclick="location.href='index.html'">⌂ Home</button></header><main class="wrap"><section id="info" class="cover"><h1>Loading group...</h1></section><section id="admin" class="card admin" style="display:none"><h3>⚙️ Group Admin Panel</h3><input id="editName" placeholder="Group name"><textarea id="editDesc" placeholder="Description"></textarea><button class="btn" onclick="saveGroup()">Save Changes</button> <span id="adminStatus" class="muted"></span></section><section class="card"><h3>👥 Members</h3><div id="members" class="members"></div></section><section id="composerCard" class="card composer"><h3>✍️ Group Post</h3><textarea id="body" placeholder="Share something with this group..."></textarea><br><button class="btn" onclick="createPost()">Publish Post</button><span id="status" class="muted"></span></section><section class="card"><h2>📰 Community Feed</h2><div id="feed"></div></section></main><script src="supabase-client.js"></script><script>let sb,user,groupId,group,posts=[],memberRows=[];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const gid=()=>new URLSearchParams(location.search).get('id');async function ready(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;groupId=gid();const u=await sb.auth.getUser();user=u.data.user||null;if(!groupId){info.innerHTML='<h1>No group selected</h1>';return}await load();sb.channel('trooth-group-'+groupId).on('postgres_changes',{event:'*',schema:'public',table:'group_members',filter:'group_id=eq.'+groupId},()=>loadMembers()).on('postgres_changes',{event:'*',schema:'public',table:'posts',filter:'group_id=eq.'+groupId},()=>loadPosts()).on('postgres_changes',{event:'*',schema:'public',table:'groups',filter:'id=eq.'+groupId},()=>load()).subscribe()}async function load(){const g=await sb.from('groups').select('id,name,description,created_by,privacy').eq('id',groupId).maybeSingle();if(g.error||!g.data){info.innerHTML='<h1>Group not found</h1>';return}group=g.data;const privateText=group.privacy==='private';info.innerHTML='<h1>👥 '+esc(group.name)+' '+(privateText?'🔒':'🌐')+'</h1><p>'+esc(group.description||'Trooth community')+'</p><div class="muted">'+(privateText?'Private Group — members only':'Public Group — everyone can discover it')+'</div>';if(user&&group.created_by===user.id){admin.style.display='block';editName.value=group.name;editDesc.value=group.description||''}await Promise.all([loadMembers(),loadPosts()])}async function loadMembers(){const r=await sb.from('group_members').select('user_id,role').eq('group_id',groupId);memberRows=r.data||[];const ids=memberRows.map(x=>x.user_id);const joined=user&&ids.includes(user.id);composerCard.style.display=joined?'block':'none';if(!ids.length){members.innerHTML='<span class="muted">No members yet.</span>';return}const p=await sb.from('profiles').select('id,display_name').in('id',ids),pm={};(p.data||[]).forEach(x=>pm[x.id]=x);const isAdmin=user&&group&&group.created_by===user.id;members.innerHTML=memberRows.map(x=>'<span class="member">'+esc(pm[x.user_id]?.display_name||'Trooth Member')+' '+(x.role==='admin'?'⭐ Admin':'')+(isAdmin&&x.user_id!==user.id?'<button class="mini" onclick="removeMember(\''+x.user_id+'\')">Remove</button>':'')+'</span>').join('');if(!joined&&!isAdmin)feed.insertAdjacentHTML('afterbegin','<div class="notice">Join this group to publish and interact with the community.</div>')}async function loadPosts(){let q=sb.from('posts').select('id,user_id,body,created_at').eq('group_id',groupId).order('created_at',{ascending:false}).limit(50);const r=await q;if(r.error){feed.innerHTML='<p class="muted">'+esc(r.error.message)+'</p>';return}posts=r.data||[];if(!posts.length){feed.innerHTML='<p class="muted">No group posts yet. Be the first.</p>';return}const ids=[...new Set(posts.map(x=>x.user_id))],p=await sb.from('profiles').select('id,display_name').in('id',ids),pm={};(p.data||[]).forEach(x=>pm[x.id]=x);feed.innerHTML=posts.map(x=>'<article class="post"><div class="posthead"><div class="avatar">'+esc((pm[x.user_id]?.display_name||'T')[0].toUpperCase())+'</div><div><b>'+esc(pm[x.user_id]?.display_name||'Trooth Member')+'</b><div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div></div><div class="postbody">'+esc(x.body)+'</div><div class="actions"><button onclick="likePost(\''+x.id+'\')">👍 Like</button><button onclick="focusComment(\''+x.id+'\')">💬 Comment</button></div><div id="comments-'+x.id+'"></div><div class="commentbox"><input id="input-'+x.id+'" placeholder="Write a comment..."><button class="btn" onclick="commentPost(\''+x.id+'\')">Send</button></div></article>').join('');for(const x of posts)loadComments(x.id)}async function loadComments(pid){const r=await sb.from('comments').select('id,user_id,body,created_at').eq('post_id',pid).order('created_at');if(r.error)return;const ids=[...new Set((r.data||[]).map(x=>x.user_id))],p=ids.length?await sb.from('profiles').select('id,display_name').in('id',ids):{data:[]},pm={};(p.data||[]).forEach(x=>pm[x.id]=x);const el=document.getElementById('comments-'+pid);if(el)el.innerHTML=(r.data||[]).map(x=>'<div class="comment"><b>'+esc(pm[x.user_id]?.display_name||'Member')+'</b>: '+esc(x.body)+'</div>').join('')}async function createPost(){if(!user){location.href='auth.html';return}const member=memberRows.some(x=>x.user_id===user.id);if(!member){alert('Join this group first.');return}const text=body.value.trim();if(!text)return;status.textContent='Publishing...';const r=await sb.from('posts').insert({user_id:user.id,body:text,group_id:groupId});if(r.error){status.textContent=r.error.message;return}body.value='';status.textContent='Published ✓';await loadPosts()}async function commentPost(pid){if(!user){location.href='auth.html';return}if(!memberRows.some(x=>x.user_id===user.id)){alert('Join this group first.');return}const el=document.getElementById('input-'+pid),text=el.value.trim();if(!text)return;const r=await sb.from('comments').insert({user_id:user.id,post_id:pid,body:text});if(r.error){alert(r.error.message);return}el.value='';await loadComments(pid)}async function likePost(pid){if(!user){location.href='auth.html';return}if(!memberRows.some(x=>x.user_id===user.id)){alert('Join this group first.');return}const r=await sb.from('post_likes').insert({user_id:user.id,post_id:pid});if(r.error&&!String(r.error.message).toLowerCase().includes('duplicate'))alert(r.error.message)}function focusComment(pid){document.getElementById('input-'+pid)?.focus()}async function saveGroup(){if(!user||!group||group.created_by!==user.id)return;adminStatus.textContent='Saving...';const r=await sb.from('groups').update({name:editName.value.trim(),description:editDesc.value.trim()}).eq('id',groupId);adminStatus.textContent=r.error?r.error.message:'Saved ✓';if(!r.error)await load()}async function removeMember(uid){if(!confirm('Remove this member from the group?'))return;const r=await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',uid);if(r.error)alert(r.error.message);else await loadMembers()}ready();</script></body></html>
