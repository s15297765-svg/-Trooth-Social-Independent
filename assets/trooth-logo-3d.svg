      <path d="M318 96h134M330 68h110M330 124h110" fill="none" stroke="#b8f4ff" stroke-width="2.5" opacity=".8"/>
      <path d="M350 49c18-15 43-17 62-8-12 6-17 17-15 30-18 2-35-6-47-22z" fill="#6df05a"/>
