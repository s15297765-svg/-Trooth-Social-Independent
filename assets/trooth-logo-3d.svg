<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Trooth</title>
  <desc id="desc">Premium 3D Trooth wordmark with both O letters represented by blue globes.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#baff78"/><stop offset=".45" stop-color="#43df43"/><stop offset="1" stop-color="#0c984a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af2ff"/><stop offset=".42" stop-color="#168dff"/><stop offset="1" stop-color="#0646b7"/>
    </linearGradient>
    <radialGradient id="shine" cx=".28" cy=".22" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".2" stop-color="#fff" stop-opacity=".15"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#001b63" stop-opacity=".25"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-25%" width="135%" height="165%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif" font-weight="900">
    <text x="24" y="154" font-size="142" fill="url(#green)" stroke="#08783b" stroke-width="3" paint-order="stroke">Tr</text>

    <g>
      <circle cx="338" cy="101" r="62" fill="url(#blue)" stroke="#075bc5" stroke-width="5"/>
      <circle cx="338" cy="101" r="62" fill="url(#shine)"/>
      <ellipse cx="338" cy="101" rx="25" ry="62" fill="none" stroke="#d5fbff" stroke-width="2.5" opacity=".9"/>
      <path d="M276 101h124M285 74h106M285 128h106" fill="none" stroke="#d5fbff" stroke-width="2.5" opacity=".85"/>
      <path d="M305 55c17-13 38-16 56-9-10 7-15 16-13 27-17 4-32-2-43-18zM323 104c13-8 27-5 37 5-4 17-15 29-30 37-11-11-14-25-7-42z" fill="#56d84f"/>
      <circle cx="319" cy="67" r="5" fill="#fff" opacity=".9"/>
    </g>

    <g>
      <circle cx="476" cy="101" r="62" fill="url(#blue)" stroke="#075bc5" stroke-width="5"/>
      <circle cx="476" cy="101" r="62" fill="url(#shine)"/>
      <ellipse cx="476" cy="101" rx="25" ry="62" fill="none" stroke="#d5fbff" stroke-width="2.5" opacity=".9"/>
      <path d="M414 101h124M423 74h106M423 128h106" fill="none" stroke="#d5fbff" stroke-width="2.5" opacity=".85"/>
      <path d="M443 57c18-12 39-14 55-6-8 7-11 16-9 26-16 4-31-3-46-20zM466 105c13-7 27-2 36 8-5 17-15 28-30 35-12-10-14-25-6-43z" fill="#56d84f"/>
      <circle cx="457" cy="67" r="5" fill="#fff" opacity=".9"/>
    </g>

    <text x="540" y="154" font-size="142" fill="url(#green)" stroke="#08783b" stroke-width="3" paint-order="stroke">th</text>
    <path d="M75 218 Q448 244 825 218" fill="none" stroke="url(#green)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>