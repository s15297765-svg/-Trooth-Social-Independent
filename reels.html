<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Reels</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{height:64px;background:#74c69d;color:#fff;display:flex;align-items:center;gap:12px;padding:0 5%;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:800}.top a,.top button{background:#fff;color:#2d6a4f;border:0;border-radius:20px;padding:9px 14px;text-decoration:none;font-weight:bold;margin-left:auto}.top a+a{margin-left:0}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.hero{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 14px #245c3a14;margin-bottom:18px}.hero h1{margin:0 0 6px}.muted{color:#718276;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.reel{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #245c3a14}.media{width:100%;aspect-ratio:9/14;background:#d8f3dc;object-fit:cover;display:block}.info{padding:14px}.user{display:flex;align-items:center;gap:9px;font-weight:bold}.avatar{width:38px;height:38px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.body{margin:10px 0;line-height:1.45;white-space:pre-wrap}.actions{display:flex;gap:8px;border-top:1px solid #e3eee6;padding-top:10px}.actions button{border:0;background:#d8f3dc;color:#2d6a4f;border-radius:9px;padding:8px 12px;font-weight:bold;cursor:pointer}.empty{text-align:center;padding:40px;background:#fff;border-radius:18px}.err{color:#a33}.composer{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 14px #245c3a14;margin-bottom:18px}.composer textarea{width:100%;border:0;background:#f1f7f3;border-radius:12px;padding:12px;resize:vertical;min-height:70px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.file{background:#d8f3dc;color:#2d6a4f;border-radius:9px;padding:9px 12px;font-weight:bold;cursor:pointer}.btn{background:#40916c;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:bold;cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}.top a{padding:8px 10px;font-size:12px}}</style></head><body><header class="top"><div class="logo">Trooth Reels</div><a href="index.html">Home</a><a href="chat.html">Chat</a></header><main class="wrap"><section class="hero"><h1>🎬 Reels</h1><p class="muted">Short videos from the Trooth community. Scroll, watch and share.</p></section><section class="composer"><textarea id="body" placeholder="Add a caption for your Reel..."></textarea><div class="row"><label class="file">🎥 Choose Video<input id="video" type="file" accept="video/*" hidden></label><button class="btn" onclick="publish()">Publish Reel</button><span id="status" class="muted"></span></div></section><section id="grid" class="grid"></section></main><script src="supabase-client.js"></script><script>let user=null;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function init(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));const s=window.troothSupabase;const u=await s.auth.getUser();user=u.data.user||null;await load()}async function load(){const s=window.troothSupabase;r=await s.from('stories_reels').select('id,user_id,body,media_url,media_type,created_at,expires_at').eq('media_type','video').order('created_at',{ascending:false}).limit(50);if(r.error){grid.innerHTML='<div class="empty err">'+esc(r.error.message)+'</div>';return}const rows=r.data||[];if(!rows.length){grid.innerHTML='<div class="empty">No Reels yet. Be the first to publish one!</div>';return}const ids=[...new Set(rows.map(x=>x.user_id))];const p=await s.from('profiles').select('id,display_name,avatar_url').in('id',ids);const map={};(p.data||[]).forEach(x=>map[x.id]=x);grid.innerHTML=rows.map(x=>{const n=map[x.user_id]?.display_name||'Trooth Member';const av=map[x.user_id]?.avatar_url?'<img src="'+esc(map[x.user_id].avatar_url)+'">':esc(n[0].toUpperCase());return '<article class="reel"><video class="media" src="'+esc(x.media_url)+'" controls playsinline preload="metadata"></video><div class="info"><div class="user"><span class="avatar">'+av+'</span>'+esc(n)+'</div>'+(x.body?'<div class="body">'+esc(x.body)+'</div>':'')+'<div class="actions"><button onclick="shareReel(\''+x.id+'\')">↗ Share</button><button onclick="copyLink(\''+x.id+'\')">🔗 Copy Link</button></div></div></article>'}).join('')}async function publish(){if(!user){alert('Please login first.');location.href='auth.html';return}const f=video.files[0];if(!f){status.textContent='Choose a video first.';return}status.textContent='Uploading...';const s=window.troothSupabase,ext=f.name.split('.').pop().toLowerCase(),path=user.id+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const up=await s.storage.from('story-media').upload(path,f,{contentType:f.type,upsert:false});if(up.error){status.textContent=up.error.message;return}const url=s.storage.from('story-media').getPublicUrl(path).data.publicUrl;const ins=await s.from('stories_reels').insert({user_id:user.id,body:body.value.trim(),media_url:url,media_type:'video'});if(ins.error){status.textContent=ins.error.message;return}body.value='';video.value='';status.textContent='Published ✓';await load()}async function copyLink(id){await navigator.clipboard.writeText(location.origin+location.pathname+'#'+id);alert('Reel link copied ✓')}async function shareReel(id){await copyLink(id)}init()</script></body></html>
