<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Sports</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#eef8f1;color:#173b29}header{background:#74c69d;color:#fff;padding:16px 5%;position:sticky;top:0;z-index:3}header b{font-size:23px}main{max-width:1100px;margin:auto;padding:18px}.card,.story{background:#fff;padding:18px;border:1px solid #dcebe1;border-radius:16px;margin:14px 0;box-shadow:0 3px 14px #245c3a14}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.story{margin:0}.tag{display:inline-block;background:#d8f3dc;color:#2d6a4f;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:bold}.muted{color:#718276;font-size:13px}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #d8e8dc;font:inherit}input,textarea,select{width:100%;margin:5px 0}button{background:#40916c;color:#fff;font-weight:bold;cursor:pointer}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:10px}.nav a{color:#14532d;font-weight:bold;margin-right:12px;text-decoration:none}.empty{text-align:center;padding:25px;color:#718276}.feed-share{margin-top:10px;background:#d8f3dc;color:#2d6a4f;border:0;border-radius:999px;padding:9px 14px;font-weight:800}@media(max-width:600px){main{padding:10px}.toolbar{grid-template-columns:1fr}}</style></head><body><header><b>🌿 Trooth</b> — 🏆 Live Sports Center</header><main><nav class="card nav"><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="stores.html">Stores</a><a href="auth.html">Profile</a></nav><section class="card"><h2>🏆 Publish Sports Story</h2><form id="form"><input id="title" placeholder="Headline" required><select id="category"><option>Cricket</option><option>Football</option><option>Basketball</option><option>Other Sports</option></select><textarea id="body" placeholder="Sports story or update..." required></textarea><button>Publish Story</button></form><p id="status" class="muted"></p></section><section class="card"><h2>🔴 Live Sports Feed</h2><div class="toolbar"><input id="search" placeholder="Search sports stories..."><select id="filter"><option>All</option><option>Cricket</option><option>Football</option><option>Basketball</option><option>Other Sports</option></select></div></section><section id="list" class="grid"></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load();sb.channel('trooth-sports-live').on('postgres_changes',{event:'*',schema:'public',table:'sports_stories'},load).subscribe()}async function load(){let r=await sb.from('sports_stories').select('*').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){let q=search.value.toLowerCase().trim(),f=filter.value;let a=rows.filter(x=>(f==='All'||x.category===f)&&((x.title||'')+' '+(x.body||'')+' '+(x.category||'')).toLowerCase().includes(q));list.innerHTML=a.map(x=>`<article class="story"><span class="tag">${esc(x.category)}</span><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small><div id="i-${x.id}" style="margin-top:12px"></div><button class="feed-share" onclick="shareToFeed('${x.id}')">🏠 Share to Trooth Feed</button></article>`).join('')||'<div class="card empty">No sports stories found.</div>';a.forEach(x=>{let e=document.getElementById('i-'+x.id);if(e)TroothInteractions.render(sb,user,'sports',x.id,e)})}async function shareToFeed(id){if(!user){alert('Please login first.');location.href='auth.html';return}const x=rows.find(r=>String(r.id)===String(id));if(!x)return;const text='🏆 '+x.category+' — '+x.title+'\n\n'+x.body;const r=await sb.from('posts').insert({user_id:user.id,body:text,media_url:null,media_type:null});if(r.error){alert(r.error.message);return}status.textContent='🏠 Sports story shared to your Trooth Feed ✓';setTimeout(()=>status.textContent='',2200)}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');location.href='auth.html';return}status.textContent='Publishing...';let r=await sb.from('sports_stories').insert({user_id:user.id,title:title.value.trim(),category:category.value,body:body.value.trim()});if(r.error){status.textContent='';alert(r.error.message);return}form.reset();status.textContent='Published ✓';await load()};search.oninput=render;filter.onchange=render;init()</script></body></html>
