<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Sports</title><style>body{font-family:Arial;margin:0;background:#f1f8f3;color:#163a24}header{background:#16a34a;color:white;padding:18px;box-shadow:0 2px 10px #16653433}main{max-width:1050px;margin:auto;padding:18px}.card,.story{background:white;padding:18px;border:1px solid #d8eadc;border-radius:16px;margin:14px 0;box-shadow:0 3px 14px #16653418}.card h2{color:#166534}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.story{margin:0}input,textarea,select,button{padding:11px;border-radius:9px;border:1px solid #cfe3d4;font:inherit}input,textarea,select{width:100%;box-sizing:border-box;margin:5px 0}button{background:#15803d;color:white;font-weight:bold;cursor:pointer}button:hover{background:#166534}a{color:#166534;font-weight:bold;margin-right:10px}.muted{color:#718276}nav{margin-bottom:8px}</style></head><body><header>🏆 <b>Trooth Sports Center</b></header><main><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="auth.html">Profile</a></nav><section class="card"><h2>Publish Sports Story</h2><form id="form"><input id="title" placeholder="Headline" required><select id="category"><option>Cricket</option><option>Football</option><option>Basketball</option><option>Other Sports</option></select><textarea id="body" placeholder="Sports story or update..." required></textarea><button>Publish Story</button></form></section><section class="card"><input id="search" placeholder="Search sports stories..."><div id="list" class="grid"></div></section></main><script src="supabase-client.js"></script><script src="content-interactions.js"></script><script>let sb,user,rows=[];const ready=()=>new Promise(r=>window.troothSupabase?r():addEventListener('trooth-supabase-ready',r,{once:true}));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){await ready();sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;await load()}async function load(){let r=await sb.from('sports_stories').select('*').order('created_at',{ascending:false});rows=r.data||[];render()}function render(){let q=search.value.toLowerCase();list.innerHTML=rows.filter(x=>(x.title+' '+x.body+' '+x.category).toLowerCase().includes(q)).map(x=>`<article class="story"><b style="color:#15803d">${esc(x.category)}</b><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small class="muted">${new Date(x.created_at).toLocaleString()}</small><div id="i-${x.id}" style="margin-top:12px"></div></article>`).join('')||'<p class="muted">No sports stories yet.</p>';rows.forEach(x=>TroothInteractions.render(sb,user,'sports',x.id,document.getElementById('i-'+x.id)))}form.onsubmit=async e=>{e.preventDefault();if(!user){alert('Please login first.');return}let r=await sb.from('sports_stories').insert({user_id:user.id,title:title.value.trim(),category:category.value,body:body.value.trim()});if(r.error){alert(r.error.message);return}form.reset();await load()};search.oninput=render;init()</script></body></html>
