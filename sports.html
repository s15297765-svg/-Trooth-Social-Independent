<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trooth Sports Center</title>
<style>
:root{--green:#b8f2c2;--dark:#14532d;--soft:#f3fff5;--white:#fff;--border:#cdebd4}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--soft);color:#18321f}header{background:var(--green);padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0001}header h1{margin:0;color:var(--dark);font-size:24px}nav a{margin-left:12px;color:var(--dark);text-decoration:none;font-weight:bold}.wrap{max-width:1050px;margin:24px auto;padding:0 16px}.hero,.card{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 14px #0000000d}.hero{background:linear-gradient(135deg,#dffff0,#b8f2c2)}.hero h2{margin:0 0 8px;color:var(--dark)}.search{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;font-size:16px;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:var(--dark);font-weight:bold;cursor:pointer}.tabs button.active{background:var(--dark);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.story{border:1px solid var(--border);border-radius:15px;padding:16px;background:#fbfffc}.story h3{margin:0 0 8px;color:var(--dark)}.meta{font-size:13px;color:#5d7563;margin-bottom:10px}.actions{display:flex;gap:8px;margin-top:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid input,.form-grid select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font:inherit}textarea{min-height:120px;resize:vertical}.full{grid-column:1/-1}.empty{text-align:center;padding:25px;color:#65786a}@media(max-width:650px){.form-grid{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header><h1>🏆 Trooth Sports</h1><nav><a href="index.html">Home</a><a href="friends.html">Friends</a><a href="business.html">Business</a><a href="news.html">News</a><a href="auth.html">Profile</a></nav></header>
<main class="wrap">
<section class="hero"><h2>Sports Center</h2><p>Cricket, Football, Basketball and more — share stories, updates and independent sports voices on Trooth.</p></section>
<section class="card"><input id="search" class="search" placeholder="Search sports stories..."><div class="tabs" id="tabs"><button class="active" data-cat="All">All</button><button data-cat="Cricket">🏏 Cricket</button><button data-cat="Football">⚽ Football</button><button data-cat="Basketball">🏀 Basketball</button><button data-cat="Other Sports">🏅 Other Sports</button></div></section>
<section class="card"><h2>Publish Sports Story</h2><form id="form"><div class="form-grid"><input id="title" placeholder="Story headline" required><input id="author" placeholder="Player / Author / Publisher" required><select id="category"><option>Cricket</option><option>Football</option><option>Basketball</option><option>Other Sports</option></select><input id="source" placeholder="Team / League / Source (optional)"><textarea id="body" class="full" placeholder="Write your sports story or update..." required></textarea></div><button class="btn" type="submit">Publish Story</button></form></section>
<section id="stories" class="grid"></section>
</main>
<script>
const KEY='troothSports';let active='All';
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function seed(){if(!localStorage.getItem(KEY)){localStorage.setItem(KEY,JSON.stringify([
{id:1,title:'Welcome to Trooth Sports Center',category:'Other Sports',author:'Trooth Team',source:'Trooth',body:'A new home for sports stories, community updates and independent sports voices.',likes:0},
{id:2,title:'Cricket Community on Trooth',category:'Cricket',author:'Trooth Sports',source:'Cricket Community',body:'Share cricket news, match discussions and local talent with the Trooth community.',likes:0},
{id:3,title:'Football Stories & Global Action',category:'Football',author:'Trooth Sports',source:'Football Community',body:'Follow football stories from local grounds to international competitions.',likes:0},
{id:4,title:'Basketball Fans Have a Place',category:'Basketball',author:'Trooth Sports',source:'Basketball Community',body:'Connect with basketball fans and share your favorite game moments.',likes:0}
]));}}
function get(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function notify(text){let n=JSON.parse(localStorage.getItem('troothNotifications')||'[]');n.unshift({id:Date.now(),text,read:false,time:new Date().toLocaleString()});localStorage.setItem('troothNotifications',JSON.stringify(n))}
function render(){let q=document.getElementById('search').value.toLowerCase();let data=get().filter(s=>(active==='All'||s.category===active)&&((s.title+' '+s.body+' '+s.author+' '+s.source).toLowerCase().includes(q)));let box=document.getElementById('stories');box.innerHTML=data.length?data.map(s=>`<article class="story"><div class="meta">${esc(s.category)} · ${esc(s.author)}${s.source?' · '+esc(s.source):''}</div><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p><div class="actions"><button class="btn" onclick="likeStory(${s.id})">👍 Like ${s.likes||0}</button><button class="btn" onclick="shareStory(${s.id})">↗ Share</button></div></article>`).join(''):'<div class="card empty">No sports stories found.</div>'}
function likeStory(id){let d=get(),s=d.find(x=>x.id===id);if(s){s.likes=(s.likes||0)+1;localStorage.setItem(KEY,JSON.stringify(d));render()}}
function shareStory(id){let s=get().find(x=>x.id===id);if(!s)return;let text=s.title+' — Trooth Sports';if(navigator.share)navigator.share({title:'Trooth Sports',text});else if(navigator.clipboard){navigator.clipboard.writeText(text);alert('Story title copied.');}else alert(text)}
document.getElementById('tabs').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;active=e.target.dataset.cat;document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render()});document.getElementById('search').addEventListener('input',render);
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let d=get();d.unshift({id:Date.now(),title:title.value.trim(),author:author.value.trim(),category:category.value,source:source.value.trim(),body:body.value.trim(),likes:0});localStorage.setItem(KEY,JSON.stringify(d));notify('A new sports story was published on Trooth Sports.');e.target.reset();render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});seed();render();
</script>
</body>
</html>
