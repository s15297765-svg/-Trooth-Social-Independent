<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#74c69d"><title>Trooth Notifications</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:13px 5%;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:900;margin-right:auto}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer;background:#40916c;color:#fff}.home{background:#fff;color:#2d6a4f}.wrap{width:min(900px,94%);margin:18px auto}.card{background:#fff;border-radius:18px;box-shadow:0 5px 20px #245c3a18;overflow:hidden}.head{padding:18px;border-bottom:1px solid #e3eee7;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.head h1{margin:0;flex:1;font-size:22px}.badge{min-width:24px;height:24px;border-radius:999px;background:#2d6a4f;color:#fff;display:inline-grid;place-items:center;font-size:11px;padding:0 7px}.notice{display:flex;gap:12px;padding:15px 18px;border-bottom:1px solid #edf4ef;align-items:center;cursor:pointer}.notice.unread{background:#f0fbf4}.notice:hover{background:#e7f6ed}.avatar{width:46px;height:46px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.body{flex:1;min-width:0}.body b{display:block;margin-bottom:4px}.body div:nth-child(2){overflow-wrap:anywhere}.time{font-size:12px;color:#718276;margin-top:4px}.dot{width:9px;height:9px;border-radius:50%;background:#2d6a4f;flex:none}.filters{display:flex;gap:7px;padding:12px 18px;border-bottom:1px solid #edf4ef;flex-wrap:wrap}.filter{border:1px solid #cfe5d6;background:#fff;color:#2d6a4f;border-radius:20px;padding:7px 11px;font-weight:700;cursor:pointer}.filter.active{background:#2d6a4f;color:#fff}.search{margin-left:auto;min-width:180px;flex:1;border:1px solid #dcebe2;border-radius:20px;padding:8px 12px;font:inherit}.empty{text-align:center;color:#718276;padding:45px 20px}@media(max-width:600px){.wrap{width:96%;margin:10px auto}.head{padding:14px}.notice{padding:13px}.avatar{width:42px;height:42px}.search{min-width:100%;order:5}.head h1{font-size:19px}}
</style></head><body><header class="top"><div class="logo">🌿 Trooth</div><button class="btn home" onclick="location.href='index.html'">🏠 Home</button></header><main class="wrap"><section class="card"><div class="head"><h1>🔔 Notifications <span id="count" class="badge" style="display:none"></span></h1><button class="btn" onclick="markAll()">✓ Mark all read</button></div><div class="filters"><button class="filter active" data-f="all" onclick="setFilter('all',this)">All</button><button class="filter" data-f="unread" onclick="setFilter('unread',this)">Unread</button><button class="filter" data-f="social" onclick="setFilter('social',this)">👥 Social</button><button class="filter" data-f="groups" onclick="setFilter('groups',this)">👥 Groups</button><button class="filter" data-f="content" onclick="setFilter('content',this)">👍 Content</button><input id="search" class="search" placeholder="Search notifications..." oninput="render()"></div><div id="list"><div class="empty">Loading notifications...</div></div></section></main><script src="supabase-client.js"></script><script>let sb,user,profiles={},rows=[],channel=null,authSub=null,timer=null,loading=false,pending=false,filter='all';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function category(k){if(['group_activity','group_announcement','group_join_request'].includes(k))return'groups';if(['like','comment','share'].includes(k))return'content';if(['follow','friend_request','friend_accept','message'].includes(k))return'social';return'social'}function label(k){return k==='message'?'You received a new message.':k==='follow'?'Someone followed you.':k==='friend_request'?'You received a friend request.':k==='friend_accept'?'Your friend request was accepted.':k==='group_announcement'?'New group announcement.':k==='group_join_request'?'New group join request.':k==='group_activity'?'New group activity.':k==='like'?'Someone liked your post.':k==='comment'?'Someone commented on your post.':k==='share'?'Someone shared your post.':'You have a new notification.'}function avatar(p){return p?.avatar_url?`<div class="avatar"><img src="${esc(p.avatar_url)}" alt=""></div>`:`<div class="avatar">${esc((p?.display_name||'T')[0].toUpperCase())}</div>`}function setFilter(f,b){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function route(n){if(n.kind==='message')return'chat.html';if(['follow','friend_request','friend_accept'].includes(n.kind))return'friends.html';if(['group_activity','group_announcement','group_join_request'].includes(n.kind))return'groups.html';if(['like','comment','share'].includes(n.kind))return n.post_id?'index.html?post='+encodeURIComponent(n.post_id):'index.html';return'notifications.html'}async function openNotification(n){if(!user)return;if(!n.is_read){await sb.from('notifications').update({is_read:true}).eq('id',n.id).eq('user_id',user.id);n.is_read=true;render();window.dispatchEvent(new CustomEvent('trooth-notification-read'))}location.href=route(n)}async function load(){if(!user)return;if(loading){pending=true;return}loading=true;try{const r=await sb.from('notifications').select('id,user_id,actor_id,kind,body,is_read,created_at,post_id').eq('user_id',user.id).order('created_at',{ascending:false}).limit(200);rows=r.data||[];const ids=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];if(ids.length){const p=await sb.from('profiles').select('id,display_name,avatar_url').in('id',ids);(p.data||[]).forEach(x=>profiles[x.id]=x)}render()}finally{loading=false;if(pending){pending=false;schedule(80)}}}function render(){const q=($('search').value||'').toLowerCase().trim(),list=rows.filter(n=>(filter==='all'||(filter==='unread'&&!n.is_read)||category(n.kind)===filter)&&(!q||(String(n.body||label(n.kind))+' '+(profiles[n.actor_id]?.display_name||'')).toLowerCase().includes(q)));const unread=rows.filter(n=>!n.is_read).length;$('count').style.display=unread?'inline-grid':'none';$('count').textContent=unread>99?'99+':unread;$('list').innerHTML=list.length?list.map(n=>{const p=profiles[n.actor_id];return `<div class="notice ${n.is_read?'':'unread'}" role="button" tabindex="0" onclick='openNotification(${JSON.stringify(n).replace(/'/g,'&#39;')})' onkeydown="if(event.key==='Enter'||event.key===' ')openNotification(${JSON.stringify(n).replace(/'/g,'&#39;')})">${avatar(p)}<div class="body"><b>${esc(p?.display_name||'Trooth Member')}</b><div>${esc(n.body||label(n.kind))}</div><div class="time">${new Date(n.created_at).toLocaleString()}</div></div>${n.is_read?'':'<span class="dot"></span>'}</div>`}).join(''):'<div class="empty">No matching notifications. 🎉</div>'}function schedule(ms){clearTimeout(timer);timer=setTimeout(load,ms||180)}async function markAll(){if(!user)return;const r=await sb.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);if(!r.error){rows.forEach(n=>n.is_read=true);render();window.dispatchEvent(new CustomEvent('trooth-unread-refresh'))}}function cleanup(){clearTimeout(timer);timer=null;if(channel){try{sb.removeChannel(channel)}catch(e){}channel=null}if(authSub){try{authSub.unsubscribe()}catch(e){}authSub=null}}async function realtime(){if(!user||channel)return;channel=sb.channel('trooth-notifications-page-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:'user_id=eq.'+user.id},()=>schedule()).subscribe()}async function init(){if(!window.troothSupabase)await new Promise(r=>window.addEventListener('trooth-supabase-ready',r,{once:true}));sb=window.troothSupabase;user=(await sb.auth.getUser()).data.user;if(user){await load();await realtime()}else $('list').innerHTML='<div class="empty">Please login first.</div>';const a=sb.auth.onAuthStateChange((event,session)=>{const next=session?.user;if(event==='SIGNED_OUT'){user=null;cleanup();$('list').innerHTML='<div class="empty">Please login first.</div>'}else if(next&&(!user||user.id!==next.id)){user=next;profiles={};cleanup();schedule(20);setTimeout(realtime,80)}});authSub=a.data?.subscription}window.addEventListener('beforeunload',cleanup);window.addEventListener('online',()=>schedule(250));document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(250)});init();</script></body></html>
