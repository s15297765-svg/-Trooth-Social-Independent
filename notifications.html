<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth Notifications</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#40916c;color:#fff}.home{background:#fff;color:#2d6a4f}.wrap{width:min(850px,94%);margin:22px auto}.card{background:#fff;border-radius:18px;box-shadow:0 5px 20px #245c3a18;overflow:hidden}.head{padding:20px;border-bottom:1px solid #e3eee7;display:flex;align-items:center;gap:10px}.head h1{margin:0;font-size:22px;flex:1}.notice{display:flex;gap:13px;padding:16px 18px;border-bottom:1px solid #edf4ef;align-items:center;cursor:pointer}.notice.unread{background:#f0fbf4}.notice:hover{background:#e7f6ed}.avatar{width:48px;height:48px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.body{flex:1}.body b{display:block;margin-bottom:5px}.time{font-size:12px;color:#718276}.badge{min-width:24px;height:24px;border-radius:999px;background:#2d6a4f;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}.empty{text-align:center;color:#718276;padding:50px 20px}@media(max-width:600px){.head{padding:16px}.head h1{font-size:19px}.notice{padding:14px}.avatar{width:42px;height:42px}}</style></head><body><header class="top"><div class="logo">Trooth Notifications</div><button class="btn home" onclick="location.href='index.html'">🏠 Home</button></header><main class="wrap"><section class="card"><div class="head"><h1>🔔 Notifications <span id="count" class="badge" style="display:none"></span></h1><button class="btn" onclick="markAll()">Mark all read</button></div><div id="list"><div class="empty">Loading notifications...</div></div></section></main><script src="supabase-client.js"></script><script>let sb,user,profiles={},channel=null,authSub=null,timer=null,loading=false,pending=false,booting=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ready=()=>new Promise(r=>window.troothSupabase?r():window.addEventListener('trooth-supabase-ready',r,{once:true}));function avatar(p){return p?.avatar_url?`<div class="avatar"><img src="${esc(p.avatar_url)}" alt=""></div>`:`<div class="avatar">${esc((p?.display_name||'T')[0].toUpperCase())}</div>`}function route(n){if(!n)return'notifications.html';if(n.kind==='message')return'chat.html';if(n.kind==='follow'||n.kind==='friend_request'||n.kind==='friend_accept')return'friends.html';if(n.kind==='group_activity'||n.kind==='group_announcement'||n.kind==='group_join_request')return'groups.html';if(n.kind==='like'||n.kind==='comment'||n.kind==='share')return n.post_id?'index.html?post='+encodeURIComponent(n.post_id):'index.html';return'notifications.html'}async function openNotification(n){if(!n||!user)return;if(!n.is_read){await sb.from('notifications').update({is_read:true}).eq('id',n.id).eq('user_id',user.id)}location.href=route(n)}async function load(){if(!user)return;if(loading){pending=true;return}loading=true;try{const r=await sb.from('notifications').select('id,user_id,actor_id,kind,body,is_read,created_at').eq('user_id',user.id).order('created_at',{ascending:false});const rows=r.data||[];const ids=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];if(ids.length){const p=await sb.from('profiles').select('id,display_name,avatar_url').in('id',ids);(p.data||[]).forEach(x=>profiles[x.id]=x)}const unread=rows.filter(x=>!x.is_read).length;$('count').style.display=unread?'grid':'none';$('count').textContent=unread>99?'99+':unread;$('list').innerHTML=rows.map(n=>{const p=profiles[n.actor_id],name=p?.display_name||'Trooth Member',payload=JSON.stringify(n).replace(/'/g,'&#39;');return `<div class="notice ${n.is_read?'':'unread'}" role="button" tabindex="0" onclick='openNotification(${payload})' onkeydown="if(event.key==='Enter'||event.key===' ')openNotification(${payload})">${avatar(p)}<div class="body"><b>${esc(name)}</b><div>${esc(n.body||label(n.kind))}</div><div class="time">${new Date(n.created_at).toLocaleString()}</div></div>${n.is_read?'':'<span class="badge">●</span>'}</div>`}).join('')||'<div class="empty">You have no notifications yet. 🎉</div>'}finally{loading=false;if(pending){pending=false;scheduleLoad(80)}}}function scheduleLoad(delay){clearTimeout(timer);timer=setTimeout(load,delay==null?180:delay)}function label(k){return k==='message'?'You received a new message.':k==='friend_request'?'You received a friend request.':k==='group_announcement'?'New group announcement.':k==='group_join_request'?'New group join request.':'You have a new notification.'}async function markAll(){if(!user)return;await sb.from('notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);scheduleLoad(40)}function cleanup(){clearTimeout(timer);timer=null;if(channel){try{sb.removeChannel(channel)}catch(e){}channel=null}if(authSub){try{authSub.unsubscribe()}catch(e){}authSub=null}}async function startRealtime(){if(!user||channel)return;channel=sb.channel('trooth-notifications-page-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:`user_id=eq.${user.id}`},function(){scheduleLoad()}).subscribe()}async function init(){if(booting)return;booting=true;await ready();sb=window.troothSupabase;const r=await sb.auth.getUser();user=r.data&&r.data.user;if(user){await load();await startRealtime()}else $('list').innerHTML='<div class="empty">Please login first.</div>';const a=sb.auth.onAuthStateChange(function(event,session){const next=session&&session.user;if(event==='SIGNED_OUT'){user=null;profiles={};cleanup();$('count').style.display='none';$('list').innerHTML='<div class="empty">Please login first.</div>';return}if(next&&(!user||user.id!==next.id)){user=next;profiles={};cleanup();scheduleLoad(20);setTimeout(startRealtime,30)}});authSub=a.data&&a.data.subscription;booting=false}window.addEventListener('beforeunload',cleanup);init();</script></body></html>
