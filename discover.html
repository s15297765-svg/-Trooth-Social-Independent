<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trooth — Discover</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef8f1;color:#173b29}.top{background:#74c69d;color:#fff;padding:14px 5%;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}.logo{font-size:26px;font-weight:800}.top input{flex:1;max-width:520px;border:0;border-radius:24px;padding:12px 16px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#40916c;color:#fff}.home{background:#fff;color:#2d6a4f}.wrap{width:min(1150px,94%);margin:22px auto}.hero,.card{background:#fff;border-radius:18px;box-shadow:0 5px 22px #245c3a18;padding:20px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#74c69d,#b7e4c7)}h1,h2{margin-top:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:0;background:#f1f7f3;color:#2d6a4f;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.tab.active{background:#40916c;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.person,.item{border:1px solid #dcebe1;border-radius:15px;padding:14px;background:#fbfefc}.person{display:flex;gap:11px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:#40916c;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:20px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.info{flex:1;min-width:0}.muted{color:#718276;font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2d6a4f;margin-left:4px}.badge{display:inline-block;background:#d8f3dc;color:#2d6a4f;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700}.item h3{margin:7px 0}.item p{line-height:1.45}.searchbox{margin-bottom:13px}.empty{padding:20px;text-align:center;color:#718276}.reelcard{border:1px solid #dcebe1;border-radius:15px;padding:16px;background:#fbfefc;display:flex;align-items:center;justify-content:space-between;gap:15px}.reelcard h2{margin:0 0 5px}.reelcard p{margin:0}.reelicon{font-size:42px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top input{display:none}.logo{font-size:22px}.reelcard{align-items:flex-start;flex-direction:column}.reelicon{display:none}}</style></head><body><header class="top"><div class="logo">Trooth</div><input id="search" placeholder="Search people, businesses, stories..." oninput="render()"><button class="btn home" onclick="location.href='index.html'">🏠 Home</button><button class="btn" onclick="location.href='chat.html'">💬 Chat</button></header><main class="wrap"><section class="hero"><h1>🌿 Discover Trooth</h1><p>Find people, explore the community and discover the latest activity across Trooth Social Independent.</p><div class="tabs"><button class="tab active" data-tab="people" onclick="setTab('people')">👥 People</button><button class="tab" data-tab="business" onclick="setTab('business')">💼 Businesses</button><button class="tab" data-tab="news" onclick="setTab('news')">📰 News</button><button class="tab" data-tab="sports" onclick="setTab('sports')">🏆 Sports</button><button class="tab" data-tab="film" onclick="setTab('film')">🎬 Film & Fashion</button></div></section><section class="card"><div class="reelcard"><div><span class="badge">NEW</span><h2>🎬 Trooth Reels</h2><p class="muted">Watch short community videos, publish your own Reel and share it with Trooth.</p></div><div><span class="reelicon">▶️</span><button class="btn" onclick="location.href='reels.html'">Open Reels</button></div></div></section><section class="card"><div id="summary" class="muted">Loading Discover...</div></section><section class="card"><div id="results" class="grid"></div></section></main><script src="supabase-client.js"></script><script>let sb=null,user=null,tab='people',people=[],online=new Set();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ready=()=>new Promise(r=>{if(window.troothSupabase)r();else window.addEventListener('trooth-supabase-ready',r,{once:true})});const nameOf=p=>p?.display_name||'Trooth Member';function avatar(p){return p?.avatar_url?`<div class="avatar"><img src="${esc(p.avatar_url)}"></div>`:`<div class="avatar">${esc(nameOf(p)[0].toUpperCase())}</div>`}async function init(){await ready();sb=window.troothSupabase;const u=await sb.auth.getUser();user=u.data.user||null;await Promise.all([loadPeople(),loadData()]);subscribePresence();render()}async function loadPeople(){const r=await sb.from('profiles').select('id,display_name,bio,avatar_url,is_public').neq('id',user?.id||'').order('display_name');people=(r.data||[]).filter(x=>x.is_public!==false)}async function loadData(){const [b,n,s,f]=await Promise.all([sb.from('businesses').select('id,name,category,description').order('created_at',{ascending:false}).limit(12),sb.from('news_stories').select('id,title,category,body').order('created_at',{ascending:false}).limit(12),sb.from('sports_stories').select('id,title,category,body').order('created_at',{ascending:false}).limit(12),sb.from('film_fashion_stories').select('id,title,category,body').order('created_at',{ascending:false}).limit(12)]);window.data={business:b.data||[],news:n.data||[],sports:s.data||[],film:f.data||[]}}function subscribePresence(){const c=sb.channel('trooth-discover-presence',{config:{presence:{key:user?.id||crypto.randomUUID()}}});c.on('presence',{event:'sync'},()=>{online.clear();const state=c.presenceState();Object.values(state).flat().forEach(x=>{if(x.userId)online.add(x.userId)});render()});c.subscribe(async status=>{if(status==='SUBSCRIBED')await c.track({userId:user?.id||null,online_at:new Date().toISOString()})})}function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}function render(){const q=($('search').value||'').toLowerCase();let html='';if(tab==='people'){const list=people.filter(p=>(nameOf(p)+' '+(p.bio||'')).toLowerCase().includes(q));$('summary').textContent=`${list.length} people found • ${online.size} currently online`;html=list.map(p=>`<div class="person">${avatar(p)}<div class="info"><b>${esc(nameOf(p))} ${online.has(p.id)?'<span class="dot"></span>':''}</b><div class="muted">${online.has(p.id)?'Online':'Offline'}</div><div class="muted">${esc(p.bio||'Trooth Community Member')}</div></div><button class="btn" onclick="location.href='profile.html?id=${encodeURIComponent(p.id)}'">Profile</button></div>`).join('')}else{const arr=window.data?.[tab==='film'?'film':tab]||[];const list=arr.filter(x=>(x.title||x.name||'').toLowerCase().includes(q)||(x.category||'').toLowerCase().includes(q)||(x.body||x.description||'').toLowerCase().includes(q));const labels={business:'Businesses',news:'News Stories',sports:'Sports Stories',film:'Film & Fashion Stories'};$('summary').textContent=`${list.length} ${labels[tab]||'results'} found`;html=list.map(x=>{const title=x.title||x.name||'Untitled';const desc=x.body||x.description||'';const page=tab==='business'?'business.html':tab==='news'?'news.html':tab==='sports'?'sports.html':'film-fashion.html';return `<div class="item"><span class="badge">${esc(x.category||'Community')}</span><h3>${esc(title)}</h3><p class="muted">${esc(desc).slice(0,150)}</p><button class="btn" onclick="location.href='${page}#${encodeURIComponent(x.id)}'">Open</button></div>`}).join('')}$('results').innerHTML=html||'<div class="empty">No results found. Try another search.</div>'}init()</script></body></html>
